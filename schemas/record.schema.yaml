$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://litespec.dev/7.0.0/schemas/record.schema.yaml'
title: LiteSpec Project Record
description: 'The record file holding a consumer record page: one page record or one container page, with the entry records it carries.'
oneOf:
- $ref: '#/$defs/productPage'
- $ref: '#/$defs/goalPage'
- $ref: '#/$defs/directionPage'
- $ref: '#/$defs/constraintPage'
- $ref: '#/$defs/researchPage'
- $ref: '#/$defs/decisionPage'
- $ref: '#/$defs/problemPage'
- $ref: '#/$defs/featurePage'
- $ref: '#/$defs/requirementPage'
- $ref: '#/$defs/actorPage'
- $ref: '#/$defs/rolePage'
- $ref: '#/$defs/flowPage'
- $ref: '#/$defs/modulePage'
- $ref: '#/$defs/knowledgeAreaPage'
- $ref: '#/$defs/aggregatePage'
- $ref: '#/$defs/useCasePage'
- $ref: '#/$defs/reactionPage'
- $ref: '#/$defs/jobPage'
- $ref: '#/$defs/notificationPage'
- $ref: '#/$defs/externalSystemPage'
- $ref: '#/$defs/integrationEventPage'
- $ref: '#/$defs/moduleEventPage'
- $ref: '#/$defs/readModelPage'
- $ref: '#/$defs/runbookPage'
- $ref: '#/$defs/waiverPage'
- $ref: '#/$defs/permissionSetPage'
- $ref: '#/$defs/entryPointPage'
- $ref: '#/$defs/entryPointSetPage'
- $ref: '#/$defs/screenPage'
- $ref: '#/$defs/settingPage'
- $ref: '#/$defs/rulePage'
- $ref: '#/$defs/domainEventPage'
- $ref: '#/$defs/referenceDataPage'
- $ref: '#/$defs/refusalSetPage'
- $ref: '#/$defs/indexPage'
- $ref: '#/$defs/tutorialPage'
- $ref: '#/$defs/howToPage'
- $ref: '#/$defs/referencePage'
- $ref: '#/$defs/commandPage'
- $ref: '#/$defs/configurationPage'
- $ref: '#/$defs/glossaryPage'
- $ref: '#/$defs/castPage'
$defs:
  productId:
    type: string
    pattern: '^product/[a-z0-9][a-z0-9-]*$'
  goalId:
    type: string
    pattern: '^goal/[a-z0-9][a-z0-9-]*$'
  directionId:
    type: string
    pattern: '^direction/[a-z0-9][a-z0-9-]*$'
  constraintId:
    type: string
    pattern: '^constraint/[a-z0-9][a-z0-9-]*$'
  researchId:
    type: string
    pattern: '^research/[a-z0-9][a-z0-9-]*$'
  decisionId:
    type: string
    pattern: '^decision/[0-9]{4}-[a-z0-9][a-z0-9-]*$'
  requirementId:
    type: string
    pattern: '^requirement/[a-z0-9][a-z0-9-]*(\.[a-z0-9][a-z0-9-]*)?$'
  problemId:
    type: string
    pattern: '^problem/[a-z0-9][a-z0-9-]*$'
  featureId:
    type: string
    pattern: '^feature/[a-z0-9][a-z0-9-]*$'
  actorId:
    type: string
    pattern: '^actor/[a-z0-9][a-z0-9-]*$'
  roleId:
    type: string
    pattern: '^role/[a-z0-9][a-z0-9-]*$'
  permissionId:
    type: string
    pattern: '^permission/[a-z0-9][a-z0-9-]*$'
  flowId:
    type: string
    pattern: '^flow/[a-z0-9][a-z0-9-]*$'
  flowStepId:
    type: string
    pattern: '^step/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  moduleId:
    type: string
    pattern: '^module/[a-z0-9][a-z0-9-]*$'
  knowledgeAreaId:
    type: string
    pattern: '^knowledge-area/[a-z0-9][a-z0-9-]*$'
  aggregateId:
    type: string
    pattern: '^aggregate/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  ruleId:
    type: string
    pattern: '^rule/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  useCaseId:
    type: string
    pattern: '^use-case/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  resultId:
    type: string
    pattern: '^result/[a-z0-9][a-z0-9-]*\.(?!(?:forbidden|invalid-input|not-found|conflict|unauthenticated|sign-in-too-old|rule-not-stated)$)[a-z0-9][a-z0-9-]*$'
  derivedResultId:
    type: string
    pattern: '^result/[a-z0-9][a-z0-9-]*\.(forbidden|invalid-input|not-found|conflict|unauthenticated|sign-in-too-old|rule-not-stated)$'
  scenarioId:
    type: string
    pattern: '^scenario/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  domainEventId:
    type: string
    pattern: '^domain-event/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  entryPointId:
    type: string
    pattern: '^entry-point/[a-z0-9][a-z0-9-]*$'
  screenId:
    type: string
    pattern: '^screen/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  externalSystemId:
    type: string
    pattern: '^external-system/[a-z0-9][a-z0-9-]*$'
  externalOperationRef:
    type: string
    pattern: '^external-system/[a-z0-9][a-z0-9-]*#[a-z0-9][a-z0-9-]*$'
  aggregateFieldRef:
    type: string
    pattern: '^aggregate/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*#[A-Za-z0-9]+$'
  aggregatePartRef:
    type: string
    pattern: '^aggregate/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*#[a-z0-9]+(-[a-z0-9]+)*$'
  aggregatePart:
    description: One child entity or value object inside the aggregate, with its kebab-case name and whether it carries its own identity.
    type: object
    additionalProperties: false
    required:
    - name
    properties:
      name:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      identity:
        description: True when the part carries its own identity, so an identifies field can name it.
        type: boolean
  reactionId:
    type: string
    pattern: '^reaction/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  readModelId:
    type: string
    pattern: '^read-model/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  jobId:
    type: string
    pattern: '^job/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  notificationId:
    type: string
    pattern: '^notification/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  settingId:
    type: string
    pattern: '^setting/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  referenceDataId:
    type: string
    pattern: '^reference-data/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  referenceDataRowRef:
    type: string
    pattern: '^reference-data/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*#[a-z0-9][a-z0-9-]*$'
  integrationEventId:
    type: string
    pattern: '^integration-event/[a-z0-9][a-z0-9-]*$'
  publishedEventId:
    anyOf:
    - $ref: '#/$defs/moduleEventId'
    - $ref: '#/$defs/integrationEventId'
  moduleEventId:
    type: string
    pattern: '^module-event/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  runbookId:
    type: string
    pattern: '^runbook/[a-z0-9][a-z0-9-]*$'
  waiverId:
    type: string
    pattern: '^waiver/[a-z0-9][a-z0-9-]*$'
  termId:
    type: string
    pattern: '^term/[a-z0-9][a-z0-9-]*$'
  castId:
    type: string
    pattern: '^cast/[a-z0-9][a-z0-9-]*$'
  partyId:
    type: string
    pattern: '^party/[a-z0-9][a-z0-9-]*$'
  personId:
    type: string
    pattern: '^person/[a-z0-9][a-z0-9-]*$'
  occasionId:
    type: string
    pattern: '^occasion/[a-z0-9][a-z0-9-]*$'
  figureId:
    type: string
    pattern: '^figure/[a-z0-9][a-z0-9-]*$'
  refusalId:
    type: string
    pattern: '^refusal/[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  findingCode:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  standardsProvisionId:
    type: string
    pattern: '^litespec/[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*#[a-z0-9]+(?:-[a-z0-9]+)*$'
  standardsPageId:
    type: string
    pattern: '^litespec/[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*$'
  genericRecordId:
    type: string
    pattern: '^[a-z][a-z-]+/[a-z0-9][a-z0-9._-]*$'
  identifiesId:
    description: The record an id field refers to, or an identified part of an aggregate as aggregate/<module>.<aggregate>#<part>.
    anyOf:
    - $ref: '#/$defs/genericRecordId'
    - $ref: '#/$defs/aggregatePartRef'
  classification:
    enum:
    - public
    - internal
    - personal
    - sensitive
  isoDate:
    type: string
    format: date
    pattern: '^\d{4}-\d{2}-\d{2}$'
  nonEmptyString:
    type: string
    minLength: 1
  qualifiedTypeName:
    description: A qualified code type name with its namespace.
    type: string
    pattern: '^[A-Z][A-Za-z0-9]*(\.[A-Z][A-Za-z0-9]*)+$'
  sentenceArray:
    description: A list of plain sentences, each one complete sentence ending in a period.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/nonEmptyString'
  sourcedStatement:
    description: One statement with the names of the sources in this record that support it.
    type: object
    additionalProperties: false
    required:
    - statement
    - sources
    properties:
      statement:
        $ref: '#/$defs/nonEmptyString'
      sources:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  useCaseStep:
    description: One step of a use case, in order, with the records it applies.
    type: object
    additionalProperties: false
    required:
    - statement
    properties:
      statement:
        $ref: '#/$defs/nonEmptyString'
      cites:
        $ref: '#/$defs/useCaseStepCitesArray'
        x-reads-as: applies
        x-read-back-as: is applied in
  useCaseStepCitesArray:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/ruleId'
      - $ref: '#/$defs/resultId'
      - $ref: '#/$defs/settingId'
      - $ref: '#/$defs/domainEventId'
      - $ref: '#/$defs/readModelId'
      - $ref: '#/$defs/externalSystemId'
      - $ref: '#/$defs/aggregateId'
      - $ref: '#/$defs/referenceDataId'
  screenState:
    description: One state a screen can show, and what the screen shows in it.
    type: object
    additionalProperties: false
    required:
    - name
    - shows
    properties:
      name:
        $ref: '#/$defs/nonEmptyString'
      shows:
        $ref: '#/$defs/nonEmptyString'
  screenShowsEntry:
    description: One use-case field a screen shows, naming the offered use case that outputs or accepts it.
    type: object
    additionalProperties: false
    required:
    - field
    - from
    properties:
      field:
        description: The field as the use case spells it in its input or output.
        $ref: '#/$defs/nonEmptyString'
      from:
        description: The offered use case that outputs or accepts the field.
        $ref: '#/$defs/useCaseId'
        x-reads-as: shows fields from
        x-read-back-as: provides fields to
  sessionPolicy:
    description: How long a session on this entry point lasts.
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      lifetime:
        $ref: '#/$defs/isoDuration'
      idleTimeout:
        $ref: '#/$defs/isoDuration'
  termIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/termId'
  actorIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/actorId'
  permissionIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/permissionId'
  roleIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/roleId'
  moduleIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/moduleId'
  aggregateIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/aggregateId'
  decisionIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/decisionId'
  ruleIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/ruleId'
  domainEventIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/domainEventId'
  reachedThroughArray:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/entryPointId'
      - $ref: '#/$defs/moduleId'
  screenIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/screenId'
  problemIdArray:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/problemId'
  goalIdArray:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/goalId'
  requirementIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/requirementId'
  useCaseIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/useCaseId'
  flowStepIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/flowStepId'
  riskArray:
    type: array
    uniqueItems: true
    items:
      enum:
      - money
      - physical-access
      - personal-data
      - access
  waiverSubjectArray:
    type: array
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/genericRecordId'
      - $ref: '#/$defs/flowStepId'
  basedOnArray:
    type: array
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/constraintId'
      - $ref: '#/$defs/researchId'
  decisionBasedOnArray:
    type: array
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/constraintId'
      - $ref: '#/$defs/researchId'
      - $ref: '#/$defs/directionId'
      - $ref: '#/$defs/requirementId'
  researchIdArray:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/researchId'
  citesArray:
    type: array
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/goalId'
      - $ref: '#/$defs/directionId'
      - $ref: '#/$defs/problemId'
      - $ref: '#/$defs/featureId'
      - $ref: '#/$defs/constraintId'
      - $ref: '#/$defs/researchId'
      - $ref: '#/$defs/decisionId'
  settledBasedOnArray:
    type: array
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/constraintId'
      - $ref: '#/$defs/researchId'
      - $ref: '#/$defs/decisionId'
  governsArray:
    type: array
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/aggregateId'
      - $ref: '#/$defs/useCaseId'
  readsArray:
    type: array
    uniqueItems: true
    items:
      anyOf:
      - $ref: '#/$defs/aggregateId'
      - $ref: '#/$defs/settingId'
      - $ref: '#/$defs/readModelId'
      - $ref: '#/$defs/referenceDataId'
  scenarioResultValue:
    anyOf:
    - $ref: '#/$defs/resultId'
    - $ref: '#/$defs/derivedResultId'
  outcomeName:
    enum:
    - completed
    - skipped
    - suppressed
    - failed
    - retry-scheduled
    - nothing-selected
  outcomeEntry:
    type: object
    additionalProperties: false
    required:
    - name
    - meaning
    properties:
      name:
        $ref: '#/$defs/outcomeName'
      meaning:
        $ref: '#/$defs/nonEmptyString'
  outcomesArray:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/outcomeEntry'
  settlesObject:
    type: object
    additionalProperties: false
    required:
    - aggregate
    - pending
    - done
    properties:
      aggregate:
        $ref: '#/$defs/aggregateId'
        x-reads-as: settles
        x-read-back-as: is settled by
      pending:
        $ref: '#/$defs/nonEmptyString'
      done:
        $ref: '#/$defs/nonEmptyString'
      refused:
        $ref: '#/$defs/nonEmptyString'
  settingValue:
    anyOf:
    - type: string
    - type: number
    - type: boolean
    - $ref: '#/$defs/moneyValue'
  authKind:
    enum:
    - session
    - token
    - device
    - link
    - app
    - none
  authKindArray:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/authKind'
  grantValue:
    type: string
    pattern: '^(permission/[a-z0-9][a-z0-9-]*|self\(permission/[a-z0-9][a-z0-9-]*\)|signed-in|anonymous|system)$'
  tenantScope:
    enum:
    - own
    - cross
    - public
    - none
  accessObject:
    type: object
    additionalProperties: false
    required:
    - grant
    - tenant
    properties:
      grant:
        $ref: '#/$defs/grantValue'
        x-reads-as: is granted through
        x-read-back-as: grants
      tenant:
        $ref: '#/$defs/tenantScope'
      recentSignIn:
        anyOf:
        - $ref: '#/$defs/isoDuration'
        - $ref: '#/$defs/settingId'
        x-reads-as: is limited by
        x-read-back-as: limits
      scope:
        enum:
        - self
      identityInput:
        $ref: '#/$defs/nonEmptyString'
      preconditions:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/ruleId'
        x-reads-as: is authorized under
        x-read-back-as: authorizes
      runsAs:
        enum:
        - system
    allOf:
    - if:
        required:
        - grant
        properties:
          grant:
            const: system
      then:
        not:
          required:
          - runsAs
    - if:
        required:
        - grant
        properties:
          grant:
            const: anonymous
      then:
        not:
          required:
          - runsAs
    - if:
        required:
        - scope
      then:
        required:
        - identityInput
    - if:
        required:
        - identityInput
      then:
        required:
        - scope
  freshnessValue:
    type: object
    additionalProperties: false
    required:
    - mode
    properties:
      mode:
        enum:
        - immediate
        - snapshot
        - eventual
      within:
        $ref: '#/$defs/isoDuration'
      decidedBy:
        anyOf:
        - $ref: '#/$defs/useCaseId'
        - $ref: '#/$defs/aggregateId'
        x-reads-as: is decided by
        x-read-back-as: decides
    allOf:
    - if:
        required:
        - mode
        properties:
          mode:
            const: eventual
      then:
        required:
        - within
    - if:
        required:
        - mode
        properties:
          mode:
            const: immediate
      then:
        not:
          required:
          - decidedBy
  contractValueType:
    enum:
    - text
    - integer
    - decimal
    - money
    - boolean
    - date
    - instant
    - duration
    - email
    - choice
    - id
    - list
    - file
  contractScalarType:
    enum:
    - text
    - integer
    - decimal
    - money
    - boolean
    - date
    - instant
    - duration
    - email
    - choice
    - id
  contractFieldChoices:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/nonEmptyString'
  valueMeanings:
    description: The meaning of each closed value, keyed by its written choice text; every key names a value the record lists in `choices`.
    type: object
    additionalProperties:
      $ref: '#/$defs/nonEmptyString'
  contractContentTypes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: '^[a-z]+/[a-z0-9.+-]+$'
  contractMaxSize:
    type: string
    pattern: '^[0-9]+(\.[0-9]+)? (B|KB|MB|GB)$'
  contractCurrencyCode:
    type: string
    pattern: '^[A-Z]{3}$'
  contractBounds:
    description: The allowed span of a numeric field, with at least one end stated and both ends inclusive unless inclusive is false.
    type: object
    additionalProperties: false
    properties:
      min:
        type: number
      max:
        type: number
      inclusive:
        type: boolean
    anyOf:
    - required:
      - min
    - required:
      - max
  contractClosedSet:
    description: The closed value set a choice field takes its values from, as a reference-data table holding choices or a choice setting.
    anyOf:
    - $ref: '#/$defs/referenceDataId'
    - $ref: '#/$defs/settingId'
  contractRowField:
    type: object
    additionalProperties: false
    x-rejected-fields:
      choices: "Choice fields name their closed set in `set`: move inline values to a reference-data table or a choice setting and name it there."
    required:
    - name
    - type
    - required
    - meaning
    properties:
      name:
        $ref: '#/$defs/nonEmptyString'
      type:
        description: 'The row value shape: one of the scalar types, or a list of one more row shape holding scalar fields.'
        anyOf:
        - $ref: '#/$defs/contractScalarType'
        - const: list
      required:
        type: boolean
      meaning:
        $ref: '#/$defs/nonEmptyString'
      identifies:
        $ref: '#/$defs/identifiesId'
        x-reads-as: identifies
        x-read-back-as: is identified by
      rowShape:
        $ref: '#/$defs/contractListShape'
      rowType:
        $ref: '#/$defs/contractExistingType'
        x-reads-as: takes rows from
        x-read-back-as: gives rows to
      set:
        $ref: '#/$defs/contractClosedSet'
        x-reads-as: takes values from
        x-read-back-as: gives values to
      currency:
        $ref: '#/$defs/contractCurrencyCode'
      currencyField:
        $ref: '#/$defs/nonEmptyString'
      currencyHome:
        $ref: '#/$defs/aggregateId'
        x-reads-as: takes its currency from
        x-read-back-as: gives its currency to
      scale:
        type: integer
        minimum: 0
      minLength:
        type: integer
        minimum: 0
      maxLength:
        type: integer
        minimum: 0
      bounds:
        $ref: '#/$defs/contractBounds'
      matches:
        $ref: '#/$defs/nonEmptyString'
    allOf:
    - $ref: '#/$defs/contractValueRules'
  contractListShape:
    description: "The rows of a list value: each field of a row with its type, its requiredness and its meaning, the number of rows at least, and the fields that must be unique across rows."
    type: object
    additionalProperties: false
    required:
    - fields
    properties:
      fields:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/contractRowField'
      minItems:
        type: integer
        minimum: 0
      unique:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
  contractRowType:
    description: The C# row type a multi-field list renders, as a PascalCase type name.
    type: string
    pattern: '^[A-Z][A-Za-z0-9]*$'
  contractExistingType:
    description: 'An existing type a carried event field reuses instead of a generated one: an aggregate part as aggregate/<module>.<aggregate>#<part>, or the C# type name.'
    anyOf:
    - $ref: '#/$defs/aggregatePartRef'
    - $ref: '#/$defs/contractRowType'
  contractValueRules:
    description: Ties a value field's type to the properties that type needs, so a list names its row shape in rowShape and keeps its row type in rowType, a choice names its closed set in set, a money field names its currency source, a decimal states its scale and a file names its media types and size. An id field may name its record in identifies, and reads as an untyped identifier without it.
    allOf:
    - if:
        required:
        - type
        properties:
          type:
            const: list
      then:
        required:
        - rowShape
        properties:
          rowShape:
            $ref: '#/$defs/contractListShape'
    - if:
        required:
        - type
        properties:
          type:
            const: id
      else:
        not:
          required:
          - identifies
    - if:
        required:
        - type
        properties:
          type:
            const: list
      else:
        not:
          required:
          - rowShape
    - if:
        required:
        - type
        properties:
          type:
            const: list
      else:
        not:
          required:
          - rowType
    - if:
        required:
        - type
        properties:
          type:
            const: choice
      then:
        required:
        - set
      else:
        not:
          required:
          - set
    - if:
        required:
        - type
        properties:
          type:
            const: file
      then:
        required:
        - contentTypes
        - maxSize
      else:
        not:
          anyOf:
          - required:
            - contentTypes
          - required:
            - maxSize
    - if:
        required:
        - type
        properties:
          type:
            const: money
      then:
        oneOf:
        - required:
          - currency
        - required:
          - currencyField
        - required:
          - currencyHome
      else:
        not:
          anyOf:
          - required:
            - currency
          - required:
            - currencyField
          - required:
            - currencyHome
    - if:
        required:
        - type
        properties:
          type:
            const: decimal
      then:
        required:
        - scale
      else:
        not:
          required:
          - scale
    - if:
        required:
        - type
        properties:
          type:
            enum:
            - text
            - email
      else:
        not:
          anyOf:
          - required:
            - minLength
          - required:
            - maxLength
          - required:
            - matches
    - if:
        required:
        - type
        properties:
          type:
            enum:
            - integer
            - decimal
            - money
      else:
        not:
          required:
          - bounds
  moneyValue:
    type: object
    additionalProperties: false
    required:
    - amount
    - currency
    properties:
      amount:
        type: number
      currency:
        type: string
        pattern: '^[A-Z]{3}$'
  amountSign:
    description: "The sign convention of an amount field, naming which direction reads positive."
    enum:
    - money-in-positive
    - money-out-positive
  outputField:
    type: object
    additionalProperties: false
    x-rejected-fields:
      choices: "Choice fields name their closed set in `set`: move inline values to a reference-data table or a choice setting and name it there."
    required:
    - name
    - meaning
    - type
    properties:
      name:
        $ref: '#/$defs/nonEmptyString'
      meaning:
        $ref: '#/$defs/nonEmptyString'
      type:
        $ref: '#/$defs/contractValueType'
      identifies:
        $ref: '#/$defs/identifiesId'
        x-reads-as: identifies
        x-read-back-as: is identified by
      held:
        description: How the module keeps the identifier the field names. Opaque states the module stores and passes the identifier but never loads, queries, or reasons about the named aggregate.
        enum:
        - opaque
      rowShape:
        $ref: '#/$defs/contractListShape'
      rowType:
        $ref: '#/$defs/contractRowType'
      set:
        $ref: '#/$defs/contractClosedSet'
        x-reads-as: takes values from
        x-read-back-as: gives values to
      currency:
        $ref: '#/$defs/contractCurrencyCode'
      currencyField:
        $ref: '#/$defs/nonEmptyString'
      currencyHome:
        $ref: '#/$defs/aggregateId'
        x-reads-as: takes its currency from
        x-read-back-as: gives its currency to
      scale:
        type: integer
        minimum: 0
      minLength:
        type: integer
        minimum: 0
      maxLength:
        type: integer
        minimum: 0
      bounds:
        $ref: '#/$defs/contractBounds'
      matches:
        $ref: '#/$defs/nonEmptyString'
      contentTypes:
        $ref: '#/$defs/contractContentTypes'
      maxSize:
        $ref: '#/$defs/contractMaxSize'
      many:
        description: True when the field holds a list of values of its type.
        type: boolean
      required:
        description: False when the use case may answer without the field; a missing flag reads as required.
        type: boolean
      sign:
        $ref: '#/$defs/amountSign'
    allOf:
    - $ref: '#/$defs/contractValueRules'
    - if:
        required:
        - type
        - rowShape
        properties:
          type:
            const: list
          rowShape:
            properties:
              fields:
                minItems: 2
      then:
        required:
        - rowType
    - if:
        required:
        - type
        properties:
          type:
            enum:
            - money
            - decimal
      else:
        not:
          required:
          - sign
    - if:
        required:
        - held
      then:
        required:
        - identifies
  outputGroup:
    type: object
    additionalProperties: false
    required:
    - fields
    - classification
    - reads
    - freshness
    properties:
      fields:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/outputField'
      classification:
        $ref: '#/$defs/classification'
      reads:
        $ref: '#/$defs/readsArray'
        x-reads-as: reads
        x-read-back-as: is read by
      freshness:
        $ref: '#/$defs/freshnessValue'
