  referenceDataRow:
    type: object
    additionalProperties:
      $ref: '#/$defs/referenceDataExtraField'
    required:
    - value
    - effectiveFrom
    - source
    properties:
      value:
        anyOf:
        - $ref: '#/$defs/nonEmptyString'
        - type: number
        - type: boolean
      key:
        description: The stable key of the row within its table, which rows of other tables name in `refersTo`.
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
      role:
        description: The role the row plays from the roles the table requires.
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
      variant:
        description: The variant the row belongs to, from the variants of the table's knowledge area.
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
      refersTo:
        description: 'The row of another table this row reads, as `reference-data/<home>.<table>#<key>`.'
        $ref: '#/$defs/referenceDataRowRef'
        x-reads-as: refers to
        x-read-back-as: is referred to by
      effectiveFrom:
        $ref: '#/$defs/isoDate'
      effectiveTo:
        $ref: '#/$defs/isoDate'
      source:
        anyOf:
        - $ref: '#/$defs/constraintId'
        - $ref: '#/$defs/researchId'
        - $ref: '#/$defs/decisionId'
        x-reads-as: rests on
        x-read-back-as: is the source for
  referenceDataExtraField:
    description: 'An extra field value of a generated table row: a scalar a leaf column reads, or a list a list column reads. Tables without row construction state no extra field.'
    anyOf:
    - $ref: '#/$defs/nonEmptyString'
    - type: number
    - type: boolean
    - type: array
      items:
        anyOf:
        - $ref: '#/$defs/nonEmptyString'
        - type: number
        - type: boolean
        - $ref: '#/$defs/referenceDataItemMap'
  referenceDataItemMap:
    description: 'One item map of an object list: the fields one item builds from, each read by a sub-column of the list entry.'
    type: object
    additionalProperties:
      $ref: '#/$defs/referenceDataExtraField'
  referenceDataClosedRow:
    description: 'One row of a table without row construction: the fixed row fields with no extra field.'
    allOf:
    - $ref: '#/$defs/referenceDataRow'
    - propertyNames:
        enum:
        - value
        - key
        - role
        - variant
        - refersTo
        - effectiveFrom
        - effectiveTo
        - source
  referenceDataRowConstruction:
    description: 'How one reference-data table builds its knowledge rows: the qualified model row type, built through the constructor or the named static factory method.'
    type: object
    additionalProperties: false
    required:
    - type
    properties:
      type:
        description: The qualified model row type the constructor or factory builds.
        $ref: '#/$defs/qualifiedTypeName'
      factory:
        description: The static factory method building one row. When absent, rows build through the constructor.
        type: string
        pattern: '^[A-Z][A-Za-z0-9]*$'
  referenceDataColumn:
    description: 'One column-to-parameter mapping of a reference-data table: the row field one row parameter reads and how its value renders, the sub-columns building one nested object, or the items building one list.'
    type: object
    additionalProperties: false
    required:
    - parameter
    - as
    properties:
      column:
        description: 'The row field the parameter reads: a fixed row field or an extra field the rows state. An object entry states none; a sub-column of object items reads an item field.'
        type: string
        pattern: '^[a-z][A-Za-z0-9]*$'
      parameter:
        description: The row parameter name.
        type: string
        pattern: '^[a-z][A-Za-z0-9]*$'
      as:
        description: 'How the column value renders: a literal of its kind, a date construction, a money construction, a decimal, a typed key through the model factory, a member of the model closed set, a case of the model nested closed set, a nested object from its sub-columns, a mapped literal, or a list of items.'
        enum:
        - string
        - number
        - boolean
        - date
        - money
        - decimal
        - key
        - member
        - case
        - object
        - map
        - list
      items:
        description: 'How each item of a list column renders: any rendering but a list. An object item builds from the entry sub-columns. Only a list entry states it.'
        enum:
        - string
        - number
        - boolean
        - date
        - money
        - decimal
        - key
        - member
        - case
        - object
        - map
      type:
        description: The qualified model type of a money, key, member, case or object column, or of the items of a list column.
        $ref: '#/$defs/qualifiedTypeName'
      factory:
        description: The static factory method building a typed key or the key items of a list. Defaults to From.
        enum:
        - Parse
        - From
        - FromCode
        - Of
        - Create
      currency:
        description: The three-letter currency code of a money column or of the money items of a list.
        type: string
        pattern: '^[A-Z]{3}$'
      literals:
        description: The literal each row value or each list item maps to, for a map column.
        type: object
        minProperties: 1
        additionalProperties:
          type: string
          minLength: 1
      columns:
        description: The sub-columns building a nested object, one entry per nested parameter. Only an object entry or a list entry with object items states it.
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/referenceDataColumn'
  referenceDataPage:
    type: object
    additionalProperties: false
    required:
    - type
    - id
    - title
    - rows
    properties:
      type:
        const: reference-data
      id:
        $ref: '#/$defs/referenceDataId'
      title:
        $ref: '#/$defs/nonEmptyString'
      terms:
        $ref: '#/$defs/termIdArray'
        x-reads-as: uses
        x-read-back-as: is used by
      summary:
        $ref: '#/$defs/nonEmptyString'
      unit:
        $ref: '#/$defs/nonEmptyString'
      choices:
        description: The closed set of values the rows may hold; a row value outside it is invalid.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          anyOf:
          - $ref: '#/$defs/nonEmptyString'
          - type: number
          - type: boolean
      valueMeanings:
        $ref: '#/$defs/valueMeanings'
      requiredRoles:
        description: The roles the citing rules read, each played by at least one row in `role`.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
      variation:
        description: The dimension the table varies by, such as country; each row names its variant in `variant`.
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
      singleton:
        description: 'True when the table holds one value instead of a row list: one dated row with no key per variant, rendered as Value. Only knowledge tables state it, together with `row` and `columns`.'
        type: boolean
      pack:
        description: 'The path of an external pack file, relative to the consumer root, whose values this table copies. The file must exist.'
        $ref: '#/$defs/nonEmptyString'
      row:
        description: How the table builds its knowledge rows through the model factory. Only knowledge tables state it, together with `columns`.
        $ref: '#/$defs/referenceDataRowConstruction'
      columns:
        description: The column-to-parameter mapping building each row, one entry per row parameter. Only knowledge tables state it, together with `row`.
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/referenceDataColumn'
      rows:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/referenceDataRow'
    allOf:
    - if:
        required:
        - valueMeanings
      then:
        required:
        - choices
    - if:
        required:
        - row
      then: {}
      else:
        properties:
          rows:
            items:
              $ref: '#/$defs/referenceDataClosedRow'
