        x-read-back-as: keeps
      guards:
        description: The aggregates the command reads and does not write whose rule in boundBy must still hold when the command commits.
        $ref: '#/$defs/aggregateIdArray'
        x-reads-as: holds the guard of
        x-read-back-as: is guarded by
  conflictsObject:
    description: How a command resolves a write that conflicts with another, under the concurrency extension.
    type: object
    additionalProperties: false
    required:
    - subject
    - winner
    - refusal
    properties:
      subject:
        $ref: '#/$defs/nonEmptyString'
      winner:
        enum:
        - first-write
        - last-write
        - merge
      refusal:
        $ref: '#/$defs/refusalId'
        x-reads-as: is refused as
        x-read-back-as: is the refusal for
  onFailureValue:
    type: object
    additionalProperties: false
    required:
    - mode
    properties:
      mode:
        enum:
        - retry
        - skip-and-log
        - discard
      retry:
