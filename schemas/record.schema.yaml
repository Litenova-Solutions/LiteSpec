      ifExhausted:
        const: dead-letter
      deadLetter:
        $ref: '#/$defs/deadLetterPolicy'
      surfacesIn:
        $ref: '#/$defs/entryPointId'
        x-reads-as: surfaces in
        x-read-back-as: surfaces
      runbook:
        $ref: '#/$defs/runbookId'
        x-reads-as: is answered by
        x-read-back-as: answers
    allOf:
    - if:
        required:
        - mode
        properties:
          mode:
            const: retry
      then:
        required:
        - retry
        - ifExhausted
  effectEntry:
    type: object
    additionalProperties: false
    required:
    - timing
    properties:
      sends:
        $ref: '#/$defs/notificationId'
        x-reads-as: sends
        x-read-back-as: is sent by
      calls:
        $ref: '#/$defs/externalOperationRef'
        x-reads-as: calls
        x-read-back-as: is called by
      queries:
        $ref: '#/$defs/useCaseId'
        x-reads-as: queries
        x-read-back-as: is queried by
      timing:
        enum:
        - inline
