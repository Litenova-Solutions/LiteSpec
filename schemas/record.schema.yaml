        - async
      onFailure:
        $ref: '#/$defs/onFailureValue'
      onExhausted:
        $ref: '#/$defs/nonEmptyString'
      before:
        $ref: '#/$defs/nonEmptyString'
      forEach:
        $ref: '#/$defs/nonEmptyString'
    oneOf:
    - required:
      - sends
    - required:
      - calls
    - required:
      - queries
  triggeredEffectEntry:
    type: object
    additionalProperties: false
    properties:
      runs:
        $ref: '#/$defs/useCaseId'
        x-reads-as: runs
        x-read-back-as: is run by
      sends:
        $ref: '#/$defs/notificationId'
        x-reads-as: sends
        x-read-back-as: is sent by
      calls:
        $ref: '#/$defs/externalOperationRef'
        x-reads-as: calls
        x-read-back-as: is called by
      queries:
        $ref: '#/$defs/useCaseId'
        x-reads-as: queries
        x-read-back-as: is queried by
      commands:
        $ref: '#/$defs/useCaseId'
        x-reads-as: commands
        x-read-back-as: is commanded by
      timing:
        enum:
        - inline
        - after-commit
        - async
      onExhausted:
        $ref: '#/$defs/nonEmptyString'
      before:
        $ref: '#/$defs/nonEmptyString'
      forEach:
        $ref: '#/$defs/nonEmptyString'
    oneOf:
    - required:
      - runs
    - required:
      - sends
    - required:
      - calls
    - required:
      - queries
    - required:
      - commands
  isoDuration:
    type: string
    pattern: '^P(?=.*\d)(?:\d+Y)?(?:\d+M)?(?:\d+W)?(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$'
  retryPolicy:
