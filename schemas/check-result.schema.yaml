$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://litespec.dev/5.1.0/schemas/check-result.schema.yaml'
title: LiteSpec Check Result
description: One result a drill or measuring harness writes under paths.checkResults. A file that does not match it is reported as proof-invalid, so a harness that writes a malformed result cannot pass silently.
type: object
required:
- check
- passed
properties:
  check:
    description: The name of the check the result proves. A measured requirement names the same check.
    type: string
    minLength: 1
  passed:
    description: Whether the check passed in the run the file records.
    type: boolean
  value:
    description: The measured value the check reports, when it reports one.
    type: string
  ranOn:
    description: The environment the check ran on, such as an environment name or a host.
    type: string
