$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://litespec.dev/7.0.0/schemas/design-contract.schema.yaml'
title: LiteSpec Frontend Design Contract
description: The metadata block opening the DESIGN.md a shared UI package ships. The block carries what a validator resolves; the sections under it carry what a reader and an agent compose from.
type: object
additionalProperties: false
required:
- schemaVersion
- package
- pageFrames
- tokens
properties:
  schemaVersion:
    $comment: 'Each release pins one exact shape. A consumer adopting a later release absorbs every difference at that moment, so no minor-compatible range exists between two releases. See litespec/core/authoring#publish-each-release-as-a-complete-contract and litespec/core/authoring#exclude-cross-release-compatibility-work.'
    const: 2
  package:
    description: The shared UI package this contract travels with.
    type: string
    minLength: 1
  profile:
    description: The density the contract's worked example is written at. A package serving several frontends states one.
    type: string
    enum:
    - public-light
    - application-balanced
    - admin-dense
  pageFrames:
    $comment: The page frames this frontend provides, each mapped to the component that implements it. The screen record names the frame each screen follows, and the Page Frames section states when to use it.
    description: The component implementing each page-frame pattern, keyed by the pattern slug.
    type: object
    minProperties: 1
    propertyNames:
      pattern: '^[a-z][a-z0-9-]*$'
    additionalProperties:
      type: string
      minLength: 1
  tokens:
    description: The path of the token file in W3C Design Tokens format, relative to the package.
    type: string
    minLength: 1
