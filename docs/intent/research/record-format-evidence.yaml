  - path: schemas/record.schema.json
    readOn: 2026-10-31
    key: record-schema
question: Which record format holds each fact once, covers approved prose in the approval hash, and validates against the record schema?
conclusion: A strict YAML subset holding one record file per page with an optional explanation file beside it carries each fact once, covers approved prose in the approval hash, and validates against the unchanged record schema, while the closest surveyed alternative stays in beta with no .NET implementation.
