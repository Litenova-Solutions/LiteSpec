type: research
id: research/cross-layer-trace-evidence
title: Cross-Layer Trace Evidence
sources:
  - path: docs/core/model.md
    readOn: 2026-10-30
    name: model
    note: "Its link-type table allows `serves` to name a flow, while the record schema allows only a step or a goal."
  - path: apps/model/src/LiteSpec.Model/Records/RecordTypes.cs
    readOn: 2026-10-30
    name: recordtypes
  - path: docs/tools/model.md
    readOn: 2026-10-30
    name: model-2
question: Where does the trace from a goal to a test break in one real consumer, top down and bottom up?
conclusion: "The chain breaks at the top: only 19 of 925 live requirements trace to a goal and only 18 of 1,251 handlers stand under a use case that traces to one, while the Behavior-to-code-to-test links below are many and mostly checked."
