  - statement: The reason name holds free prose in most places but an enum on audit and idempotency objects.
    sources:
      - record-schema
  - statement: The setBy name holds product or tenant on requirements and adds operator on settings.
    sources:
      - record-schema
  - statement: The serves name spans two shapes across five record types with three target sets.
