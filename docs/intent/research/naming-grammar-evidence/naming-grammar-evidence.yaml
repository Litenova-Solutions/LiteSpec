  - statement: Those shapes are the origin marker, the constraint free text, the CloudEvents source, and the nested origin.
    sources:
      - record-schema
  - statement: Research sources form a sixth shape beside the source shapes.
    sources:
      - record-schema
  - statement: The record counts two collisions already showing bad data in the consumer.
    sources:
