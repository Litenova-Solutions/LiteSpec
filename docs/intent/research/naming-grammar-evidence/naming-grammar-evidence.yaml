question: What does the 248-field inventory show about name collisions and value shapes, and which grammar follows from it?
conclusion: The inventory counts 248 field names with 18 genuine collisions plus link-shaped justifications and string mini-languages. One grammar of eight word classes with no exceptions, objects for mini-languages, and American spelling follows.
findings:
  - statement: The record schema holds 248 distinct field names.
    sources:
      - record-schema
  - statement: Twenty-one names carry more than one shape, and 18 are genuine collisions.
    sources:
      - record-schema
  - statement: A reader cannot tell the colliding shapes apart.
    sources:
      - record-schema
  - statement: The record infers one naming grammar where each concept keeps one name, shape, and cardinality.
    sources:
      - record-schema
  - statement: A script walked every properties block in the record schema on 31 October 2026.
    sources:
      - record-schema
  - statement: The count lists the declaring definitions and the value shape for each name.
    sources:
