  - statement: All 37 page types share one header of type, id, title, and terms.
    sources:
      - record-schema
  - statement: Links read as present-tense verbs, plural when they hold arrays.
    sources:
      - record-schema
  - statement: The verbs fulfills, governs, solves, decides, and basedOn each carry one meaning.
