question: Which Intent links does LiteSpec require and check? How should Intent group its requirements and name their reasons? What do outside tools and the largest consumer show?
conclusion: Above the requirements, LiteSpec's hierarchy is rationale prose rather than required or checked links. In the largest consumer, 719 of 928 requirements name no origin while every enforced Intent check passes. Outside tools group each promise with the unit its author writes. Authors follow the page rather than the parent, so each feature holds its requirements as entries and reasons become one cites list.
