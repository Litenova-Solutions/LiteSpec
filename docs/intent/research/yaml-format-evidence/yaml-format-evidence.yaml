type: research
id: research/yaml-format-evidence
title: Can Editors Check YAML Against LiteSpec Schemas
sources:
  - url: https://github.com/redhat-developer/yaml-language-server
    readOn: 2026-11-10
    name: yaml-language-server
    note: The record read the YAML language server README in full on 10 November 2026.
  - url: https://yaml.org/spec/1.2.2/
    readOn: 2026-11-10
    name: yaml-spec
    note: The record read the YAML 1.2.2 page on 10 November 2026, covering only its first 100,000 characters, which include the superset statement in section 1.2 but not the data-model sentence.
  - url: https://www.nuget.org/packages/YamlDotNet/18.1.0
    readOn: 2026-11-10
    name: yamldotnet-package
    note: The record read the YamlDotNet license from its NuGet listing at version 18.1.0.
  - url: https://github.com/eemeli/yaml/blob/main/LICENSE
    readOn: 2026-11-10
    name: yaml-npm-license
    note: The record read the yaml license from the GitHub LICENSE file on the main branch, which holds the ISC license but is not the 2.9.1 release tag. The npm package page returned an error on the read, so the record did not check that the version matches.
  - path: schemas/litespec-project.schema.yaml
    readOn: 2026-11-10
    name: project-schema
    note: The record read this schema file on 10 November 2026 and checked its draft declaration on the first line.
  - path: schemas/record.schema.yaml
    readOn: 2026-11-10
    name: record-schema
    note: The record read this schema file on 10 November 2026 and checked its draft declaration on the first line.
question: Can the YAML language server check LiteSpec's YAML files against YAML-held schemas, and which JSON Schema drafts must it read?
conclusion: The language server reads a schema named by a modeline. It validates draft 2020-12, which every LiteSpec schema declares, and accepts a schema written in JSON or YAML.
findings:
  - statement: Editors can check a LiteSpec YAML file against its schema.
    sources:
      - yaml-language-server
  - statement: The YAML language server reads a schema named by a modeline comment at the top of the file.
    sources:
      - yaml-language-server
  - statement: It validates draft 2020-12, which every LiteSpec schema declares.
    sources:
      - yaml-language-server
      - project-schema
      - record-schema
  - statement: The YAML format needs no bridge to JSON.
    sources:
      - yaml-spec
  - statement: The server validates draft-04, draft-07, 2019-09, and 2020-12.
    sources:
      - yaml-language-server
  - statement: All 8 files under schemas declare draft 2020-12 on their first line.
    sources:
      - project-schema
      - record-schema
  - statement: The project schema uses dependentRequired, a keyword from 2019-09.
    sources:
      - project-schema
  - statement: The record schema uses the defs keyword.
    sources:
      - record-schema
  - statement: The record infers that draft 2020-12 support covers both keywords.
    sources:
      - yaml-language-server
      - project-schema
      - record-schema
  - statement: The server README allows a schema definition in JSON or in YAML.
    sources:
      - yaml-language-server
  - statement: The record infers that the server supports a LiteSpec schema written in YAML.
    sources:
      - yaml-language-server
  - statement: YAML 1.2.2 states that its primary focus was to make YAML a strict superset of JSON.
    sources:
      - yaml-spec
  - statement: The record infers that the YAML format needs no bridge to JSON.
    sources:
      - yaml-spec
  - statement: The tools use two parsers to read YAML.
    sources:
