question: What do established requirements and traceability practices require of hierarchy, and where do they warn against requiring it?
conclusion: Established practice requires every requirement to name an origin and computes every inverse link, and it warns that links without training, named tolerances, and a promotion rule give no traceability.
findings:
- statement: Established practice requires every requirement to name an origin.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
  - betterask-the-need-for-requirements
- statement: It computes every inverse link.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: It warns that links alone do not give traceability.
  sources:
  - adammhoward-solavirtusinvicta-traceability
  - nkdagility-resources-blog-rethinking-product
- statement: The links need named tolerances, a rule for when a check turns enforced, and reasons behind them.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
  - adammhoward-solavirtusinvicta-traceability
- statement: ISO/IEC/IEEE 29148:2018 is the standard the IEEE navigator names for requirements work.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
- statement: Each requirement links back to its origins in stakeholder need.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
- statement: Each requirement links forward to the design elements, test cases, and delivered components that implement and verify it.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
- statement: A change's downstream impact is then visible before it ships.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
- statement: For LiteSpec, every element needs a parent above and a child below, or the gap stays visible.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
- statement: IREB CPRE uses the same shape.
  sources:
  - betterask-the-need-for-requirements
- statement: Traceability traces a requirement back to its origins, forward to its implementation and tests, and to the requirements it depends on.
  sources:
  - betterask-the-need-for-requirements
- statement: It claims impact analysis, avoidance of unnecessary requirements, coverage, and progress measurement.
  sources:
  - betterask-the-need-for-requirements
- statement: LiteSpec matches that shape in its forward links, and it is stricter on quality-requirement scenarios.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
  - betterask-the-need-for-requirements
- statement: Its origin link is the gap.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
  - betterask-the-need-for-requirements
- statement: basedOn exists, but LiteSpec defines feature narrowly.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
  - betterask-the-need-for-requirements
- statement: So an ordinary shipped-feature requirement has no named origin, and both sources call it orphaned.
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
  - betterask-the-need-for-requirements
- statement: The regulated regimes require the chain rather than advise it.
  sources:
  - jamasoftware-requirements-management-guide
  - vector-business-unit-code-testing-and
- statement: DO-178C traces requirements to code and to tests.
  sources:
  - jamasoftware-requirements-management-guide
- statement: It requires a requirement to justify every line of code and every test, and it treats untraceable code as extraneous.
  sources:
  - jamasoftware-requirements-management-guide
- statement: It scales rigor through Design Assurance Levels A to E, and it treats a suspect link as a state of its own.
  sources:
  - jamasoftware-requirements-management-guide
- statement: A suspect link is a changed item whose neighbors have not been reviewed again.
  sources:
  - help-jamasoftware-ah-manage-content-coverage
  - help-jamasoftware-ah-manage-content-coverage-2
- statement: ISO 26262 and IEC 62304 require bidirectional traceability with the same discipline.
  sources:
  - vector-business-unit-code-testing-and
  - jamasoftware-legacy-requirements-management
- statement: A team analyzes the full impact before it accepts a change, then propagates the update to every traced artifact.
  sources:
  - vector-business-unit-code-testing-and
  - jamasoftware-legacy-requirements-management
- statement: LiteSpec implements the regulated shape below the requirement line.
  sources:
  - jamasoftware-requirements-management-guide
  - vector-business-unit-code-testing-and
- statement: Its computed staleness matches suspect-link semantics, done automatically.
  sources:
  - help-jamasoftware-ah-manage-content-coverage
  - help-jamasoftware-ah-manage-content-coverage-2
- statement: The regimes require the top of the chain as well, and LiteSpec leaves it optional.
  sources:
  - jamasoftware-requirements-management-guide
  - vector-business-unit-code-testing-and
- statement: 719 of 928 consumer requirements name no origin and fail a DO-178C audit.
  sources:
  - jamasoftware-requirements-management-guide
- statement: Implementation with no linked requirement stays out of a certified build.
  sources:
  - jamasoftware-requirements-management-guide
- statement: LiteSpec needs no Design Assurance Level grading.
  sources:
  - jamasoftware-requirements-management-guide
- statement: The goal methods confirm the shape and name one missing middle.
  sources:
  - wer-inf-puc-rio-werpapers-artigos-artigos-wer09
- statement: KAOS refines strategic goals into requirements assigned to responsible agents.
  sources:
  - wer-inf-puc-rio-werpapers-artigos-artigos-wer09
- statement: i* captures why actors depend on each other.
  sources:
  - wer-inf-puc-rio-werpapers-artigos-artigos-wer09
- statement: Neither method leaves a goal unlinked.
  sources:
  - wer-inf-puc-rio-werpapers-artigos-artigos-wer09
- statement: LiteSpec except and fallback cover obstacles in product words, so LiteSpec leaves refinement logic out.
  sources:
  - wer-inf-puc-rio-werpapers-artigos-artigos-wer09
- statement: "Impact mapping has 4 levels: goal, actor, impact, and deliverable."
  sources:
  - modernanalyst-careers-interviewquestions-tabid
- statement: It exposes LiteSpec's missing middle.
  sources:
  - modernanalyst-careers-interviewquestions-tabid
- statement: No impact record states the behavior change that a feature aims to cause, although a flow finishedWhen nearly states it.
  sources:
  - modernanalyst-careers-interviewquestions-tabid
- statement: Opportunity solution trees match LiteSpec closely, with outcome, opportunity, solution, and experiment.
  sources:
  - prodpad-glossary-opportunity-solution-tree
- statement: LiteSpec is stronger at the experiment level, because its scenarios are executable proofs.
  sources:
  - prodpad-glossary-opportunity-solution-tree
- statement: User story mapping backbone exists in LiteSpec, and the check step-use-case-missing covers it.
  sources:
  - visual-paradigm-cn-guide-agile-software
- statement: OKRs match the goal shape almost exactly.
  sources:
  - qa-whatmatters-faqs-okrs-objectives-key-results
- statement: Goals carry no authority in LiteSpec, so scoring them gives numbers with no authority there.
  sources:
  - qa-whatmatters-faqs-okrs-objectives-key-results
- statement: The tools agree on 4 mechanics.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: They store each link on one side and compute the inverse.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: They allow at most one parent in the tree and many non-tree links.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: They compute orphan status from rules for each type.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: They provide a tolerance, such as excluding items from coverage, marking them suspect, or recording an exception.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: So a missing parent shows as a visible judgment rather than always an error.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: Jama computes orphan and missing-downstream status from relationship rules that an administrator sets.
  sources:
  - help-jamasoftware-ah-manage-content-coverage
- statement: It marks downstream items suspect when an upstream item changes.
  sources:
  - help-jamasoftware-ah-manage-content-coverage-2
- statement: Polarion derives semantic link pairs from one written link.
  sources:
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
- statement: Azure DevOps allows one parent link per work item on a tree that prevents circular references.
  sources:
  - learn-microsoft-en-us-azure-devops
- statement: Linear splits a parent issue into sub-issues that inherit the team, priority, and project, with an optional auto-close.
  sources:
  - linear-docs-parent-and-sub-issues
- statement: LiteSpec does the first mechanic, because links stand on the record that points.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: It does the fourth, because its exceptions carry end dates.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: It does the second through identifier containment, which never drifts.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
- statement: Its gap is the third mechanic above the requirement line, where the checker computes no orphan at all.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
