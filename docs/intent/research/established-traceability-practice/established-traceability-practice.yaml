  - betterask-the-need-for-requirements
  - jamasoftware-requirements-management-guide
  - learn-microsoft-en-us-azure-devops
- statement: "Every requirement names one origin: a feature, a basedOn entry, or a deciding decision."
  sources:
  - technav-ieee-topic-requirements-management
  - technav-ieee-topic-technical-requirements
  - betterask-the-need-for-requirements
- statement: The flow gains a goal link.
  sources:
  - modernanalyst-careers-interviewquestions-tabid
  - wer-inf-puc-rio-werpapers-artigos-artigos-wer09
- statement: Every feature names solves and serves.
  sources:
  - prodpad-glossary-opportunity-solution-tree
- statement: The checker computes Intent orphans as advisory only, with named tolerances.
  sources:
  - learn-microsoft-en-us-azure-devops
  - blogs-sw-siemens-polarion-links-between-work
  - blogs-sw-siemens-polarion-interconnecting-your
  - linear-docs-parent-and-sub-issues
  - help-jamasoftware-ah-manage-content-coverage
- statement: Each child has one written parent, and the checker computes every inverse.
  sources:
  - learn-microsoft-en-us-azure-devops
