- statement: Evidence shows the benefit of traceability; it is not automatic.
  sources:
  - link-springer-article-s10664-014-9314-z
- statement: In the one controlled experiment the record found, subjects with traceability perform on average 24 percent faster.
  sources:
  - link-springer-article-s10664-014-9314-z
- statement: They also produce on average 50 percent more correct solutions.
  sources:
  - link-springer-article-s10664-014-9314-z
- statement: The tasks are real maintenance tasks on 2 third-party projects, with 71 subjects.
  sources:
  - link-springer-article-s10664-014-9314-z
- statement: Maintenance is the known failure mode, because teams neglect links as a nuisance.
  sources:
  - adammhoward-solavirtusinvicta-traceability
  - nkdagility-resources-blog-rethinking-product
- statement: So any LiteSpec link rule stays checkable by the builder on every run.
  sources:
  - adammhoward-solavirtusinvicta-traceability
  - nkdagility-resources-blog-rethinking-product
- statement: A matrix that pairs tests with requirements, but states no reasoning, looks complete and gives no useful information.
  sources:
  - adammhoward-solavirtusinvicta-traceability
- statement: LiteSpec limits that risk with required rationales and typed links.
  sources:
  - adammhoward-solavirtusinvicta-traceability
- statement: The matrix fails most where a field is optional and empty.
  sources:
  - adammhoward-solavirtusinvicta-traceability
- statement: Deep trees reduce agility.
  sources:
  - nkdagility-resources-blog-rethinking-product
- statement: A 5-level backlog hierarchy reduces transparency and adaptability.
  sources:
  - nkdagility-resources-blog-rethinking-product
- statement: So requirements stay usable without feature gardening, and the origin rule accepts basedOn or a deciding decision beside feature.
  sources:
  - nkdagility-resources-blog-rethinking-product
- statement: The record names 3 genuine limits.
  sources:
  - nkdagility-resources-blog-rethinking-product
- statement: Cross-cutting constraints legitimately parent many requirements.
  sources:
  - nkdagility-resources-blog-rethinking-product
- statement: Background work needs an exemption.
  sources:
  - nkdagility-resources-blog-rethinking-product
- statement: Small projects face none of the new gates.
  sources:
  - nkdagility-resources-blog-rethinking-product
- statement: The investigation ranks 6 rules for LiteSpec.
