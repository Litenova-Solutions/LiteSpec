question: How do Behavior records find their parent, and where does a reader read the parent from a file name only or find no parent at all?
conclusion: Containment by identifier is sound and complete in the largest consumer, while results, scenarios, domain events, and rules find their parent only through file placement or a project-wide name lookup, and several Behavior types have no parent at all.
