    sources:
      - model
      - record-schema
  - statement: "A reader finds the parent of results, scenarios, domain events, and rules only through file placement or a project-wide name lookup."
    sources:
      - model
      - record-schema
  - statement: "Several Behavior types give a reader no parent at all."
