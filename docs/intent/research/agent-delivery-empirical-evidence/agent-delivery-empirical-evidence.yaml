    note: "Anthropic post on effective context engineering for agents, read from the post page on 20 November 2026. Covers small focused context and compounding small wins."
question: Which empirical findings from 2025 to 2026 support LiteSpec v7 agent delivery, and what does each source state?
conclusion: Five 2025 to 2026 sources agree that long unfocused context harms agent output and that small scoped context with harness guardrails and independent verification restores it.
findings:
  - statement: "Structured task context with independent verification raises agent success rates."
    sources:
      - eth-zurich-agent-delivery
  - statement: "Recall and answer quality fall as input tokens grow, even inside large windows."
    sources:
      - ifscale-context-study
  - statement: "Longer context windows do not mean better attention across the window."
    sources:
      - chroma-context-rot
  - statement: "Sending less, focused context beats sending everything available."
    sources:
      - chroma-context-rot
      - anthropic-context-engineering
  - statement: "Harness structure around agents matters more than model choice alone."
    sources:
      - openai-harness-engineering
  - statement: "Small scoped context pieces with clear guardrails compound into reliable runs."
    sources:
      - anthropic-context-engineering
      - openai-harness-engineering
  - statement: "LiteSpec v7 delivery follows these findings: thin protocols, path-scoped rules, a 4-tool MCP surface, deterministic hooks, and independent verification."
    sources:
      - eth-zurich-agent-delivery
      - ifscale-context-study
      - chroma-context-rot
      - openai-harness-engineering
      - anthropic-context-engineering
