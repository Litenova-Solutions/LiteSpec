question: How do comparable practices keep a slice, a handler and a module from coupling to each other's internals, and what did a large consumer of LiteSpec 5 and 6 show about the shared folders and nested commands the rules allowed?
conclusion: Outside practice couples within a slice and not between slices, lets a module learn another module's state from published events, and keeps ports for what the core asks of the outside; a large consumer showed that the allowed exemptions grew shared folders, nested commands and cross-module readers, so 6.1 removes the exemptions, places every trigger with what it runs, derives publishing from the translated domain event, and adds the view record.
