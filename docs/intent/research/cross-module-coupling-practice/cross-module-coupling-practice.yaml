question: How do comparable practices stop slices, handlers, and modules from coupling to each other's internals? What did a large consumer of LiteSpec 5 and 6 show about the shared folders and nested commands the rules allowed?
conclusion: Outside practice couples within a slice and not between slices, lets a module learn another module's state from published events, and keeps ports for what the core asks of the outside; a large consumer showed that the allowed exemptions grew shared folders, nested commands, and cross-module readers, so 6.1 removes the exemptions, places every trigger with what it runs, derives publishing from the translated domain event, and adds the read-model record.
findings:
- statement: Outside practice keeps coupling inside a slice and out of the space between slices.
  sources:
  - jimmybogard-vertical-slice-architecture
- statement: Bogard's 2018 article states the aim as minimal coupling between slices and maximal coupling inside one.
  sources:
  - jimmybogard-vertical-slice-architecture
- statement: So a slice that names another slice's request type couples to that slice's reasons to change.
  sources:
  - jimmybogard-vertical-slice-architecture
- statement: A module learns another module state without asking for it.
  sources:
  - martinfowler-articles-201701-event-driven
- statement: Fowler's 2017 article names the pattern event-carried state transfer.
  sources:
  - martinfowler-articles-201701-event-driven
- statement: A receiver keeps its own copy of the needed data, filled from owner events, and stops calling the owner.
  sources:
  - martinfowler-articles-201701-event-driven
- statement: The receiver maintains that copy and accepts that it lags the owner.
  sources:
  - martinfowler-articles-201701-event-driven
- statement: A port is a seam the core declares for something outside it.
  sources:
  - cockburn-hexagonal-architecture
- statement: Cockburn's 2005 article on ports and adapters, also called hexagonal architecture, places a port where the application meets a driver or a driven system.
  sources:
  - cockburn-hexagonal-architecture
- statement: The port lets adapters change behind it.
  sources:
  - cockburn-hexagonal-architecture
- statement: A repository and an outside system fit that shape.
  sources:
  - cockburn-hexagonal-architecture
- statement: A reader that one module calls to fetch another module state is an in-process service call.
  sources:
  - cockburn-hexagonal-architecture
- statement: It runs between two parts of one core, not as a seam to the outside.
  sources:
  - cockburn-hexagonal-architecture
- statement: A published modular monolith reference separates the two kinds of message.
  sources:
  - github-kgrzybek-modular-monolith-with-ddd
- statement: The repository keeps domain events inside the module that raised them.
  sources:
  - github-kgrzybek-modular-monolith-with-ddd
- statement: It crosses module boundaries with integration events processed in their own transactions.
  sources:
  - github-kgrzybek-modular-monolith-with-ddd
- statement: It runs follow-on work inside a module as internal commands from its own processing.
  sources:
  - github-kgrzybek-modular-monolith-with-ddd
- statement: No module sends another module's command.
  sources:
  - github-kgrzybek-modular-monolith-with-ddd
- statement: One large consumer with 43 modules and 1,541 use-case folders shows what the allowances built.
  sources:
  - application
  - dotnet-architecture
