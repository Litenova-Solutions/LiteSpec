question: Do consumer research records state a conclusion a decision can cite, and where is that conclusion held?
conclusion: Every consumer research record states its finding in Answer. Sixteen of twenty-nine restate what follows under seven different invented headings, and the register index repeats the conclusions outside the records. So the conclusion needs one field of its own.
