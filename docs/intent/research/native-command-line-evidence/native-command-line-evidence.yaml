    readOn: 2026-11-09
    key: rid-specific-tools
    note: The record read this page for the package layout, the per-platform packing rule, and the publish order.
  - url: https://learn.microsoft.com/en-us/dotnet/core/deploying/native-aot/cross-compile
    readOn: 2026-11-09
    key: native-aot-cross-compile
