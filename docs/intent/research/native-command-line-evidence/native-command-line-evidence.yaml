    note: The record read the CLI project file for the trial build. The warning counts, distribution runs, CI runs, and timings are the researcher's own measurements.
question: Can the litespec command line ship as a native executable for every platform a consumer runs, and what does each platform need?
conclusion: The CLI compiles with .NET Native AOT once every JSON document it writes is built as a node tree. It produces the same output as the build on the .NET runtime. A model check of the Claimwick example finishes in 1.32 s against 2.80 s. Each operating system builds its own executable. A glibc build runs only on a glibc as new as its build machine. The .NET 10 SDK packs one native tool package per platform behind the one LiteSpec.Cli package.
findings:
  - statement: The CLI compiles with .NET Native AOT once every JSON document it writes is built as a node tree.
    sources:
      - cli-project
  - statement: The native executable gives the same output as the build on the .NET runtime.
    sources:
      - cli-project
  - statement: Each operating system needs its own build.
    sources:
      - native-aot-cross-compile
  - statement: A Linux build runs only on a glibc at least as new as the build machine.
    sources:
      - cli-project
  - statement: Publishing the CLI project release 4.0.0 with PublishAot on 9 November 2026 succeeded with 155 warnings.
    sources:
      - cli-project
  - statement: The warnings were 77 IL2026, 77 IL3050, and one IL3000.
    sources:
      - cli-project
  - statement: All but the IL3000 sat in the CLI JSON code, at 77 call sites.
    sources:
      - cli-project
  - statement: Roslyn, YamlDotNet, JsonSchema.Net, and Markdig reported no warnings.
    sources:
      - cli-project
  - statement: The one IL3000 came from the Roslyn compiler driver method CommonCompiler.GetAssemblyLocation.
    sources:
      - cli-project
  - statement: The CLI never calls that method.
    sources:
      - cli-project
  - statement: The native executable ran help, version, rules, init, and every text model check.
    sources:
      - cli-project
  - statement: Its output matched the build on the .NET runtime byte for byte.
    sources:
      - cli-project
  - statement: The JSON call sites were the one defect in the build itself.
    sources:
      - cli-project
  - statement: Native AOT turns reflection-based serialization off.
    sources:
      - cli-project
  - statement: With reflection off, model check, model query, and book stopped with an error.
    sources:
      - cli-project
  - statement: With reflection on, they exited with code 0 but wrote each finding as an empty object.
    sources:
      - cli-project
  - statement: The trimmer had removed the property metadata of the anonymous types.
    sources:
      - cli-project
  - statement: Model check JSON output on the small fixture wrote 239 bytes instead of 9,520.
    sources:
      - cli-project
  - statement: Building every JSON document as a node tree removed all 154 warnings and kept each output byte for byte.
    sources:
      - cli-project
  - statement: After that rewrite, the native executable passed all 1,756 CLI tests on win-x64 in 3 minutes 8 seconds.
    sources:
      - cli-project
  - statement: The same suite took 5 minutes 15 seconds on the .NET runtime.
    sources:
      - cli-project
  - statement: A full model check of the Claimwick example took 1.32 seconds natively and 2.80 seconds on the runtime.
    sources:
      - cli-project
  - statement: These are means of 8 runs on one Windows machine.
    sources:
      - cli-project
  - statement: Native AOT builds for no other operating system.
    sources:
      - native-aot-cross-compile
  - statement: It builds for another architecture only with the linker of that architecture.
    sources:
      - native-aot-cross-compile
  - statement: A linux-x64 executable built on Ubuntu 24.04 with glibc 2.39 failed to start on Debian 12 and Ubuntu 22.04.
    sources:
      - cli-project
  - statement: The same build on AlmaLinux 8 with glibc 2.28 ran on AlmaLinux 8, Ubuntu 22.04 and 24.04, and Debian 12 and 13.
    sources:
      - cli-project
  - statement: Its rules output matched the Windows output byte for byte.
    sources:
      - cli-project
  - statement: The glibc executable did not start on Alpine, which needs a musl build of its own.
    sources:
      - cli-project
  - statement: The CLI computed SHA-256 hashes through System.Security.Cryptography.
    sources:
      - cli-project
  - statement: On Linux, .NET implements that with OpenSSL.
    sources:
      - cli-project
  - statement: On a bare Debian 12 image, model check aborted with no usable version of libssl found.
    sources:
      - cli-project
  - statement: It passed once libssl3 was installed.
    sources:
      - cli-project
  - statement: Fedora 45 ships OpenSSL 4 alone, and the same abort followed there, because .NET 10 loads OpenSSL 1.1 or 3.
    sources:
      - cli-project
  - statement: The researcher then computed the hash in managed code and used invariant globalization.
    sources:
      - cli-project
  - statement: With that change, the executable links only libc and libm.
    sources:
      - cli-project
  - statement: Model check passed on a bare Debian 12 image with no OpenSSL, and on Fedora 45 with OpenSSL 4 alone.
    sources:
      - cli-project
  - statement: The JSON output matched on both.
    sources:
      - cli-project
  - statement: The .NET 10 SDK packs one package per runtime identifier, behind a top-level package.
    sources:
      - rid-specific-tools
  - statement: The RID-specific tools page states this, with the rule that each operating system packs its own Native AOT package.
    sources:
      - rid-specific-tools
  - statement: It also states that the platform packages publish before the top-level package.
    sources:
      - rid-specific-tools
  - statement: A local test confirmed that the platform package carries the release beside the executable.
    sources:
      - cli-project
  - statement: It also confirmed that dotnet litespec, installed from that package, runs the native executable.
    sources:
      - cli-project
  - statement: The runtime identifier graph maps linux-musl-arm64 onto linux-arm64.
    sources:
      - rid-specific-tools
  - statement: The record infers that without a linux-musl-arm64 package, an Alpine arm64 machine installs the glibc executable, which cannot start there.
    sources:
      - rid-specific-tools
      - cli-project
  - statement: On 9 November 2026, CI built all 8 executables, each on a runner of its own operating system.
    sources:
      - cli-project
  - statement: It installed each archive with the install script.
    sources:
      - cli-project
  - statement: It then ran the smoke scenario and the CLI suite against the installed executable on 6 platforms.
    sources:
      - cli-project
  - statement: Those platforms are win-x64, win-arm64, osx-x64, osx-arm64, linux-x64, and linux-arm64.
    sources:
      - cli-project
  - statement: Those CI runs found 2 defects that the Windows and Linux trials had not shown.
    sources:
      - cli-project
  - statement: "Model check --since and the contract diff joined the resolved repository path that git reports to a root."
    sources:
      - cli-project
  - statement: That root passed through the symbolic link of a macOS temporary folder.
    sources:
      - cli-project
  - statement: Install.ps1 read the processor architecture that an emulated shell on an Arm PC passed down.
    sources:
      - cli-project
  - statement: With both fixed, the standalone executable installed and ran on AlmaLinux 8 and 9, Amazon Linux 2023, Debian 12 and 13, and openSUSE Leap 15.6.
    sources:
      - cli-project
  - statement: It also installed and ran on Ubuntu 20.04, 22.04, and 24.04, and Alpine 3.21 and 3.22.
    sources:
      - cli-project
  - statement: The .NET tool installed from the packages on Windows, macOS, Linux, and Alpine arm64.
    sources:
      - cli-project
  - statement: The ILCompiler advisory lists Microsoft.DotNet.ILCompiler below 10.0.14 as vulnerable.
    sources:
      - ilcompiler-advisory
  - statement: PublishAot adds that package at the runtime version that the SDK bundles.
    sources:
      - cli-project
  - statement: So the NuGet audit fails every restore on an SDK that bundles an earlier runtime, such as 10.0.113.
    sources:
      - cli-project
  - statement: SDK 10.0.114 is the lowest version that bundles 10.0.14.
    sources:
      - ilcompiler-advisory
      - cli-project
