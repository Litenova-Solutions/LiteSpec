question: How should Intent group its requirements and name their reasons, and what do outside tools and the largest consumer show?
conclusion: Outside tools group each promise with the unit its author writes, while the largest consumer shows authors follow the page rather than the parent, with 719 of 928 requirements naming no reason, so each feature holds its requirements as entries and reasons become one cites list.
