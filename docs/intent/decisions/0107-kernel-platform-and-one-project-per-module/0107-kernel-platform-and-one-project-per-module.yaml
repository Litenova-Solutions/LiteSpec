type: decision
id: decision/0107-kernel-platform-and-one-project-per-module
title: Kernel, Platform, and One Project per Module
context: "A full backend built on the two-project layout mixed business values with technical wiring in one shared kernel. Module registration lived in a shared composition folder that reached module internals. Use case infrastructure had no home and landed in Application folders. Module boundaries held as analyzer rules only, use cases sat five levels deep under one aggregate, and aggregate types hid behind folder namespaces. The slice layout that replaced it read as unfamiliar to its own owner: one use case in one folder with its own layer folders is not the shape .NET readers expect."
options:
  - name: "Separate the Kernel, the Platform, and one project per module with onion layer folders"
    pros: "Module boundaries hold by project reference and visibility. The four layer folders read at first glance to anyone who knows .NET, and one style holds across products."
    cons: "A solution holds more projects, one use case spreads over up to three folders, and small products carry the same shape as large ones."
  - name: "Slice folders with layers in each use case"
    pros: "One folder shows a use case whole, with its layers beside its handler."
    cons: "The layout reads as unfamiliar to .NET readers, and a second organization grows beside the layer checks."
  - name: "Aggregate-first folders"
    pros: "Each aggregate holds its domain and its use cases in one place."
    cons: "A use case touching two aggregates needs a second parent, and a use case no aggregate owns fits nowhere."
  - name: "Onion projects per module"
    pros: "The compiler enforces layer purity inside each module through project references."
    cons: "Four projects per module multiply the solution, and every use case crosses project boundaries."
  - name: "Ports and adapters folders"
    pros: "Hexagonal names state the seams between the application and its drivers."
    cons: "The vocabulary is new to the checks, and the ports-and-adapters split differs from the four layers the standard enforces."
choice: "Separate the Kernel, the Platform, and one project per module with onion layer folders"
consequences: "The Kernel holds the business values every module speaks with no dependency on any library. The Platform holds the technical capabilities with no business words and references no module. Each module is one project with its entry type, Contracts, Domain, Application, Infrastructure, and WebApi. Each layer folder holds one folder per use case it serves, so a use case record maps to Application/{UseCase}/ and, when reached over HTTP, WebApi/{UseCase}/, plus Infrastructure/{UseCase}/ when it has its own adapter, and an aggregate record maps to Domain/{Aggregate}/. Only Contracts and the entry type are public, and hosts compose modules through AddModules. The record tree stays. A single modules project stays allowed with LS2020 as its boundary. LiteSpec supports one architecture style. The Kernel takes its name from the Shared Kernel pattern of Eric Evans, Domain-Driven Design (2003), without the word Shared, because everything in it is shared and one product is one bounded context. The Platform follows the Microservice Chassis pattern of Chris Richardson (microservices.io), named Platform because modules contribute to it and hosts call AddPlatform."
reopenedWhen: "A module outgrows the layout, project-per-module costs outweigh compiler-enforced boundaries, or the layer folders stop matching the shape .NET readers expect."
