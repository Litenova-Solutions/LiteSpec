type: decision
id: decision/0107-kernel-platform-and-one-project-per-module
title: Kernel, Platform, and One Project per Module
context: "A full backend built on the two-project layout mixed business values with technical wiring in one shared kernel. Module registration lived in a shared composition folder that reached module internals. Use case infrastructure had no home and landed in Application folders. Module boundaries held as analyzer rules only, use cases sat five levels deep under one aggregate, and aggregate types hid behind folder namespaces. The slice layout that replaced it read as unfamiliar to its own owner: one use case in one folder with its own layer folders is not the shape .NET readers expect."
options:
  - name: "Separate the Kernel, the Platform, and one project per module with onion layer folders"
    pros: "Module boundaries hold by project reference and visibility. The four layer folders read at first glance to anyone who knows .NET, and one style holds across products."
    cons: "A solution holds more projects, one use case spreads over up to two folders, and small products carry the same shape as large ones."
  - name: "Slice folders with layers in each use case"
    pros: "One folder shows a use case whole, with its layers beside its handler."
    cons: "The layout reads as unfamiliar to .NET readers, and a second organization grows beside the layer checks."
  - name: "Aggregate-first folders"
    pros: "Each aggregate holds its domain and its use cases in one place."
    cons: "A use case touching two aggregates needs a second parent, and a use case no aggregate owns fits nowhere."
  - name: "Onion projects per module"
    pros: "The compiler enforces layer purity inside each module through project references."
    cons: "Four projects per module multiply the solution, and every use case crosses project boundaries."
  - name: "Ports and adapters folders"
    pros: "Hexagonal names state the seams between the application and its drivers."
    cons: "The vocabulary is new to the checks, and the ports-and-adapters split differs from the four layers the standard enforces."
choice: "Separate the Kernel, the Platform, and one project per module with onion layer folders. Code drops the typed container folders of the record tree (aggregates, use-cases, rules, domain-events, module-events) and keeps the module, aggregate, and record names in PascalCase, plural for aggregate folders, so each record path maps to code by one rule. Every port of the module lives in its own Ports/{Port}/ folder holding the interface I{Port} and only the types its signatures name, with no files directly in Ports/, whether one use case or many call it, and each port has exactly one adapter folder in Infrastructure/ with the same name. A port to an external system spells the external-system record name in PascalCase, and an in-process port takes a name for its capability. A port is an interface the module declares for something it does not compute in memory: an external system, a file format it reads or writes, a platform service the Platform does not already expose as an abstraction, or the clock, because a Ports/ folder that accepts in-process helpers becomes the place for whatever fits nowhere else. Infrastructure/Persistence nests by aggregate, so every layer nests by aggregate, and the module options class lives in Application/Settings. Domain/ is absent when the module declares no aggregate, WebApi/ when no use case is reached over HTTP, and Ports/ when the module declares no port."
consequences: "The Kernel holds the business values every module speaks with no dependency on any library. The Platform holds the technical capabilities with no business words and references no module. Each module is one project with its entry type, Contracts, Domain, Application, Ports, Infrastructure, and WebApi. Application/ and WebApi/ each hold one plural aggregate folder with one folder per use case inside it, so a use case record maps to Application/{Aggregates}/{UseCase}/ and, when reached over HTTP, WebApi/{Aggregates}/{UseCase}/, and an aggregate record maps to Domain/{Aggregates}/, while a module-level use case drops the aggregate segment in each. Code drops every typed container folder of the record tree and keeps module, aggregate, and record names; Domain/{Aggregates}/Events/ is the stated exception, grouping the domain event types of one aggregate inside the module. The plural keeps the aggregate type visible to every handler instead of hiding it behind a singular namespace that fails with CS0118, and one plural folder in every layer lets a reader follow one name from the record to the screen. Only Contracts and the entry type are public, and hosts compose modules through AddModules. The record tree stays, with aggregate folders in the plural and record ids in the singular. A single modules project stays allowed with LS2020 as its boundary. LiteSpec supports one architecture style. The Kernel takes its name from the Shared Kernel pattern of Eric Evans, Domain-Driven Design (2003), without the word Shared, because everything in it is shared and one product is one bounded context. The Platform follows the Microservice Chassis pattern of Chris Richardson (microservices.io), named Platform because modules contribute to it and hosts call AddPlatform. Port comes from Alistair Cockburn, Hexagonal Architecture (2005), also called Ports and Adapters: the application talks to the outside only through purpose-named ports, and adapters convert between a port and a technology. The same idea appears as Fowler Gateway and Separated Interface, Palermo Onion Architecture, and Martin Clean Architecture, all resting on dependency inversion: the inner code owns the interface, the outer code implements it. Port is used instead of Gateway, which fits an external system but less a file format or the clock, and instead of Interfaces or Abstractions, which say nothing about why these interfaces are grouped. Every port of the module lives in its own Ports/{Port}/ folder holding the interface I{Port} and only the types its signatures name, with no files directly in Ports/, and each port has exactly one adapter folder in Infrastructure/ with the same name; Infrastructure/ holds Persistence/ and one folder per port it implements. A port to an external system spells the external-system record name in PascalCase, and an in-process port takes a name for its capability, still pairing one port folder with one adapter folder. A port is an interface the module declares for something it does not compute in memory: an external system, a file format it reads or writes, a platform service the Platform does not already expose as an abstraction, or the clock; in-process logic, store reads, wrappers over Platform abstractions, duplicate interfaces over one service, permission constants, and domain exceptions and enums are not ports, because a Ports/ folder that accepts them becomes the place for whatever fits nowhere else. Infrastructure/Persistence/ holds only module-wide store setup, and each aggregate's repository implementation, stored documents, and mapping sit in Infrastructure/Persistence/{Aggregates}/. The module options class lives in Application/Settings/. Domain/ is absent when the module declares no aggregate, WebApi/ when no use case is reached over HTTP, and Ports/ when the module declares no port. code-placement-drift reports a file directly in Ports/, a port folder holding no interface or more than one, a misnamed port folder, a port folder that does not spell its external-system record name, a port or adapter folder naming a declared module, a type no interface signature names, a port with no adapter folder, an adapter folder with no port, a repository implementation outside its aggregate's Persistence/ folder, and a use-case model or adapter in Persistence/."
reopenedWhen: "A module outgrows the layout, project-per-module costs outweigh compiler-enforced boundaries, or the layer folders stop matching the shape .NET readers expect."
