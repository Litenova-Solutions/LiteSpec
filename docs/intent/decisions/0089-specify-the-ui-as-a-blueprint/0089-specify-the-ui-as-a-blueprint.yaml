type: decision
id: decision/0089-specify-the-ui-as-a-blueprint
title: Specify the UI as a Blueprint
options:
  - name: "Blueprint and limits in the records, values and build in the implementation, binding checked"
    pros: "A project with Intent and Behavior only can specify its screens; readability is checked, not pinned; the book shows each screen before code."
    cons: "New fields on four record types, a token file format, six checks and three book views; the design contract shrinks."
  - name: "Keep the UI in the implementation only"
    pros: "Nothing changes."
    cons: "Intent-and-Behavior projects have no screen blueprint; a more readable palette needs a waiver; limits live in hand-run scripts."
  - name: "Specify the full design in the records"
    pros: "One place holds everything."
    cons: "The specification is tied to one implementation and drifts with every restyle, against the layering of the records."
  - name: "Link out to a design tool"
    pros: "Designers keep their own tool."
    cons: "Agents and checks cannot read it offline, it is not versioned with the records, and nothing binds it to the use cases."
choice: "Blueprint and limits in the records, values and build in the implementation, binding checked"
consequences: "The `product` record carries `brand` with `reader`, `accountableFor`, `is`, `isNot`, `do` and `doNot`. The `entry-point` record carries `density` (`public-light`, `application-balanced`, `admin-dense`) and `voice`. The `screen` record carries `pageFrame` (pattern slug and chosen option) and `leadsTo`, with one `wireframe` block in its explanation file whose actions name offered use cases, whose states name glossary terms and whose refusals name results. A result carries `sentence` with per-language `sentences`. LiteSpec names each token role with the limits its values meet. Values are stored in one W3C Design Tokens 2025.10 file, and `design-token-limit-failed` (level G) blocks. The consumer preset ships six UI quality requirements. The design contract keeps Baseline, Tokens, Page Frames, Vocabulary, Motion, and Browser Support. `wireframe-invalid`, `wireframe-reference-unknown`, `screen-unreachable`, `screen-dead-end`, and `wording-alias` report at level A, and `refusal-sentence-missing` reads `result.sentence`. The book draws each screen wireframe, each entry point navigation map, and each flow storyboard. `litespec/core/intent#state-the-brand-on-the-product`, `litespec/core/edges#state-the-density-and-voice-of-each-entry-point` and `litespec/core/edges#write-the-sentence-a-person-reads-on-each-refusal` state the record side. The `entry-point` record carries `languages` (BCP 47 tags, the first the default) and `formats` (`money`, `moment`) naming the money and moment pattern options. `sentence-language-missing` (level A) reports a written refusal result with no sentence for a declared language."
reopenedWhen: "The blueprint cannot carry a screen a consumer must specify, or the token limits refuse a palette readers find more readable."
