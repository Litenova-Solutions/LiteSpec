type: decision
id: decision/0070-keep-one-source-for-each-fact
title: Keep One Source for Each Fact
options:
  - name: "Move each fact to its source and check each stated copy"
    pros: "One source of truth stands behind each fact, every stated copy faces a check, and retention, exposure, and classification each read once."
    cons: "Records move fields in one release, and authors state classification and membership under checks."
  - name: "Derive every copy and forbid stating it"
    pros: "No copy drifts from its source."
    cons: "Isolated files stop reading whole, against decision/0069-state-each-copy-under-a-check."
  - name: "Leave each fact where authors wrote it"
    pros: "No record moves and no check is added."
    cons: "Basis, period, enforcement, and purpose stay on two pages and disagree, and the differing classifications stay silent."
choice: "Move each fact to its source and check each stated copy"
consequences: "An aggregate data class carries `period`, `periodStartsAt`, `basis`, `purpose`, `enforcedBy`, and `exceptions`; the retention schedule is computed and the book renders it from the data classes. `processors` becomes `processes` on the external system holding the data, and conflicts become data-class `exceptions`. `governs` stays on rules under a check against every link naming the rule; `exposure` states who reaches a use case through which entry points under which permission and what is at stake, under checks against `reachedThrough`, `access`, and empty text; per-field classification and data-class `fields` stay under agreement checks. `background` is the Given shared by every scenario of a use case with at least two scenarios. `onFailure` and `idempotency` are required on every reaction and job. Queries carry neither idempotency nor consistency; `consistency` is required only on a command writing more than one aggregate. `litespec/core/writing#interpret-fields-in-explanations-never-restate-them` keeps interpretation in explanations; `litespec/core/use-cases#state-the-consistency-of-every-use-case` states the narrowed consistency."
reopenedWhen: "A fact with one source proves unreadable where its reader needs it, or a required copy costs more than its check returns."
basedOn:
  - research/check-coverage-evidence
  - research/behavior-containment-evidence
