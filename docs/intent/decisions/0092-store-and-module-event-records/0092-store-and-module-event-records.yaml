type: decision
id: decision/0092-store-and-module-event-records
title: Store and Module Event Records with Proof Freshness from the Run Commit
options:
  - name: "A store type, a module event type, and freshness judged from the run commit"
    pros: "Stores stop borrowing the aggregate name; modules share facts without an invented external system; a code change after a green run shows stale."
    cons: "Two record types land with their provisions, checks, and book pages, and every run resolves its commit against git."
  - name: "Keep the kind flag, in-product integration events, and mark-based staleness"
    pros: "No new record types and no commit tracking."
    cons: "Stores keep the consistency-boundary name, two modules in one process still talk through an invented external system, and unmarked code changes leave proofs verified."
  - name: "Add the two types but keep mark-based staleness"
    pros: "The record shapes land without touching the proof rule."
    cons: "A change to an unmarked value object still leaves every proof of its callers verified."
choice: "A store type, a module event type, and freshness judged from the run commit"
consequences: "Behavior gains a `store` record type with identifier `store/<module>.<name>`, filed under its module in a `stores` folder beside aggregates. A store carries `summary`, `owner` naming a `module/...` or `external-system/...` record, `data`, `dataClasses`, `terms`, and `records`. A store carries no `states`, `transitions`, `kind`, or `parts`. The aggregate type loses `kind` and `owner` and reads as a consistency boundary with states and invariants. Links that accept an aggregate as the thing read or written accept a store too, and a rule may govern how a store is used, such as 'a manager the suppression list names gets no approval reminder', though a store itself holds no invariant. Every check that tested `kind == store` tests the record type instead. The `leave-states-off-every-store` provision is removed and `name-the-owner-of-every-store` stays with `owner` pointing at a module or external system. The repository or table configuration implementing a store carries `implements store/<module>.<name>`. Behavior gains a `module-event` record type with identifier `module-event/<module>.<name>`, filed under its publishing module in a `module-events` folder. A module event carries `summary`, `translates` naming one domain event of its own module, `payload`, `terms`, and `records`, with Consumers and Compatibility in its explanation file. A module event carries no `direction`, CloudEvents identity, `trust`, or `through`. A module event publishes only fields its translated domain event carries, checked as `event-field-uncarried`, and has exactly one publishing module, checked as `event-publisher-invalid`. `triggeredBy` on a reaction accepts a domain event of its own module, a module event of a module the reaction's module depends on, or an inbound integration event. A record under a module is linked from another module only along a declared module dependency, through a module event, or through an integration event. The commit stages each raised domain event for the reactions of its own module, each module event that translates it, and each outbound integration event that translates it. Read models built from another module's facts read module events. An integration event keeps `through` naming the external system it travels through and stays for facts that cross the bounded context. Inside the bounded context, module events and domain-event reactions travel in process through the transactional outbox with no broker, and an outbound integration event uses a transport dispatcher toward the system its record names in `through`. Every event handler of a module event or domain event carries a subscriber name that survives a class rename. A read-model projection the next screen reads dispatches in process after commit with the outbox processor as its fallback. A scenario's proof is fresh when its run commit is the repository HEAD, or when every path changed between the run commit and the working tree sits under the project's LiteSpec folder or is a Markdown file. Any other change leaves the proof stale, reading `last passed at <short commit>, <N> commits ago`. `proofs.json` keeps the run commit and the outcome per scenario. CI writes `proofs.json` from the run on the pull request head. When git is unavailable or the run commit is unknown, the proof is stale with the reason. The book gives the store and the module event their own page kinds and lexicon labels under their module, and never shows a module event as an external dependency."
reopenedWhen: "A store needs states or an invariant of its own, modules need a broker for facts inside the bounded context, or proof needs a signal the run commit cannot carry."
