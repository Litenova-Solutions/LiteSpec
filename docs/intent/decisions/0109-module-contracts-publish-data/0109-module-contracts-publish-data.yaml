type: decision
id: decision/0109-module-contracts-publish-data
title: Module Contracts Publish Data
context: "A module published reader interfaces in its Contracts folder for every other module to call. One large consumer named 86 such readers in 741 files of other modules, and the busiest reader had 18 methods, several named for their one caller. No record said which fields crossed the boundary. The word port named two directions at once: the driven ports a module declares in its Ports folder for work it does not compute, and the reader interfaces a module published in Contracts/Ports for other modules to call. Two modules of the owner's product referenced each other's identifiers, so neither Contracts project could state what it owned. A microservice backend whose internal contracts project published request and response models per operation showed the shape that works: data only, grouped by aggregate and operation, with each consumer declaring its own port. Letting only queries cross modules then showed its own cost. A module could never ask another to act, so a process spanning modules could only be choreographed, each module reacting to the other's facts, and choreography makes two modules depend on each other. One product showed ten such two-way pairs: a workspace erasure process with the requester reacting to every module's erased fact, and business collaborations with a ledger module and the banking, vat and invoicing modules reacting to each other's facts. Outside practice resolves this with commands owned by their handler. Enterprise Integration Patterns defines the command message, NServiceBus sends a command to its one logical owner and publishes an event to any subscriber, and a command's contract belongs to the service that handles it while an event's belongs to the service that publishes it. Chris Richardson's saga pattern runs a spanning process as an orchestrator that drives participants through their own command APIs, with participants never knowing the coordinator."
options:
  - name: "Contracts publish public queries and public commands as data grouped by aggregate; each consumer declares one port per provider"
    pros: "The provider states its public queries, public commands, facts, and carried identifiers as data beside the use cases that produce them. Each consumer port states what one consumer needs in its own types. Each cross-module call has one direction, and no interface crosses a module boundary."
    cons: "Each consumer writes a port and an adapter per provider module it calls. A public query or public command needs its record, its message, and its result in Contracts."
  - name: "Consumers call the provider's public query or public command directly"
    pros: "No consumer port and no adapter: the handler sends the provider message itself."
    cons: "Provider types leak into the consumer's application layer, and no port states what the consumer needs. Replacing the provider rewrites every calling handler."
  - name: "Only queries cross modules; changes travel through facts and reactions"
    pros: "No synchronous cross-module write: the caller never commits with the provider."
    cons: "A module can never ask another to act, so spanning processes choreograph and modules depend on each other both ways. One product showed ten such two-way pairs."
  - name: "Facts stay in a ModuleEvents folder apart from their aggregate"
    pros: "One folder lists every fact the module publishes."
    cons: "The fact sits apart from the aggregate and the use cases that produce it. A reader cannot tell what one aggregate publishes without searching every kind folder."
  - name: "Identifiers shared modules carry live in the Kernel"
    pros: "Every module references one shared identifier without a Contracts reference."
    cons: "The Kernel fills with business identifiers owned by no module. A shared identifier hides which module owns the aggregate it names."
  - name: "Modules carry foreign identifiers as plain Guids in the Platform"
    pros: "No Contracts reference is needed to carry another module's identifier."
    cons: "The type no longer says which aggregate the value names. A caller passes any Guid where an ExpenseId belongs, and the compiler stays silent."
choice: "Contracts publish data grouped by aggregate: public queries and public commands beside the facts and carried identifiers of each aggregate, with each consumer declaring one port per provider. Commands and queries flow upstream, and facts flow downstream: a downstream module sends an upstream module's public queries and public commands and reacts to its facts, while an upstream module never queries, commands, or reacts to a downstream module. A public command is a command use case whose record lists the sending modules in reachedThrough, with its message and result in the owner's Contracts at the use case path, handled by the owner's ordinary command handler through its own pipeline. The sender declares the edge as effects.commands. For now each public command is sent in process and synchronously through the consumer adapter, like a public query. When an upstream module must know downstream work finished, the downstream module calls the upstream module's public command. Facts sit in their aggregate folder beside the identifier and the public use cases of that aggregate. An identifier another module carries lives in Contracts of the module that owns the aggregate; one no other module carries lives in Domain. The Kernel holds an identifier only with a decision record naming the Contracts cycle it breaks. The Platform names no business identifier."
consequences: "A Contracts project holds data only: no interface anywhere in the project. Its root holds one folder per aggregate with anything public, in the plural, and one folder per public module-level use case. Each aggregate folder holds the aggregate identifier when another module carries it, the facts about the aggregate another module consumes, and one folder per public query or public command of that aggregate with its message and result. A public use case is a query or command use case whose record lists the calling modules in reachedThrough. A consumer reaches another module only through its port to that module, one port per provider named for the provider in Ports/{Provider}/, with one adapter in Infrastructure/{Provider}/ that sends the provider's public queries and public commands and maps their results. The calling use case, reaction, or job declares the edge as effects.queries or effects.commands. A read model stays the answer when a consumer needs another module's data reshaped and kept locally; it is the exception now, not the rule. A process spanning modules runs from its most downstream participant, or from a process module depending on every participant, through the participants' public commands. The Platform speaks the tenant and the actor, and the owner of each identifier converts at the module edge."
reopenedWhen: "A product shows a cross-module act no public command can carry. Or a module shows an identifier two modules must own at once."
basedOn:
  - research/cross-module-coupling-practice
