type: decision
id: decision/0033-agents-never-weaken-proving-tests
title: Agents Never Weaken Proving Tests
context: "Agents edit tests to make them pass when a test and the specification disagree. A proof that changes with the implementation stops proving the decided behavior and starts restating the code."
options:
  - name: "Forbid weakening, and report each changed proving test as an advisory finding"
    pros: "An agent that edits a test to pass leaves a finding for the reviewer, and the ledger already holds the hashes."
    cons: "The finding is advisory and never blocks, so a reviewer must read it. Browser proving tests carry no method hash, so the finding covers .NET methods only."
  - name: "Rely on review of each change"
    pros: "No new rule and no new finding."
    cons: "A test changed to match new code reads as a fix in review, unless the reviewer compares it with the scenario."
  - name: "Block every change to a proving test"
    pros: "No proving test changes without a block."
    cons: "A correct edit to a proving test blocks too, and each test refactor needs a waiver."
choice: "Forbid weakening, and report each changed proving test as an advisory finding"
consequences: "`litespec/core/agent#protect-proofs-from-implementation-edits` states the rule. An agent does not delete, skip, or weaken a proving test, or change its expected values, unless the scenario changed in the same change. `litespec model check --since <ref>` reports `proof-hash-drift`, at level A on the Proof layer. The check reports it for each scenario whose proving test method changed while the scenario did not. The proof ledger keeps one method hash per scenario beside its file hash, and each method hash covers the method's own text."
reopenedWhen: "A team adds a test runner whose method boundary the builder cannot read. A review finds a weakened proving test that the finding did not report."
basedOn:
  - research/agent-testing-evidence
