type: decision
id: decision/0074-declare-access-settings-and-deadlines
title: Declare Access Settings and Deadlines
options:
  - name: "A recent-sign-in setting, readable dated settings, and timed transitions"
    pros: "One window covers sensitive acts with a derived refusal, settings state readers, dates, and typed defaults, and deadlines move states with no prose jobs."
    cons: "The product names its window, and each dated setting and timed transition is written by hand."
  - name: "Keep guards, prose windows, and scheduled prose"
    pros: "No record moves and no setting is added."
    cons: "The same window is written in every use case and drifts, settings change posted records silently, and deadlines hide in job prose."
  - name: "A central policy record for access, settings, and time"
    pros: "One place holds every bound."
    cons: "The policy duplicates each record's own fields and drifts from them."
choice: "A recent-sign-in setting, readable dated settings, and timed transitions"
consequences: "`access` takes `recentSignIn` naming the `setting/` holding the window, and the refusal derives like `forbidden`. `litespec/core/access#require-a-recent-sign-in-by-setting` states the rule. `reads` on a use case, reaction, or job names `setting/` identifiers, and a setting no record reads is reported. `dated: true` states that each value applies from a date and never changes a posted record; `default` takes the setting's `valueType`. A transition carries `after` from entering its source state with `movedBy` naming a `job/`. `litespec/core/automation#move-a-state-by-time-with-a-timed-transition` states the timed move. Long-running processes stay a pattern of states, reactions, and timed transitions."
reopenedWhen: "A sensitive act needs a window the product setting cannot state, or a deadline needs more than a duration and a job."
basedOn:
  - research/lower-layers-practice
