type: decision
id: decision/0009-research-states-its-conclusion
title: Research States Its Conclusion
options:
  - name: A conclusion field plus dated sources
    pros: One sentence as data renders in the book and gives every citing decision a stable takeaway to point at.
    cons: Every research record gains a field to write.
  - name: A Conclusion body section
    pros: No schema or checker change is needed.
    cons: Seven invented heading names show the drift a section codifies, and prose cannot be cited as data.
  - name: A record-level confidence field
    pros: One comparable value summarizes how far to trust each record.
    cons: One value falsifies multi-claim records, so confidence stays in Answer, claim by claim.
  - name: Leave research as question plus Answer
    pros: No author writes anything new.
    cons: A record finding stays editable in prose, and the book renders pages whose takeaway no field states.
choice: A conclusion field plus dated sources
consequences: "`litespec/core/intent#record-research-with-read-sources` states the question, the conclusion, the dated sources, and Answer. The book renders the Conclusion beside the question."
reopenedWhen: A research kind appears whose takeaway one sentence cannot state.
basedOn:
  - research/research-conclusion-evidence
