type: decision
id: decision/0096-read-field-names-in-their-record-type
title: Read Field Names in Their Record Type
context: "The review counted 291 field names and found about 20 with more than one meaning, while the stated policy claimed one meaning per word everywhere. The validator enforced a narrower rule, so the stated policy pushed new fields toward less natural names."
options:
  - name: "One name per meaning and one meaning per name for every field, with a field table"
    pros: "A reader who learned a name once knows it everywhere. The field table states each name's meaning, shape, and record types, and validate reports a name with two meanings or a field outside the table."
    cons: "Fields with more than one meaning are renamed, starting from the known cases."
  - name: "Read each field name in its record type"
    pros: "New fields take the names their readers already use."
    cons: "One word means two things on two types, and about 20 existing names already collide, among them kind, mode, name, key and fields."
choice: "One name per meaning and one meaning per name for every field, with a field table"
consequences: "Every field name carries the one meaning and shape the field table states for it: one name per meaning and one meaning per name, for every field of every record type. The field table holds one row per field name with its meaning, its shape, and the record types that use it. litespec-maintain validate reports a field name defined with two meanings or shapes, and a field outside the table. The renames start from the known cases: excludes states what a record does not cover everywhere; a module states what it covers in covers, paired with excludes; responsibilities stays for actors only and obligations for constraints only; each refusal entry carries its id and title, with the code as the id's name; a research source label is name, a setting configuration path is configurationPath, and key carries only an idempotency key. Docs, templates, Claimwick, the book's field labels and the CLI readers follow. Eleven fields are renamed for readability: product addresses to users, screen address to route, flow-step cites to carries, of to identifies, auth to authentication, dedupKey to deduplicationKey, params to parameters, requiresConsent to consentRule, recentSignIn to recentSignInLimit, atBound to outOfRange, and waiver exit to exitWhen; an external operation's timeout becomes an ISO 8601 duration. The records-complete fields take their natural names: a constraint's scope and a screen's states."
reopenedWhen: "A record type needs a field whose meaning no existing name carries naturally, or readers misread a name shared across types."
