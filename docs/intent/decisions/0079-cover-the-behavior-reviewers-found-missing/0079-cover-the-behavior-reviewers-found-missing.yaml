type: decision
id: decision/0079-cover-the-behavior-reviewers-found-missing
title: Cover the Behavior Reviewers Found Missing
options:
  - name: "A field or pattern for each gap the review proved"
    pros: "Signed-in acts, verified claims, row inputs, replays, unknown outcomes, cross-module completion, validity, scenario scope, and read risk each have a stated shape."
    cons: "Nine shapes land in one release, and each needs its provision, check, and example."
  - name: "Record the gaps as guidance with no fields"
    pros: "The release stays smaller."
    cons: "Claims stay forgeable, replays stay undefined, and scenarios keep asserting later operations."
  - name: "Cover only the signed-in and claim gaps"
    pros: "The forgery holes close."
    cons: "Replays, unknown outcomes, and completion stay in prose."
choice: "A field or pattern for each gap the review proved"
consequences: "`access.grant` takes `signed-in` beside `anonymous`, `self`, permissions, and `system`, refused with a derived `unauthenticated`. An input takes `origin: verified-claim` with `verifiedBy` naming the entry point or external system that validated it; a claim-shaped input with `origin: caller` on a provider-authenticated entry point is reported. `litespec/core/use-cases#mark-inputs-a-provider-verified` states the mark. An input takes `of` a row shape with typed fields, `required`, `minItems`, and `unique` keys. `idempotency` on a command states `replay` as `returns-first-result`, `refuses`, or `acts-again`, with `recognizedBy` under mode `state`. `litespec/core/use-cases#state-what-a-replay-does` states the replay. An external operation separates `rejected`, `accepted`, and `unknown`, and the unknown case names `onUnknown` handling. `litespec/core/edges#state-the-outcome-of-every-outside-call` states the separation. Work spanning modules raises its completion fact only after every module's part is done, with progress outside the deleted data. `litespec/core/automation#raise-completion-only-when-every-module-is-done` states the wait. A credential is invalid from its expiry and a cleanup job removes it within a stated interval. `litespec/core/automation#keep-validity-apart-from-storage` states the split. A scenario asserts only its own operation; each rule boundary in `exercises` gets its own scenario at the boundary; later effects belong to a flow test. `litespec/core/use-cases#keep-each-scenario-inside-its-operation`, `litespec/core/use-cases#give-each-rule-boundary-its-own-scenario`, and `litespec/frontend/testing#name-the-flow-a-flow-test-covers` state the scope. A query or permission disclosing personal or financial data carries its risk; the audit extension separates operation, outcome, refusal code, actor type, and target."
reopenedWhen: "A behavior needs a shape the additions cannot carry, or a landed addition proves too narrow for its gap."
basedOn:
  - research/lower-layers-practice
  - research/check-coverage-evidence
