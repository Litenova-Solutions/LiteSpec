type: decision
id: decision/0017-proof-that-holds
title: Proof That Holds
options:
  - name: Tracked proof state, check level blocking, four words, one code grammar
    pros: Committed hashes make staleness visible in CI, check level blocking ends silent silencing, four words end the double meanings, and one grammar ends synonym codes.
    cons: The ledger moves to a tracked file, every finding code is renamed, and the book drops its judgement code in one change.
  - name: Keep the cache ledger
    pros: No file moves and local runs keep their speed.
    cons: The cache is empty in CI, so the first passing run blesses whatever it finds.
  - name: Block on everything every day
    pros: Nothing unverified ever sits quietly.
    cons: Daily blocking on release-readiness items pushes adoption toward global silencing instead of steady proof.
  - name: Keep the book as judge
    pros: The book shows one verdict per record.
    cons: Rendering judges instead of the builder, so two vocabularies drift apart.
choice: Tracked proof state, check level blocking, four words, one code grammar
consequences: "`litespec/core/model#compute-proof-statuses-in-the-builder` holds the tracked proof state and keeps judgement in the builder, `litespec/core/model#show-only-computed-judgements-in-the-book` keeps rendering in the book, and findings block by check level. The glossary holds the four proof words, and `decision/0033-agents-never-weaken-proving-tests` adds the advisory proof-change finding on the method hash."
reopenedWhen: A test runner appears whose outcomes the builder cannot read.
basedOn:
  - research/lower-layers-practice
