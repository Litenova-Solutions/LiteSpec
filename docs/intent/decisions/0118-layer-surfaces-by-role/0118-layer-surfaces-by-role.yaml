type: decision
id: decision/0118-layer-surfaces-by-role
title: Layer Surfaces by Role
context: "The token roles page, card, card-edge and separator cannot describe stacked surfaces. A table header takes the fill of the page, a field takes the fill of whatever it sits on, and a selected row reads as its neighbour, because no role names the fill each one takes. A card inside a card reads as one surface where the structure says two. Each new pair of neighbours needs its own role, so the role list grows by accident instead of by design."
options:
  - name: "Keep page and card and add a role per neighbour pair"
    pros: "The existing roles stay, and each new pair gets a narrowly named role."
    cons: "The list grows with every pair anyone notices, each role states its own limit, and no rule says which layer a new surface takes."
  - name: "Address surfaces as layers by role"
    pros: "Four roles name the whole stack, each layer differs measurably from the surface it sits on in every scheme, and a new surface takes the layer its role names with no new role."
    cons: "The card and card-edge roles are renamed, so every token file, check and fixture moves in one change."
  - name: "Leave surfaces to the design contract with no token roles"
    pros: "No roles to keep, and each product describes its own surfaces."
    cons: "Nothing checkable remains: two products share no vocabulary for layers, and no check can judge whether two neighbours read apart."
choice: "Address surfaces as layers by role"
consequences: "The roles are `page`, `layer-1`, `layer-2` and `layer-accent`: `layer-1` sits on `page`, `layer-2` sits on `layer-1`, and `layer-accent` fills a table header, a field and a selected row on whichever layer holds them. Each layer differs from the surface it sits on by at least 1.06:1 relative luminance in every declared scheme, `layer-accent` against both `layer-1` and `layer-2`. The `card` role is renamed to `layer-1` and `card-edge` to `layer-edge` everywhere with no alias."
reopenedWhen: "Products need a surface the four roles cannot place, or the 1.06:1 step proves too small to read apart or too large to theme around."
supersedes:
- decision/0102-draw-platform-composites-with-native-elements
