type: decision
id: decision/0100-retention-holds-and-rounded-starts
title: Retention Holds and Rounded Starts
context: "Data classes declared a period with its start, but no hold: a tax audit, an objection, or a dispute had nowhere to pause deletion. And a period could start only at a date-like event, with no way to count from an event rounded up to a calendar end."
options:
  - name: "Hold deletion on the data class, and start a period from an event with rounding"
    pros: "The hold sits beside the retention it pauses with its reason and dates, and the start names its event and rounding in one field."
    cons: "Enforcement reads the holds beside the period it carries out."
  - name: "Hold deletion in a separate record"
    pros: "Holds stand apart from the classes they pause."
    cons: "Each hold links back to its class, and readers check two places for one retention."
choice: "Hold deletion on the data class, and start a period from an event with rounding"
consequences: "A data class carries holds beside its period, each with its reason, its heldOn date, and its liftedOn date once lifted, and deletion pauses while a hold stands. periodStartsAt takes any declared event or aggregate date field, or an event or field with rounding to a calendar end. The new provisions are litespec/core/privacy#pause-deletion-while-a-hold-stands and litespec/core/privacy#round-an-event-start-to-a-calendar-end."
reopenedWhen: "A hold needs behavior a dated entry fails to carry, such as approval by a second person."
