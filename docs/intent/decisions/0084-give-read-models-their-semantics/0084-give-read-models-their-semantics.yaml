type: decision
id: decision/0084-give-read-models-their-semantics
title: Give Read Models Their Semantics
context: "An earlier decision added the read-model record but left its event semantics open. No rule covered redelivery, ordering, corrections, rebuilds, staleness or erasure, so a rebuild risked restoring erased fields. No rule said whether a copy guards decisions needing current truth."
options:
  - name: "Identity, versions, tombstones, and no guard role"
    pros: "Redelivery never counts twice, latest compares source versions, erasure survives rebuilds and replay, and current-truth decisions stay with the owning module."
    cons: "Every source event carries identity, and read models keep tombstones for erased keys."
  - name: "Keep at-least-once copies with arrival order"
    pros: "No identity work and no tombstones."
    cons: "Redelivery double-counts, latest follows arrival instead of source, and a rebuild restores erased fields."
  - name: "Let read models guard decisions"
    pros: "Commands ask fewer decision ports."
    cons: "A revoked permission reads valid until the copy refreshes, and funds and locks decide on stale data."
choice: "Identity, versions, tombstones, and no guard role"
consequences: "Every source event carries an identity and redelivery never counts twice. `latest` compares source versions, not arrival. Corrections arrive as events. A rebuild replays retained events from the start. Staleness is measured from the source event's time. A read model keeps an erasure tombstone for an erased key and applies it on rebuild. A retained integration event has its erased personal fields removed or its key shredded. `litespec/core/automation#declare-each-read-model-field-from-a-published-field` and `litespec/core/automation#erase-a-read-model-personal-field-with-its-owner` state the field sources and erasure. Read models never guard decisions needing current truth. Revoked permissions, available funds, reservations, and period locks decide in the owning module through a decision port, which the command calls and revalidates within its own commit, or through the owner's own invariant. `litespec/core/automation#decide-current-truth-in-the-owning-module`, `litespec/core/backend-application#read-another-modules-state-through-a-read-model`, and `litespec/core/outbox#keep-published-events-available-for-read-model-rebuilds` state the decision port, the read rule, and the retained events."
reopenedWhen: "A source cannot carry identity, or a decision needs fresher truth than the owning module answers."
basedOn:
  - research/cross-module-coupling-practice
