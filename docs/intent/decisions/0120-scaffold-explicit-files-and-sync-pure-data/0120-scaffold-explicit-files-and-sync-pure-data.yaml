type: decision
id: decision/0120-scaffold-explicit-files-and-sync-pure-data
title: Scaffold Explicit Files and Sync Pure Data
context: "Partial-file codegen split each use case across normal files and generated partial twins, so a rename touched two files and reviews read halves. The generator code grew past 6,000 lines while the output still needed hand edits after every run."
options:
  - name: "Scaffold writes normal files once, sync writes pure data on demand"
    pros: "Each use case lives in one explicit file a person can read and edit. Generated output carries data only, so reruns never fight hand edits."
    cons: "Two commands to learn, and templates to keep for each stack."
  - name: "Keep partial-file codegen with generated twins"
    pros: "One command writes both halves, and no new workflow to teach."
    cons: "Every use case ships as two halves that drift, and the generator stays large."
  - name: "Hand-write every file with no tool"
    pros: "No generator to keep and no output to review."
    cons: "Every consumer repeats the same wiring by hand, and shared fixes never land everywhere."
choice: "Scaffold writes normal files once, sync writes pure data on demand"
consequences: "The command `litespec scaffold` writes one explicit normal file per use case that the owner edits freely. The command `litespec sync` writes pure-data files such as refusal codes, permission lists, and contracts, and it never writes a partial twin beside a hand-edited file. No `*.generated.cs` file ships in any stack. Claimwick carries per-use-case explicit files as the example."
reopenedWhen: "A stack needs output that pure data cannot carry, or scaffold templates drift from the records they were copied from."
