type: decision
id: decision/0116-write-the-design-rules-down
title: Write the Design Rules Down
context: "LiteSpec's design rules lived only in its decisions. Each new record type or field decided again when a record gets its own file, what a type must ship with, and how a shape changes, and the answers drifted: requirements moved into folders while rules, settings and domain events stayed in sets for the same reasons. The agent protocol stated how the standard reads, not how its record model is designed, so an agent changing LiteSpec had no rule to follow and no way to tell an exception from a pattern."
options:
  - name: "Leave the design rules in the decisions"
    pros: "No new page, and each decision keeps its full reasoning."
    cons: "A maintainer must read over a hundred decisions to find a rule, the same question is decided again, and nothing marks a departure as a departure."
  - name: "List the design rules in the agent protocol only"
    pros: "Every agent reads them before every change."
    cons: "A rule in the protocol has no identifier, no strength and no review question, so nothing can cite it or check it, unlike every other rule LiteSpec states."
  - name: "State the design rules as provisions on one page, and summarize them in the agent protocol"
    pros: "Each rule has an identifier, a strength and a review question like every other provision, the page cites the provisions other pages already own instead of copying them, and the protocol points every agent at them."
    cons: "One more page to keep, and the summary in the protocol has to follow the page."
choice: "State the design rules as provisions on one page, and summarize them in the agent protocol"
consequences: "The page `docs/core/designing.md` holds the design rules that no other page owned: one thing per record, a folder for a record with its own reasoning, a shape ready for its next field, a reader for every type, field and value, a record type shipped complete, a shape changed everywhere at once, a stated deviation, and an amendment for a rule that keeps bending. It lists the provisions other pages own that a designer follows. The agent protocol gains a Designing LiteSpec section that summarizes the rules and cites them."
reopenedWhen: "The page restates provisions other pages own, or decisions keep setting its rules aside without amending them."
