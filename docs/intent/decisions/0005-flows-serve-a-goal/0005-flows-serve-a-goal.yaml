type: decision
id: decision/0005-flows-serve-a-goal
title: Flows Serve a Goal
options:
  - name: A flow serves one goal record
    pros: The flow is the only Intent record that means goal with prose, and both story mapping and impact mapping make the spine a link the book can follow.
    cons: Every flow sentence must be mapped by hand to a goal record, because no mechanical mapping exists.
  - name: Keep the goal a sentence only
    pros: A founder accepts a flow chapter with no field names and no other page to open.
    cons: The book cannot roll steps up to a goal at all, so the top-down edge stays missing by design.
  - name: Replace the sentence with the link
    pros: One field holds the whole goal fact with nothing to keep in sync.
    cons: It demotes the sentence the founder accepts, and a goal link carries less information than the sentences it would replace.
  - name: Allow several goals per flow
    pros: A walk can serve a staff outcome and a system promise at once.
    cons: Both spine methods say one spine, and the singular shape states the rule instead of hiding it in a one-element list.
choice: A flow serves one goal record
consequences: "`litespec/core/intent#lead-each-flow-toward-the-record-it-exists-for` states the sentence beside the link. Use cases serve flow steps rather than goals."
reopenedWhen: A flow kind appears that walks toward no goal record.
basedOn:
  - research/intent-hierarchy-evidence
  - research/cross-layer-trace-evidence
  - research/established-traceability-practice
