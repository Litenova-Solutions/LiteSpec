type: decision
id: decision/0112-cast-as-a-record
title: Cast as a Record
context: "The example cast was a Markdown document, .litespec/example-cast.md, with the example-cast document page style. Its people, parties, occasions, figures and values were typed as prose, so tools could not read them as data: links to actors and terms went unchecked, 'where it appears' back-references were not computed, and development seed data had no one machine-readable source to draw from. A reader could not ask which record or code mark used a person without searching the whole tree."
options:
  - name: "Make the cast a typed record at .litespec/cast.yaml with four optional entry lists"
    pros: "Names, actors, parties, occasions and typed values become machine-readable. Link checks resolve actor, partyOf, involves and term, back-references are computed, and one cast feeds development seed data under a rule that keeps cast values out of production."
    cons: "Every example, template, init copy and page-style check changes in one change."
  - name: "Keep the example cast as a Markdown document"
    pros: "Nothing changes in the examples, templates or validator."
    cons: "Values stay unreadable as data, links go unchecked, back-references stay uncomputed, and seed data keeps no one source."
choice: "Make the cast a typed record at .litespec/cast.yaml, a fixed-name file beside product.yaml and glossary.yaml, with an optional explanation .litespec/cast.md that adds no fact. Its type is cast, its id is cast/<product-name>, and it holds four optional lists: parties, people, occasions and figures, each entry carrying type equal to its kind. A figure value holds exactly one of money, quantity, percentage, date, count or text. Entry ids follow party/<name>, person/<name>, occasion/<name> and figure/<name>, and each link field reads in the generated Links table, like every other link."
consequences: "The cast is optional, and a project with no cast has no finding. The schema reports record-invalid for a malformed cast, and the existing unknown-link checks cover actor, partyOf, involves and term. Two checks are added: cast-identity-unreserved (level G, blocking) for a person email outside a reserved test domain, and cast-entry-unused (level A, advisory) for an entry no record field, explanation file or code mark cites by id or, for a person or party, by exact name. Examples draw their details from the cast record. litespec/quality/development#seed-only-development-and-test-environments allows cast names and values in development seed data, demo data, fixtures and tests and keeps them out of production code paths and production data. Seed and fixture code marks the entries it uses with <seeds>party/...</seeds> in C# or // litespec: seeds party/... in TypeScript, read like the other code marks, and mark-unknown reports an unknown id. The book renders the cast as one page with computed 'where it appears' back-references. The example-cast page style, its page sections check, the init copy and the example-cast template are removed; init copies a schema-valid cast.yaml template with placeholders."
reopenedWhen: "A cast figure needs a value the six kinds do not hold, or a project needs two casts."
