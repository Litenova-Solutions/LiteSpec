type: decision
id: decision/0065-read-another-module-through-a-view
title: Read Another Module Through a View
options:
  - name: "A view record each consumer owns, built from published integration events"
    pros: "A module reads its own copy of what it needs, each field names the published field it comes from, a personal field names the event that erases it, and the owner keeps no reader written for one caller."
    cons: "A consumer writes and runs projections, a view lags the owner by its declared freshness, and a new view needs the published events kept for its rebuild."
  - name: "Keep read ports in the owner's Contracts"
    pros: "A reader always sees the owner's current value, and nothing is copied."
    cons: "Readers grow one method per caller, every reading module couples to the owner's storage and uptime, and no record states which fields cross the boundary."
  - name: "Share the owner's tables through database views"
    pros: "No events and no projections are needed."
    cons: "The owner's schema becomes another module's contract, which the module boundary exists to prevent."
choice: "A view record each consumer owns, built from published integration events"
consequences: "A Behavior record kind `view` lives at `behavior/modules/<module>/views/<name>/` with the identifier `view/<module>.<name>`. It names the other module's aggregate in `keyedBy`, each field's source as `integration-event/<name>#<field>`, the events that remove a row in `removedBy`, and its `freshness`. A personal or sensitive field names its `erasedBy` event. A use case names the view in `reads`. `model check` reports `view-source-unknown`, `view-erasure-missing`, `view-unused` and `view-key-invalid`. Code sits in the module `Views/` folder, one folder per view with its projections and its reader. A screen that only shows another module's data calls each owner's own query. A command whose decision needs another module's current value asks one question through a decision port. Repositories, outside-system ports and rule calculators stay ports. With the outbox extension, an integration event a view names is kept for as long as a view may rebuild from it."
reopenedWhen: "A consumer shows a view whose freshness no decision can accept and no decision port can answer, or a rebuild that cannot replay the kept events."
basedOn:
  - research/cross-module-coupling-practice
