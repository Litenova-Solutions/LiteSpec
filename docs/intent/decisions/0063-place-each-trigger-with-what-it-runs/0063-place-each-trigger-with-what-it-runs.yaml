type: decision
id: decision/0063-place-each-trigger-with-what-it-runs
title: Place Each Trigger with What It Runs
context: "A use-case folder held its files flat, while event handlers sat in a fact folder and jobs sat in a module Jobs folder. A handler in a fact folder named the command of a use case in another folder. Those commands and results moved to shared folders, and one large consumer counted about 270 such files and 232 fact folders."
options:
  - name: "Each use case owns its layer folders, its models and its triggers"
    pros: "A use-case folder shows its endpoint, its message, its handler, and every reaction and job that runs it. No use case names another use case's types."
    cons: "Every use case gains an Application folder, two use cases with one shape each hold a copy, and every consumer moves its handlers and jobs."
  - name: "Keep fact folders and shared message folders"
    pros: "No file moves, and one folder lists the handlers of one fact in one module."
    cons: "A fact folder names the commands of other use cases, so those commands leave their folders, and a fact's reactions still scatter across modules."
  - name: "Group by message kind inside each module"
    pros: "Commands, queries, and handlers each sit in one folder a reader can scan."
    cons: "Folders name mechanisms instead of product acts, and one use case spreads over four folders."
choice: "Each use case owns its layer folders, its models and its triggers"
consequences: "`Application/` and `WebApi/` each hold one plural aggregate folder with one folder per use case inside it: `Application/{Aggregates}/{UseCase}/` always, and `WebApi/{Aggregates}/{UseCase}/` when the use case has an endpoint, with no loose files. A module-level use case drops the aggregate segment in each. A reaction's event handler sits in the `Application/` folder of the use case its record runs. A reaction or job that only sends sits in the `Application/Notifications/` folder named for its notification. One that only calls sits in the `Application/ExternalSystems/` folder named for its system. The module `Jobs/` folder, the `On{Fact}/` folders, the `UseCases/` folders with their layer folders, the aggregate and module `WebApi/` folders, and the `Contracts/Commands/` and `Contracts/Exceptions/` folders leave the closed set. LS2019 drops its exemption for messages and results. No use case names another use case's types, and a shape two use cases need is declared in each. The provision `litespec/workspace/naming#place-each-trigger-with-what-it-runs` states the new placement under an identifier that names it."
reopenedWhen: "A consumer shows a trigger that runs no use case, sends no notification, and calls no system. Or a consumer shows two use cases that must share a shape because a copy would let them disagree on a rule."
basedOn:
  - research/cross-module-coupling-practice
