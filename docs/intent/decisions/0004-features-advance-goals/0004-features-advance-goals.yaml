type: decision
id: decision/0004-features-advance-goals
title: Features Advance Goals
context: "A feature links to a goal with the word `serves`. The other records that use `serves` link to flow steps, not to goals. The same word therefore names two different kinds of target."
options:
  - name: Advances for goals
    pros: The goal link gains its own verb and ends the three-target split of serves. The problem a feature answers is the folder it sits in, and the goal link is the first small step the trace needs.
    cons: Features, provisions, checks, and the book must all learn the new verb in one change.
  - name: Keep serves for features
    pros: No field renames and no citation sweep are needed.
    cons: Serves keeps three target sets and two meanings, and invalid values already exist where authors must guess which targets a carrier allows.
  - name: Goals optional for features
    pros: With few goals, forcing one goal per feature risks vague claims that carry less information than the Offering.
    cons: A reader who starts at most planned features reaches no goal, and only a few live requirements trace to any goal.
  - name: One shared link for goals and problems
    pros: A feature carries one list instead of two.
    cons: A goal states an outcome and a problem states a pain, so one list hides which the feature moves.
choice: Advances for goals
consequences: "`litespec/core/intent#state-each-feature-with-its-offering` states the renamed fields. Serves keeps one meaning per carrier: a use case, reaction, job, or screen serves flow steps, and a flow serves one goal."
reopenedWhen: A feature kind appears that advances no goal and solves no problem.
basedOn:
  - research/intent-hierarchy-evidence
  - research/cross-layer-trace-evidence
  - research/established-traceability-practice
