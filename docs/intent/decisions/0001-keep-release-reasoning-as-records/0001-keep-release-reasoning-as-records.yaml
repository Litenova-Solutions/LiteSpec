type: decision
id: decision/0001-keep-release-reasoning-as-records
title: Keep Release Reasoning as Records
options:
  - name: Consumer homes under docs/intent
    pros: Comparable projects keep rationale in numbered records beside the normative text, and the specification stays the only normative surface. The consumer research and decision shapes already exist with an exercised example.
    cons: The maintainer validator and the site each need a record pass before the records publish and check.
  - name: A root records folder
    pros: Reasoning stays visibly separate from the documented contract.
    cons: No site ingestion or authoring precedent covers a root folder, and the maintainer validator walks its pages as stray Markdown.
  - name: Stay in .agents
    pros: No contract, validator, or site change is needed.
    cons: Git ignores working folders, so the reasoning is neither tracked nor referenced, and no later change can cite it.
  - name: docs/reference
    pros: The reasoning sits beside the other exact material readers consult.
    cons: The reference style states exact values and owns no records, so record pages would break the area contract.
choice: Consumer homes under docs/intent
consequences: "`litespec/core/maintaining#record-the-reasoning-behind-each-release` states the obligation, and its Checked by line names the five `RECORD_*` codes. Research and decisions inform and explain; the provision remains the only obligation."
reopenedWhen: LiteSpec stops publishing provisions as its specification.
basedOn:
  - research/comparable-rationale-practice
  - research/established-traceability-practice
