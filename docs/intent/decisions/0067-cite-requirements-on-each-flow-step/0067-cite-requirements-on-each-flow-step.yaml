type: decision
id: decision/0067-cite-requirements-on-each-flow-step
title: Cite Requirements on Each Flow Step
context: "A flow cited its requirements as a whole, so nothing recorded which step carried which promise and steps restated requirements instead of pointing at them. In one consumer a sign-in flow restated a code rule in a failure and held two steps off its path only to carry citations."
options:
  - name: "Each step cites the requirements it carries, and the flow citations are computed"
    pros: "Each promise is cited on the step where it applies. Numbers and limits are stated once in the cited requirement. No flow-level cites disagrees with its steps."
    cons: "Every flow's citations move onto steps by hand. Failures that state a rule are reworded to state the experience."
  - name: "Keep cites on the flow"
    pros: "No record changes and citations stay in one list."
    cons: "Nothing records which step carries which promise. Steps restate requirements. Requirements attach through steps off the path."
  - name: "Cite requirements from the serving use cases only"
    pros: "Each requirement is cited once, where it is fulfilled."
    cons: "The flow loses which step carries the promise. A reader opens Behavior to read an Intent story."
choice: "Each step cites the requirements it carries, and the flow citations are computed"
consequences: "A step names the requirements it carries in `cites`. The flow carries no `cites`. The model reads the union of its steps. A step's `statement` and `failure` state what the person does and experiences. Numbers, limits, and conditions stay in the cited requirement. A step names a person in `actor`, or the system actor standing for the outside system when no person acts, never a job or a reaction. Jobs and reactions serve the step upward like use cases. A feature's in-scope flows are the flows citing its requirements through their steps. The book lists each cited requirement under its step with its statement, `except`, and fallback. `litespec/core/intent#write-flow-steps-as-sentences-with-ids`, `litespec/core/intent#state-each-flow-blocker-as-a-step-failure`, `litespec/core/intent#perform-each-flow-step-with-an-actor-or-an-external-system`, and `litespec/core/model#serve-every-flow-step` state the step shape and its servers."
reopenedWhen: "A requirement applies to a flow as a whole and to no single step. Or a step needs a server the serves link cannot name."
basedOn:
  - research/intent-hierarchy-evidence
  - research/cross-layer-trace-evidence
