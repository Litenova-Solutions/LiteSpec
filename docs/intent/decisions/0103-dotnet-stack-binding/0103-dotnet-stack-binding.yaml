type: decision
id: decision/0103-dotnet-stack-binding
title: Settle the .NET Stack Binding, Protocol, and Sign-In
context: "A consumer product built a whole application on the 7.0.0 pre-release and reported five gaps in the .NET stack: the pinned binding named no Marten outbox storage and the manifest pinned LiteBus at 7.x, which can resolve below the 7.2 the binding needs; it named only the audit definition, leaving authorization and idempotency definitions unnamed and unplaced; the agent protocol pointed at an online release that is not published, so agents followed an older published release; nothing said where a hosted sign-in fits, so each protocol step became a command calling the provider inline; and the analyzers failed to load when referenced by project, because their dependencies do not travel with the reference."
options:
  - name: "Bind the pipeline to LiteBus 7.2 definitions and Marten storage, point the protocol at the local docs, model hosted sign-in as use cases, and consume unreleased analyzers through a local feed"
    pros: "Every pipeline position names its LiteBus 7.2 API, each message declares authorization, audit, and idempotency in placed definition classes, a Marten project stores outbox rows in its own transaction, agents read the release the project pins, the sign-in shows declared edges, and unreleased analyzer builds load."
    cons: "The manifest pins LiteBus at exact versions, so a later LiteBus release needs a new LiteSpec release to bless it; the protocol template gains a docs placeholder that every renderer fills."
  - name: "Keep one definition per message, Entity Framework Core storage beside Marten, major pins, the online protocol URL, host sign-in endpoints, and analyzer project references"
    pros: "No page, template, or renderer changes."
    cons: "Each gap stays: invented guards beside LiteBus definitions, a second persistence stack for outbox rows, APIs that do not exist below 7.2, agents following the wrong release, sign-in steps the effect rules refuse, and analyzers that fail to load."
choice: "Bind the pipeline to LiteBus 7.2 definitions and Marten storage, point the protocol at the local docs, model hosted sign-in as use cases, and consume unreleased analyzers through a local feed"
consequences: "Each message declares its pipeline positions in its use case Application/ folder in {Message}AuthorizationDefinition, {Message}AuditDefinition, and {Message}IdempotencyDefinition, each in its own file and implementing exactly one of IAuthorizationDefinition<TMessage>, IAuditDefinition<TCommand>, and IIdempotencyDefinition<TMessage>; a definition carries no LiteSpec mark and a project uses no attribute or custom guard for what a definition declares. A Marten project composes outbox.UsePostgreSqlStorage with UseMartenTransactionalOutbox, and a project that persists through Entity Framework Core keeps LiteBus.Outbox.Storage.EntityFrameworkCore. The manifest pins every LiteBus package at 7.2.0 and adds LiteBus.Outbox.Storage.Marten. The agent protocol template points at __LITESPEC_DOCS__, which model render fills with the local docs of the carried release and the site fills with the selection index URL, and it tells the agent to read this release only. A hosted sign-in is modeled as use cases that start and complete the sign-in, with the provider as an external system. An unreleased analyzer build is consumed through a local feed, never through a project reference."
reopenedWhen: "LiteBus moves its definitions or outbox storage to new APIs, the tool can no longer ship its docs beside its binary, or a hosted sign-in needs a shape the two use cases cannot state."
