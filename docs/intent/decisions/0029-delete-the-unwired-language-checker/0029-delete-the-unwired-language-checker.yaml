type: decision
id: decision/0029-delete-the-unwired-language-checker
title: Delete the Unwired Language Checker
context: "The glossary language checker exists in code, but no command runs it. Its rules and finding codes exist only in the docs, where a reader can mistake them for checks the tools run."
options:
  - name: "Delete the glossary language checker"
    pros: "Unwired code leaves the release, and each kept check runs under a command."
    cons: "Glossary wording rules rest on review, with no checker wired to them."
  - name: "Wire the checker into validate now"
    pros: "Glossary wording is checked on every run."
    cons: "The team never reviewed the checker's findings against the pages, and wiring it adds a feature outside this release."
  - name: "Keep the checker unwired"
    pros: "No change to the code."
    cons: "Unwired code drifts from the rules it was written for, and a reader takes it for a check the tools run."
choice: "Delete the glossary language checker"
consequences: "The checker leaves the code, and the `refusals.prefixes` setting leaves the project file, since no check reads it once the checker is gone. Fourteen documented finding codes that no check emitted leave the finding table and the docs. Most of them were the checker's output. The four pages that cited them state the rule as a review question."
reopenedWhen: "The owner funds a glossary checker with its own tests, or a glossary rule appears that review cannot hold."
