type: decision
id: decision/0049-literal-flow-words-concrete-consequences
title: Use Literal Flow Words and Concrete Consequences
context: "The word walk stood for a flow in several places, and in some said nothing about the act. The phrase why it matters produced openings naming no consequence and no party. Both phrases sat in guidance for goals, actors, notifications, products and the glossary, not only for flows and constraints."
options:
  - name: "Replace walk and why it matters in every provision, template and glossary entry"
    pros: "One mechanical replacement covers every record type, and the rule reads the same in each file."
    cons: "Every file that uses the words changes, including the glossary, the templates and the fixtures, and the citation of one renamed testing provision changes with them."
  - name: "Change only the flow and constraint wording"
    pros: "Fewer files change, and the actor, goal and notification records keep their wording."
    cons: "The same loose word stays in four record types, and a writer sees two rules for one word."
  - name: "Keep the wording and add a weak and strong example to the guides only"
    pros: "No record or provision changes, and the guides show stronger wording."
    cons: "The provisions still accept loose verbs, and a writer who reads only a template meets the old words."
choice: "Replace walk and why it matters in every provision, template and glossary entry"
consequences: "The flow sense of walk becomes take: an actor takes a flow, the Links table reads is taken by and takes, and the glossary entry for Flow uses the same verb. The verb in the testing provision that names a flow test changes from walks to covers, and each citation of it changes in the same change, including follows and proves marks in code. Loose uses of walk where a literal verb exists are replaced. Why it matters becomes the consequence at stake, and for whom, in `litespec/core/intent#summarize-every-flow-before-its-steps`, `litespec/core/intent#state-each-goal-with-its-measure`, `litespec/core/writing#open-each-explanation-file-with-a-paragraph`, the fix text of `explanation-opening-missing` and the opening prompts of the record templates. `describe-every-flow` asks for who takes the flow, what they achieve and the consequence at stake. `litespec/core/writing#use-literal-words` gains a weak and a strong example. Documentation pages keep why it matters where it describes a page's Intent section, and decision and research records keep the wording they were written with."
reopenedWhen: "Consumers report that take reads poorly in a sentence about a flow that an actor does not take alone, or that the consequence phrase makes explanation openings longer than a cold reader needs."
