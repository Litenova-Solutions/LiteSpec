type: decision
id: decision/0039-ship-a-litespec-skill
title: Ship a LiteSpec Skill
options:
  - name: "Ship one generated skill as a copy per agent, at project and global scope"
    pros: "One template change reaches every agent and scope through `skill add`, and each copy works in git and on Windows with no extra rights."
    cons: "Every target holds its own copy, so a hand edit in one copy drifts from what the release generates."
  - name: "Link each target at one shared skill folder"
    pros: "One folder holds the whole skill, so no copy can drift from another."
    cons: "A link needs Developer Mode or admin rights on Windows, and the linked text travels outside git."
choice: "Ship one generated skill as a copy per agent, at project and global scope"
consequences: "`templates/skill/litespec/` holds the only skill source: `SKILL.md` with `references/commands.md` and `references/report.md`. The entry names the skill `litespec`, triggers on work in a repository holding `.litespec/project.yaml`, and states the task order instead of the rules. Each target gets its own generated copy: `claude`, `opencode` and `agents` write under `.claude/skills/`, `.opencode/skills/` and `.agents/skills/`. At global scope the same three write under the home folder, need no project file, and name no release. Every copy carries `generated-by: litespec` in its frontmatter `metadata`, and a project copy adds the release as `litespec-release`. `litespec skill add` writes every selected copy and replaces a copy the tool wrote, and refuses a folder without its marker. With no `--agent` it selects `agents` and `claude`, and `litespec skill remove` deletes only a folder carrying the marker. Tests point the global scope at a temporary home through `LITESPEC_SKILL_HOME`. `init --skill` installs the skill at project scope during setup, and `--skill-global` installs it at global scope instead. Without the flag, `init` prints the `skill add` command as its last line. `model render` rewrites project copies carrying the marker, and `model check` reports `skill-drift` at level S when one differs. Global copies live outside the project and stay outside the check. `skill add` writes Markdown files only and installs no hooks; the edit-time recipes live on the guide page the skill references. The top twenty judged provisions across the Claimwick code hold none that a cheap and sure check covers, so no provision gains a check. The entry-file table states which file each agent reads and how each bridges to `AGENTS.md`. `init` prints a line and `model check` reports `agent-protocol-unreached` as advisory when a `CLAUDE.md` does not import `AGENTS.md`. `litespec/core/agent#keep-the-agent-protocol-current` holds the drift obligation for the region and the project copies."
reopenedWhen: "A supported agent stops reading its skill folder, or a target forbids generated copies."
