type: decision
id: decision/0014-one-exception-record
title: One Exception Record
options:
  - name: One exception record with scope and expiry
    pros: One shape carries every waiver with its reason, scope and end date, and covers only what it names.
    cons: Deviations, known gaps, deferrals and the frozen phase all migrate to the one record in one change.
  - name: Keep four mechanisms and tighten each
    pros: Each mechanism keeps its readers.
    cons: Four waiver shapes and four expiry rules keep the uneven coverage that caused the finding.
  - name: Exceptions as project settings only
    pros: The project file holds every waiver in one place.
    cons: Settings carry no reason and no per-item expiry, so waivers never return for review.
  - name: Every finding blocks
    pros: No waiver, no waiver abuse.
    cons: One-person teams stall on advisory findings.
choice: One exception record with scope and expiry
consequences: "`litespec/core/model#record-accepted-gaps-as-exceptions`, `litespec/core/model#record-a-project-wide-lowering-as-an-exception` and `litespec/core/release#record-accepted-debt-as-an-exception` state the mechanisms this decision unifies; the Governance pages replace them with the one exception record."
reopenedWhen: A waiver appears that covers neither a provision nor named finding codes.
basedOn:
  - research/lower-layers-practice
