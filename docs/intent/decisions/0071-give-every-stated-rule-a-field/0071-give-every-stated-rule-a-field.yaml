type: decision
id: decision/0071-give-every-stated-rule-a-field
title: Give Every Stated Rule a Field
context: "The pages stated rules the records had no fields to hold: reaction triggers, unnamed scenario rules, nested links, and undescribed event fields. In one consumer four reactions triggered on another module's event with no finding, and Claimwick scenarios showed rules the records never named."
options:
  - name: "A field for every stated rule, and a check where cheap and sure"
    pros: "No rule stays in prose alone. Reactions, scenarios, links, and domain events each have a check that proved itself on real records."
    cons: "Records carry more fields. Each check must prove cheap and sure before it is added."
  - name: "Prose rules with sampled review"
    pros: "Records carry fewer fields."
    cons: "Rules drift from behavior with no finding. The checks miss the defects that matter."
  - name: "A check for every rule"
    pros: "Everything stated is verified."
    cons: "Unsure checks report false findings and train authors to ignore findings."
choice: "A field for every stated rule, and a check where cheap and sure"
consequences: "A reaction triggers only on its own module's domain event or on an integration event, reported as `reaction-trigger-foreign`. Scenarios name the rules they show in `exercises`. `scenario-rule-unexercised` reports a refusal scenario whose result's rule `exercises` lacks and an input rule no scenario exercises. Every link is a typed identifier through the link and locality checks. This includes nested `boundBy`, output-group reads and widening, input `rules`, `onFailure` targets, and waiver subjects. Domain events carry typed fields in `carries`. `event-field-uncarried` reports a payload field the translated domain event lacks. `refusal-generic-written` reports a hand-written generic refusal. `statement-word-vague` reports a vague word under `litespec/core/model#state-what-happens-in-every-behavior-statement`. `example-keys-drift` reports scenario example rows with differing keys. `external-system-placement-wide` reports a product-level external system one module calls. `term-missing` ignores names from the example cast."
reopenedWhen: "A stated rule needs a field the record cannot carry. Or an added check reports false findings on real records."
basedOn:
  - research/check-coverage-evidence
  - research/lower-layers-practice
