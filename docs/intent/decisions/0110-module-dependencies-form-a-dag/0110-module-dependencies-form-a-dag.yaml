type: decision
id: decision/0110-module-dependencies-form-a-dag
title: Module Dependencies Form a DAG
context: "Two modules of the owner's product referenced each other's identifiers. Identity sessions held the chosen workspace, while workspace memberships named people, so neither module stated what it owned. The audit trail lived in Workspaces while its pseudonyms lived in Identity, so one concern sat split across two modules. Each module built on the other, and neither had a seam to split along. Choreography added two-way pairs on top: a process spanning modules could only run as reactions answering each other's facts, so ten pairs of modules of one product depended on each other both ways. Outside practice counts every edge kind in the graph: Spring Modulith verifies that module dependencies form a directed acyclic graph, counting event listeners beside code references."
options:
  - name: "Move the split concept into one module so the dependency graph stays acyclic"
    pros: "Every concept has one owning module. The dependency graph shows which module builds on which, and each edge has one direction."
    cons: "Moving the concept changes the owning module's records, code, and stored data in one change."
  - name: "Share the cycled identifiers through the Kernel"
    pros: "Neither module references the other: both reference the Kernel, and the project cycle is gone."
    cons: "The cycle stays as a design fact with its project error hidden. The Kernel fills with identifiers owned by no module, and the split concept stays split."
choice: "Move the split concept into one module so the dependency graph stays acyclic. Every relationship between two modules has one direction: A depends on B when A references B's Contracts, sends B's public queries or public commands, or reacts to B's facts. Module dependencies form a directed acyclic graph over all four edge kinds. A cycle means a concept is split across two modules, and the fix is to move the concept, never to share identifiers through the Kernel."
consequences: "The library product keeps three modules in one direction. Readers owns readers and cards and depends on nothing. Lending owns loans and holds and depends on Readers. History owns the loan trail, its checkpoints, and reader pseudonyms, and depends on Readers and Lending. The reader's current loans moved from the reader aggregate to Lending, keyed by the reader identifier: the product behavior is unchanged, and each concept has one owner. The graph counts Contracts references, queries edges, commands edges, and reactions to facts. A dependency cycle is a finding naming both modules and the edges that close it, and its fix moves the split concept."
reopenedWhen: "Two modules show a genuine mutual need that no moved concept resolves. Or a product shows a cycle its modules cannot break by moving one concept."
