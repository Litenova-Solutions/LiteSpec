type: decision
id: decision/0127-record-a-refused-run-on-the-reacting-side
title: Record a Refused Run on the Reacting Side
context: "A reaction in one module often runs another module's public use case, and that use case can refuse. The reacting module then records the refusal on its own aggregate, so its reader sees the run failed instead of pending. A reaction runs at most one use case, so the record had no field for the recording run, and the code ran a second use case the record did not state."
options:
  - name: "Name the recording use case in onRefusal on the runs effect"
    pros: "The record states both runs and their order. A refusal commits nothing, so the second run never follows a committed one, which is the reason a reaction runs one use case."
    cons: "The effect entry gains a field, and every reader of runs reads it as a second target."
  - name: "Raise a refused fact in the called module and answer it with a second reaction"
    pros: "Each reaction runs one use case."
    cons: "A refusal commits nothing, so the called module would write a record only to announce that it refused."
  - name: "Leave the refusal in the dead letter for an operator"
    pros: "No new field."
    cons: "The reacting module's reader shows the run as pending forever, and the refusal waits on a person."
choice: "Name the recording use case in onRefusal on the runs effect"
consequences: "The triggered effect entry carries `onRefusal`, a use case of the reacting module, allowed only beside `runs`. The runs edge reads it after the use case it follows, so access, reach, locality and proof checks cover it, and the one-use-case count ignores it. `litespec model check` reports `record-invalid` for an `onRefusal` on an effect with no `runs`."
reopenedWhen: "A product needs to answer a refusal with something other than one recording use case of the reacting module, or a refusal needs a retry policy of its own."
