type: decision
id: decision/0082-give-every-rule-one-home-and-one-strength
title: Give Every Rule One Home and One Strength
options:
  - name: "One home per rule, contradictions resolved, strength apart from detection"
    pros: "Each concept has one owning page, implementation rules leave the core, modals stop contradicting, findings block by strength, and contradictions report instead of hiding."
    cons: "Rules move between pages in one release, and authors learn the new strength grades."
  - name: "Patch each contradiction where found"
    pros: "The move is smaller."
    cons: "The next review finds the next pair, and strength and blocking stay tangled."
  - name: "Keep the core as the whole contract"
    pros: "One scope covers every page."
    cons: "The record model, an architecture, an agent procedure, and writing conventions stay mandatory as one bundle."
choice: "One home per rule, contradictions resolved, strength apart from detection"
consequences: "Each glossary entry names its owning page in `home`; a generated concepts page lists each concept with its home and the provisions there, and `validate` reports a provision restating another page's rule instead of citing it. Architecture rules live in the architecture pages; `docs/core/` keeps the record model, links, ownership, authority, evidence, the agent protocol, and writing. `litespec/core/agent#select-task-context` states the one context rule and absorbs the local-pattern provision. The product layout is fixed and the validator reads the one layout. Cross-module links follow the one rule on the model page. Scope, containment, storage, and book grouping name the four placement words. `MUST` is required, `SHOULD` is advisory and needs no departure, and a default is replaced by a project convention; a finding on a required provision blocks unless a departure parks it, and a finding on an advisory provision never blocks. `litespec/core/authoring#match-strength-to-the-modal-word` grades the modal. A lower record never overrides a higher one: contradictions report and resolve by updating records, behavior in code with no record is recorded or reported, and only an explicit product `excludes` overrides a requirement. `litespec/core/model#follow-the-authority-order` states the order. Under `model check --release`, a claimed layer whose reader is missing or failing blocks unless a departure with an expiry parks it."
reopenedWhen: "A rule needs two homes to be found, or a finding's strength misgrades its harm."
basedOn:
  - research/check-coverage-evidence
  - research/comparable-rationale-practice
