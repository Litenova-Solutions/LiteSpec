type: decision
id: decision/0068-call-ordered-steps-a-flow
title: Call Ordered Steps a Flow
options:
  - name: "flow"
    pros: "The standard user-flow term fits any actor, steps read as the main flow and branches as the alternative flows, and no record type uses the word today."
    cons: "Every flow record, identifier, folder, provision, check, template, and citation moves in one release."
  - name: "workflow"
    pros: "Readers outside software know the word."
    cons: "The word suggests automation engines, while the record holds the ordered steps of one actor."
  - name: "process"
    pros: "The word is standard in operations."
    cons: "The word is heavy for one actor's ordered steps, and it suggests a managed process the record never holds."
  - name: "Keep journey"
    pros: "No record, identifier, or provision moves."
    cons: "Journey maps hold touchpoints, emotions, and channels the record never holds, while every other type uses a standard engineering name."
choice: "flow"
consequences: "The record type is `flow`, identifiers read `flow/<name>` and `flow/<name>#s1`, and flows live in `intent/flows/`. The schema carries `flowPage`, `flowId`, `flowStep`, `flowStepId`, and `flowBranch`; code and tests carry `Flow`; a journey test is a flow test. The sixteen provisions naming the old type take the slugs their new headings derive, with every citation replaced. `litespec new flow` and `litespec rename` write the new shape, and the consumer template is `flow.yaml`. `litespec/core/intent#describe-every-flow`, `litespec/core/model#serve-every-flow-step`, and `litespec/core/release#run-flow-checks` state the renamed record, its servers, and its checks."
reopenedWhen: "A consumer shows that flow misleads its readers about what the record holds."
basedOn:
  - research/naming-grammar-evidence
  - research/field-naming-evidence
