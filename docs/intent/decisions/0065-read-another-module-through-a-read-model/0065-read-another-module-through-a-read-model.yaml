type: decision
id: decision/0065-read-another-module-through-a-read-model
title: Read Another Module Through a Read Model
context: "A module read another module's data through a read port in the owner's Contracts folder. One large consumer had 86 such readers named in 741 files of other modules, and the busiest reader had 18 methods. No record said which fields crossed the boundary, and a personal field could travel to any reader."
options:
  - name: "A read-model record each consumer owns, built from published integration events"
    pros: "A module reads its own copy of what it needs. Each field names the published field it comes from. A personal field names the event that erases it. The owner keeps no reader written for one caller."
    cons: "A consumer writes and runs projections. A read model lags the owner by its declared freshness. A new read model needs the published events kept for its rebuild."
  - name: "Keep read ports in the owner's Contracts"
    pros: "A reader always sees the owner's current value, and nothing is copied."
    cons: "Readers grow one method per caller, every reading module couples to the owner's storage and uptime, and no record states which fields cross the boundary."
  - name: "Share the owner's tables through database views"
    pros: "A module needs no events and no projections."
    cons: "The owner's schema becomes another module's contract, which the module boundary exists to prevent."
choice: "A read-model record each consumer owns, built from published integration events"
consequences: "A Behavior record kind `read-model` lives at `behavior/modules/<module>/read-models/<name>/` with the identifier `read-model/<module>.<name>`. It names the other module's aggregate in `keyedBy`, each field's source as `integration-event/<name>#<field>`, the events that remove a row in `removedBy`, and its `freshness`. A personal or sensitive field names its `erasedBy` event. A use case names the read model in `reads`. `model check` reports `reference-unknown`, `read-model-erasure-missing`, `read-model-unused`, and `read-model-key-invalid`. Code sits in the `Application/ReadModels/` folder, one folder per read model with its projections and its reader. A screen that only shows another module's data calls each owner's own query. A command whose decision needs another module's current value asks one question through a decision port. Repositories, outside-system ports, and rule calculators stay ports. With the outbox extension, an integration event a read model names is kept for as long as a read model may rebuild from it."
reopenedWhen: "A consumer shows a read model whose freshness no decision can accept and no decision port can answer. Or a consumer shows a rebuild that cannot replay the kept events."
basedOn:
  - research/cross-module-coupling-practice
