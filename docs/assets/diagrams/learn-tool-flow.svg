<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="learn-tool-flow-title learn-tool-flow-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="learn-tool-flow-title">Where each tool runs in one change</title>
  <desc id="learn-tool-flow-desc">One change runs seven steps in order: litespec init writes the project file once, you write the records, litespec consumer validates the project file and pages, you build the code while the analyzers flag slips, litespec model build and check computes the links and then the findings, the CI gates run for the changed areas, and litespec book reads the project as a site.</desc>
  <defs>
    <marker id="learn-tool-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#learn-tool-flow-arrow)">
    <path d="M360 70 V 88" />
    <path d="M360 140 V 158" />
    <path d="M360 210 V 228" />
    <path d="M360 280 V 298" />
    <path d="M360 350 V 368" />
    <path d="M360 420 V 438" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="180" y="20" width="360" height="50" rx="8" />
    <rect x="180" y="90" width="360" height="50" rx="8" />
    <rect x="180" y="160" width="360" height="50" rx="8" />
    <rect x="180" y="230" width="360" height="50" rx="8" />
    <rect x="180" y="370" width="360" height="50" rx="8" />
    <rect x="180" y="440" width="360" height="50" rx="8" />
  </g>
  <rect x="180" y="300" width="360" height="50" rx="8" style="fill: var(--accent-subtle, #fffaf0); stroke: var(--accent, #f8c258)" stroke-width="1.5" />

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="360" y="42">litespec init</text>
    <text x="360" y="112">Write the records</text>
    <text x="360" y="182">litespec consumer</text>
    <text x="360" y="252">Build the code</text>
    <text x="360" y="322">litespec model build and check</text>
    <text x="360" y="392">CI gates</text>
    <text x="360" y="462">litespec book</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="middle">
    <text x="360" y="60">write litespec.project.json once</text>
    <text x="360" y="130">start from templates/consumer/</text>
    <text x="360" y="200">validate the project file and pages</text>
    <text x="360" y="270">analyzers flag slips as you work</text>
    <text x="360" y="340">computed links, then findings</text>
    <text x="360" y="410">the gates for the changed areas</text>
    <text x="360" y="480">read the project as a site</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12">
    <text x="556" y="50">CLI</text>
    <text x="556" y="120">you write</text>
    <text x="556" y="190">CLI</text>
    <text x="556" y="260">analyzers</text>
    <text x="556" y="330">CLI</text>
    <text x="556" y="400">CI</text>
    <text x="556" y="470">CLI</text>
  </g>
  <text x="360" y="520" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow is the next step of one change; the note names the tool that runs it.</text>
</svg>
