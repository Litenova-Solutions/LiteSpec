<svg xmlns="http://www.w3.org/2000/svg" width="720" height="176" viewBox="0 0 720 176" role="img" aria-labelledby="core-record-status-title core-record-status-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="core-record-status-title">Record statuses and what each allows</title>
  <desc id="core-record-status-desc">Three statuses in order: draft, approved, retired. A draft awaits its decider and names its decider and decide-by date. Approved holds; a decision is replaced, never edited. Retired means a replacement holds and the old record stands beside the new one. An arrow points from each status to the status that follows it.</desc>
  <defs>
    <marker id="core-record-status-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#core-record-status-arrow)">
    <path d="M222 72 H 252" />
    <path d="M462 72 H 492" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="20" y="20" width="200" height="104" rx="8" />
    <rect x="260" y="20" width="200" height="104" rx="8" />
    <rect x="500" y="20" width="200" height="104" rx="8" />
  </g>

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="120" y="48">Draft</text>
    <text x="360" y="48">Approved</text>
    <text x="600" y="48">Retired</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="middle">
    <text x="120" y="70">awaits its decider;</text>
    <text x="120" y="88">names decider and</text>
    <text x="120" y="106">decide-by date</text>
    <text x="360" y="70">holds;</text>
    <text x="360" y="88">a decision is replaced,</text>
    <text x="360" y="106">never edited</text>
    <text x="600" y="70">a replacement holds;</text>
    <text x="600" y="88">kept beside the</text>
    <text x="600" y="106">new record</text>
  </g>
  <text x="360" y="154" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow points from a status to the status that follows it.</text>
</svg>
