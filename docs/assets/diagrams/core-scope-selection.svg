<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-labelledby="core-scope-selection-title core-scope-selection-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="core-scope-selection-title">Project choices and what each decides</title>
  <desc id="core-scope-selection-desc">Three project choices and what each decides. Size, small or large, decides the record types and the test projects; large adds goals, problems, features, journeys, and scenarios. Shape, server or client-only, decides whether the project names a backend stack. Stacks, one backend stack and one stack per frontend, decide the technology pages and the checks that apply. An arrow points from each choice to what it decides.</desc>
  <defs>
    <marker id="core-scope-selection-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#core-scope-selection-arrow)">
    <path d="M242 56 H 312" />
    <path d="M242 148 H 312" />
    <path d="M242 240 H 312" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="20" y="20" width="220" height="72" rx="8" />
    <rect x="20" y="112" width="220" height="72" rx="8" />
    <rect x="20" y="204" width="220" height="72" rx="8" />
    <rect x="320" y="20" width="380" height="72" rx="8" />
    <rect x="320" y="112" width="380" height="72" rx="8" />
    <rect x="320" y="204" width="380" height="72" rx="8" />
  </g>

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600">
    <text x="36" y="46">Size</text>
    <text x="36" y="138">Shape</text>
    <text x="36" y="230">Stacks</text>
    <text x="336" y="46">Record types, test projects</text>
    <text x="336" y="138">Backend stack or none</text>
    <text x="336" y="230">Technology pages and checks</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12">
    <text x="36" y="68">small or large</text>
    <text x="36" y="160">server or client-only</text>
    <text x="36" y="252">one backend, one per frontend</text>
    <text x="336" y="68">large adds goals, problems, features, journeys, scenarios</text>
    <text x="336" y="160">client-only names no backend stack</text>
    <text x="336" y="252">one backend stack, one stack per frontend</text>
  </g>
  <text x="360" y="306" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow points from a project choice to what the choice decides.</text>
</svg>
