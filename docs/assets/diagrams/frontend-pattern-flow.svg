<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-labelledby="frontend-pattern-flow-title frontend-pattern-flow-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="frontend-pattern-flow-title">From a LiteSpec pattern to a catalog entry to the built screen</title>
  <desc id="frontend-pattern-flow-desc">A LiteSpec pattern with three options and a named default; a catalog entry that cites the pattern by ID and records the chosen option with source owner; and the built expense detail screen. Arrows run from the pattern to the entry to the screen.</desc>
  <defs>
    <marker id="frontend-pattern-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <!-- Each arrow runs from a decision to what it produces. -->
  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#frontend-pattern-flow-arrow)">
    <path d="M360 100 V 132" />
    <path d="M360 232 V 264" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="120" y="20" width="480" height="80" rx="8" />
    <rect x="120" y="136" width="480" height="96" rx="8" />
  </g>
  <rect x="120" y="268" width="480" height="64" rx="8" style="fill: var(--accent-subtle, #fffaf0); stroke: var(--accent, #f8c258)" stroke-width="1.5" />

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="360" y="46">LiteSpec pattern: Record header</text>
    <text x="360" y="162">Catalog entry: expense-header</text>
    <text x="360" y="294">Built screen</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="middle">
    <text x="360" y="68">3 options; default title-state-breadcrumb-one-primary-action</text>
    <text x="360" y="86">litespec/frontend/patterns/record-detail#record-header</text>
    <text x="360" y="184">Expenses cites the pattern ID</text>
    <text x="360" y="202">decision: the default option, source owner</text>
    <text x="360" y="220">compact: the header stacks under the title</text>
    <text x="360" y="314">expense detail in the web app</text>
  </g>
  <text x="360" y="368" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow runs from a decision to what it produces.</text>
</svg>
