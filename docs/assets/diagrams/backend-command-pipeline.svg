<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="backend-command-pipeline-title backend-command-pipeline-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="backend-command-pipeline-title">The command pipeline from HTTP request to the single commit</title>
  <desc id="backend-command-pipeline-desc">An HTTP request reaches the endpoint, which maps it to a command and dispatches it through the command mediator. Validation checks structural input, then the authorization guard checks the permission and the target. The handler loads aggregates through repositories, calls domain behavior, and stages changes. The repository stages the aggregate, and exactly one commit post-handler commits the session once.</desc>
  <defs>
    <marker id="backend-command-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <!-- Each arrow points from one stage to the next stage in the pipeline. -->
  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#backend-command-pipeline-arrow)">
    <path d="M360 60 V 86" />
    <path d="M360 130 V 156" />
    <path d="M360 200 V 226" />
    <path d="M360 270 V 296" />
    <path d="M360 340 V 366" />
    <path d="M360 410 V 436" />
    <path d="M360 480 V 506" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="210" y="20" width="300" height="40" rx="8" />
    <rect x="210" y="90" width="300" height="40" rx="8" />
    <rect x="210" y="160" width="300" height="40" rx="8" />
    <rect x="210" y="230" width="300" height="40" rx="8" />
    <rect x="210" y="300" width="300" height="40" rx="8" />
    <rect x="210" y="370" width="300" height="40" rx="8" />
    <rect x="210" y="440" width="300" height="40" rx="8" />
  </g>
  <rect x="210" y="510" width="300" height="40" rx="8" style="fill: var(--accent-subtle, #fffaf0); stroke: var(--accent, #f8c258)" stroke-width="1.5" />

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="360" y="45">HTTP request</text>
    <text x="360" y="115">Endpoint</text>
    <text x="360" y="185">Command mediator</text>
    <text x="360" y="255">Validation</text>
    <text x="360" y="325">Authorization guard</text>
    <text x="360" y="395">Handler</text>
    <text x="360" y="465">Repository</text>
    <text x="360" y="535">Commit post-handler</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12">
    <text x="525" y="45">submit request</text>
    <text x="525" y="115">maps to command</text>
    <text x="525" y="185">dispatches message</text>
    <text x="525" y="255">structural checks</text>
    <text x="525" y="325">permission and target</text>
    <text x="525" y="395">loads, calls, stages</text>
    <text x="525" y="465">stages aggregate</text>
    <text x="525" y="535">one commit</text>
  </g>
  <text x="360" y="580" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow points from one stage to the next stage in the command pipeline.</text>
</svg>
