<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="dotnet-closed-set-title dotnet-closed-set-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="dotnet-closed-set-title">One closed set in Domain and at three other layers</title>
  <desc id="dotnet-closed-set-desc">The Domain hierarchy MerchantRole with sealed cases exposing Code and FromCode, and the same set at three layers: a mirrored union in Application, a string enum in Transport for a label-only set, and one string discriminator per case in Persistence.</desc>
  <defs>
    <marker id="dotnet-closed-set-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <!-- Each arrow shows the same closed set at another layer. -->
  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#dotnet-closed-set-arrow)">
    <path d="M130 134 V 172" />
    <path d="M360 134 V 172" />
    <path d="M590 134 V 172" />
  </g>

  <rect x="120" y="20" width="480" height="110" rx="8" style="fill: var(--accent-subtle, #fffaf0); stroke: var(--accent, #f8c258)" stroke-width="1.5" />
  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="20" y="176" width="220" height="80" rx="8" />
    <rect x="250" y="176" width="220" height="80" rx="8" />
    <rect x="480" y="176" width="220" height="80" rx="8" />
  </g>

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="360" y="46">Domain: MerchantRole (abstract record)</text>
    <text x="130" y="202">Application</text>
    <text x="360" y="202">Transport</text>
    <text x="590" y="202">Persistence</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="middle">
    <text x="360" y="70">MerchantOwnerRole, MerchantWarehouseStaffRole (sealed cases)</text>
    <text x="360" y="90">each case exposes Code</text>
    <text x="360" y="110">FromCode maps a label to its case</text>
    <text x="130" y="224">mirrored union shape</text>
    <text x="130" y="242">of the same set</text>
    <text x="360" y="224">string enum,</text>
    <text x="360" y="242">label-only sets</text>
    <text x="590" y="224">one stable string</text>
    <text x="590" y="242">discriminator per case</text>
  </g>
  <text x="360" y="284" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow shows the same closed set at another layer.</text>
</svg>
