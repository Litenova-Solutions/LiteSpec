<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img" aria-labelledby="learn-agent-context-title learn-agent-context-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="learn-agent-context-title">The order an agent loads context, and where it stops</title>
  <desc id="learn-agent-context-desc">The agent reads eight steps in order: the project agents file and project file, the selection index, the records the task touches, the full standards pages, the selected extensions, the neighboring code, then the change itself, and finally the checks and the report. When blocked by a conflict, a draft, or a product call, it stops for a person instead, which can happen at any step.</desc>
  <defs>
    <marker id="learn-agent-context-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#learn-agent-context-arrow)">
    <path d="M210 70 V 90" />
    <path d="M210 142 V 162" />
    <path d="M210 214 V 234" />
    <path d="M210 286 V 306" />
    <path d="M210 358 V 378" />
    <path d="M210 430 V 450" />
    <path d="M210 502 V 522" />
    <path d="M382 405 C 400 420, 405 450, 418 468" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="40" y="20" width="340" height="50" rx="8" />
    <rect x="40" y="92" width="340" height="50" rx="8" />
    <rect x="40" y="164" width="340" height="50" rx="8" />
    <rect x="40" y="236" width="340" height="50" rx="8" />
    <rect x="40" y="308" width="340" height="50" rx="8" />
    <rect x="40" y="380" width="340" height="50" rx="8" />
    <rect x="40" y="452" width="340" height="50" rx="8" />
    <rect x="40" y="524" width="340" height="50" rx="8" />
  </g>
  <rect x="420" y="452" width="260" height="50" rx="8" style="fill: var(--accent-subtle, #fffaf0); stroke: var(--accent, #f8c258)" stroke-width="1.5" />

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="210" y="42">1. Project agents file and project file</text>
    <text x="210" y="114">2. Selection index</text>
    <text x="210" y="186">3. Records the task touches</text>
    <text x="210" y="258">4. Full standards pages</text>
    <text x="210" y="330">5. Selected extensions</text>
    <text x="210" y="402">6. Neighboring code</text>
    <text x="210" y="474">7. Change records, code, tests</text>
    <text x="210" y="546">8. Run the checks and report</text>
    <text x="550" y="474">Stop for a person</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="middle">
    <text x="210" y="60">AGENTS.md and litespec.project.json</text>
    <text x="210" y="132">only the pages the task touches</text>
    <text x="210" y="204">litespec model query &lt;id&gt;</text>
    <text x="210" y="276">the pages the records cite</text>
    <text x="210" y="348">only inside their boundary</text>
    <text x="210" y="420">follow a complying pattern</text>
    <text x="210" y="492">what belongs together, in one change</text>
    <text x="210" y="564">each command and its result</text>
    <text x="550" y="492">conflict, draft, product call</text>
    <text x="402" y="448">blocked</text>
    <text x="550" y="524">The agent can stop at any step.</text>
  </g>
  <text x="360" y="608" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow is the next step; the branch says when the agent stops for a person instead.</text>
</svg>
