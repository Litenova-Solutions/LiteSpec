<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-labelledby="learn-record-graph-title learn-record-graph-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="learn-record-graph-title">Record types and their written and computed links</title>
  <desc id="learn-record-graph-desc">The use case sits in the center. Rules govern it, journeys step through it, and it names results, cases, events, and entry points. Rules and journeys fulfill requirements, and each case names its result. The builder computes three more links: a handler implements the use case, a screen calls it, and a test proves its result.</desc>
  <defs>
    <marker id="learn-record-graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#learn-record-graph-arrow)">
    <path d="M250 118 V 78" />
    <path d="M470 118 V 78" />
    <path d="M280 178 V 218" />
    <path d="M415 178 V 218" />
    <path d="M240 278 V 298 H 80 V 278" />
    <path d="M502 248 H 558" />
    <path d="M410 278 V 318" />
    <path d="M538 348 H 482" />
    <path d="M250 418 V 278" />
    <path d="M330 418 V 278" />
    <path d="M610 418 V 378" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="200" y="20" width="320" height="56" rx="8" />
    <rect x="150" y="120" width="200" height="56" rx="8" />
    <rect x="370" y="120" width="200" height="56" rx="8" />
    <rect x="15" y="220" width="130" height="56" rx="8" />
    <rect x="560" y="220" width="130" height="56" rx="8" />
    <rect x="340" y="320" width="140" height="56" rx="8" />
    <rect x="540" y="320" width="140" height="56" rx="8" />
    <rect x="130" y="420" width="160" height="56" rx="8" />
    <rect x="300" y="420" width="160" height="56" rx="8" />
    <rect x="520" y="420" width="180" height="56" rx="8" />
  </g>
  <rect x="220" y="220" width="280" height="56" rx="8" style="fill: var(--accent-subtle, #fffaf0); stroke: var(--accent, #f8c258)" stroke-width="1.5" />

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="360" y="44">requirement</text>
    <text x="250" y="144">rule</text>
    <text x="470" y="144">journey</text>
    <text x="80" y="244">entry point</text>
    <text x="360" y="244">use case</text>
    <text x="625" y="244">event</text>
    <text x="410" y="344">result</text>
    <text x="610" y="344">case</text>
    <text x="210" y="444">handler</text>
    <text x="380" y="444">screen</text>
    <text x="610" y="444">test</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="middle">
    <text x="360" y="62">why</text>
    <text x="250" y="162">what holds</text>
    <text x="470" y="162">ordered steps</text>
    <text x="80" y="262">how readers reach</text>
    <text x="360" y="262">one operation</text>
    <text x="625" y="262">what happened</text>
    <text x="410" y="362">how it ends</text>
    <text x="610" y="362">a proving example</text>
    <text x="210" y="462">application code</text>
    <text x="380" y="462">frontend route</text>
    <text x="610" y="462">acceptance test</text>
    <text x="160" y="292">reachedThrough</text>
    <text x="531" y="242">raises</text>
    <text x="510" y="342">result</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12">
    <text x="258" y="100">fulfills</text>
    <text x="288" y="200">governs</text>
    <text x="423" y="200">steps</text>
    <text x="418" y="300">results</text>
    <text x="618" y="400">proves</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="end">
    <text x="462" y="100">fulfills</text>
    <text x="242" y="350">implements</text>
    <text x="322" y="392">calls</text>
  </g>
  <text x="360" y="512" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow points from the record that holds a link to the record it names; each label names the link.</text>
