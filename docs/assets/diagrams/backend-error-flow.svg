<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="backend-error-flow-title backend-error-flow-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="backend-error-flow-title">How a failure becomes an HTTP error response</title>
  <desc id="backend-error-flow-desc">A domain exception or a validation failure reaches the global handler, which no endpoint preempts. The handler selects the HTTP status and returns a Problem Details body carrying the stable code, the trace identifier, and one entry per field failure.</desc>
  <defs>
    <marker id="backend-error-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <!-- Each arrow points from a failure to the stage that handles it. -->
  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#backend-error-flow-arrow)">
    <path d="M190 72 C 190 105, 310 105, 310 126" />
    <path d="M530 72 C 530 105, 410 105, 410 126" />
    <path d="M360 174 V 224" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="40" y="20" width="300" height="52" rx="8" />
    <rect x="380" y="20" width="300" height="52" rx="8" />
    <rect x="180" y="232" width="360" height="44" rx="8" />
  </g>
  <rect x="210" y="130" width="300" height="44" rx="8" style="fill: var(--accent-subtle, #fffaf0); stroke: var(--accent, #f8c258)" stroke-width="1.5" />

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="190" y="43">Domain exception</text>
    <text x="530" y="43">Validation failure</text>
    <text x="360" y="157">Global handler</text>
    <text x="360" y="259">HTTP status and Problem Details</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="middle">
    <text x="190" y="59">business rule rejected</text>
    <text x="530" y="59">structural input rejected</text>
    <text x="360" y="298">The body carries code, traceId, and one entry per field failure.</text>
  </g>
  <text x="360" y="330" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow points from a failure to the stage that handles it.</text>
</svg>
