<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" role="img" aria-labelledby="core-product-order-title core-product-order-desc" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <title id="core-product-order-title">The order of work from intent to code</title>
  <desc id="core-product-order-desc">Four steps in order. Product brief and topic pages state what the business commits. Research, decision, and requirement hold the evidence, the choice, and the commitment. Specification records carry the rules, use cases, and journeys. Code and tests are what the product does today. An arrow points from each earlier step to the next step.</desc>
  <defs>
    <marker id="core-product-order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted-fg, #77706a)" />
    </marker>
  </defs>

  <g style="stroke: var(--muted-fg, #77706a); fill: none" stroke-width="1.25" marker-end="url(#core-product-order-arrow)">
    <path d="M360 78 V 96" />
    <path d="M360 162 V 180" />
    <path d="M360 246 V 264" />
  </g>

  <g style="fill: var(--bg, #ffffff); stroke: var(--border, #e5e0d9)" stroke-width="1">
    <rect x="180" y="20" width="360" height="56" rx="8" />
    <rect x="180" y="104" width="360" height="56" rx="8" />
    <rect x="180" y="188" width="360" height="56" rx="8" />
  </g>
  <rect x="180" y="272" width="360" height="56" rx="8" style="fill: var(--accent-subtle, #fffaf0); stroke: var(--accent, #f8c258)" stroke-width="1.5" />

  <g style="fill: var(--fg, #19151c)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="360" y="44">Product brief and topic pages</text>
    <text x="360" y="128">Research, decision, requirement</text>
    <text x="360" y="212">Specification records</text>
    <text x="360" y="296">Code and tests</text>
  </g>
  <g style="fill: var(--muted-fg, #77706a)" font-size="12" text-anchor="middle">
    <text x="360" y="63">what the business commits</text>
    <text x="360" y="147">the evidence, the choice, the commitment</text>
    <text x="360" y="231">rules, use cases, and journeys</text>
    <text x="360" y="315">what the product does today</text>
  </g>
  <text x="360" y="358" text-anchor="middle" font-size="12" style="fill: var(--muted-fg, #77706a)">An arrow points from an earlier step to the next step.</text>
</svg>
