
</div>
<div id="index" role="dialog" aria-label="Slide index"></div>
<div id="hud"><button id="prev" aria-label="Previous slide">&larr;</button><button id="count" aria-label="Open slide index"></button><button id="next" aria-label="Next slide">&rarr;</button><button id="notesBtn" aria-label="Toggle speaker notes">Notes</button><button id="themeBtn" aria-label="Toggle dark mode">Theme</button></div>
<script>
(function () {
  const slides = Array.from(document.querySelectorAll('.slide'));
  const count = document.getElementById('count');
  const progress = document.getElementById('progress');
  const index = document.getElementById('index');
  let i = 0;
  try { const t = localStorage.getItem('litespec-deck-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try { const h = parseInt(location.hash.slice(1), 10); if (h >= 1 && h <= slides.length) i = h - 1; } catch (e) {}
  let section = '';
  slides.forEach((s, n) => {
    if (s.dataset.section) section = s.dataset.section;
    s.dataset.sec = section;
    if (n > 0) {
      const p = document.createElement('div'); p.className = 'pg'; p.textContent = (n + 1) + ' / ' + slides.length; s.appendChild(p);
      if (section && !s.classList.contains('section-title')) { const q = document.createElement('div'); q.className = 'secname'; q.textContent = section; s.appendChild(q); }
    }
    const b = document.createElement('span'); b.title = (n + 1) + '. ' + titleOf(s); b.onclick = () => show(n); progress.appendChild(b);
  });
  function titleOf(s) { const h = s.querySelector('h1, h2'); return h ? h.textContent.trim() : 'Slide'; }
  function buildIndex() {
    let html = '<p class="help">Arrow keys or space to move, <b>G</b> slide index, <b>N</b> speaker notes, <b>T</b> theme, <b>F</b> full screen, <b>Esc</b> close.</p>';
    let cur = null;
    slides.forEach((s, n) => {
      if (s.dataset.sec !== cur) { if (cur !== null) html += '</div>'; cur = s.dataset.sec; html += '<h4>' + (cur || 'Opening') + '</h4><div class="grid">'; }
      html += '<button data-n="' + n + '"' + (n === i ? ' class="cur"' : '') + '><b>' + (n + 1) + '</b><span>' + titleOf(s) + '</span></button>';
    });
    html += '</div>';
    index.innerHTML = html;
    index.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => { show(+b.dataset.n); index.classList.remove('open'); });
  }
  function fit() { const s = Math.min(window.innerWidth / 1320, window.innerHeight / 760); slides.forEach(el => { el.style.transform = 'scale(' + s + ')'; }); }
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((el, k) => el.classList.toggle('active', k === i));
    Array.from(progress.children).forEach((b, k) => { b.className = k === i ? 'cur' : (k < i ? 'done' : ''); });
    count.textContent = (i + 1) + ' / ' + slides.length;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
  }
  const toggleIndex = () => { if (!index.classList.contains('open')) buildIndex(); index.classList.toggle('open'); };
  const toggleTheme = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('litespec-deck-theme', d.dataset.theme); } catch (e) {} };
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') { index.classList.remove('open'); return; }
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') show(0); else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-notes');
    else if (e.key === 'g' || e.key === 'G') toggleIndex();
    else if (e.key === 't' || e.key === 'T') toggleTheme();
    else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  });
  document.getElementById('prev').onclick = () => show(i - 1);
  document.getElementById('next').onclick = () => show(i + 1);
  count.onclick = toggleIndex;
  document.getElementById('notesBtn').onclick = () => document.body.classList.toggle('show-notes');
  document.getElementById('themeBtn').onclick = toggleTheme;
  window.addEventListener('resize', fit); fit(); show(i);
})();
</script>
</body>
</html>
