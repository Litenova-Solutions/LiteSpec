<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --page: #eceef1; --background: #ffffff; --foreground: #0b0d12;
  --card: #ffffff; --muted: #f4f5f7; --muted-2: #fafafb; --muted-foreground: #667085; --border: #e4e7ec; --border-strong: #cfd4dc;
  --intent: #6d28d9; --intent-bg: #f5f3ff; --intent-border: #ddd6fe;
  --behavior: #0f766e; --behavior-bg: #f0fdfa; --behavior-border: #99f6e4;
  --impl: #b45309; --impl-bg: #fffbeb; --impl-border: #fde68a;
  --proof: #15803d; --proof-bg: #f0fdf4; --proof-border: #bbf7d0;
  --gov: #475467; --gov-bg: #f2f4f7; --gov-border: #d0d5dd;
  --red: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
  --amber: #b45309; --amber-bg: #fffbeb; --amber-border: #fde68a;
  --blue: #2563eb; --blue-bg: #eff6ff; --blue-border: #bfdbfe;
  --green: #15803d; --green-bg: #f0fdf4; --green-border: #bbf7d0;
  --k: #7c3aed; --s: #0f766e; --n: #b45309;
  --radius: 12px; --shadow: 0 1px 2px rgba(16,24,40,.05);
  --accent: var(--intent); --accent-bg: var(--intent-bg); --accent-border: var(--intent-border);
}
:root[data-theme="dark"] {
  --page: #05060a; --background: #0e1117; --foreground: #eef0f4;
  --card: #141821; --muted: #1b202b; --muted-2: #161a23; --muted-foreground: #98a2b3; --border: #262c38; --border-strong: #353d4c;
  --intent: #a78bfa; --intent-bg: #1c1530; --intent-border: #3b2b66;
  --behavior: #2dd4bf; --behavior-bg: #0d2422; --behavior-border: #155e56;
  --impl: #fbbf24; --impl-bg: #261d0b; --impl-border: #5c4512;
  --proof: #4ade80; --proof-bg: #0c2416; --proof-border: #17572f;
  --gov: #b3bdcc; --gov-bg: #1b202b; --gov-border: #353d4c;
  --red: #f87171; --red-bg: #2a1214; --red-border: #5c2226;
  --amber: #fbbf24; --amber-bg: #261d0b; --amber-border: #5c4512;
  --blue: #60a5fa; --blue-bg: #0f1d33; --blue-border: #1e3a66;
  --green: #4ade80; --green-bg: #0c2416; --green-border: #17572f;
  --k: #c4b5fd; --s: #5eead4; --n: #fcd34d;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--foreground);
  font-family: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
#deck { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
.slide { position: absolute; width: 1280px; height: 720px; background: var(--background);
  border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.10);
  padding: 40px 56px 44px; display: none; flex-direction: column; transform-origin: center center; overflow: hidden; }
.slide.active { display: flex; }
.slide[data-layer="intent"] { --accent: var(--intent); --accent-bg: var(--intent-bg); --accent-border: var(--intent-border); }
.slide[data-layer="behavior"] { --accent: var(--behavior); --accent-bg: var(--behavior-bg); --accent-border: var(--behavior-border); }
.slide[data-layer="impl"] { --accent: var(--impl); --accent-bg: var(--impl-bg); --accent-border: var(--impl-border); }
.slide[data-layer="proof"] { --accent: var(--proof); --accent-bg: var(--proof-bg); --accent-border: var(--proof-border); }
.slide[data-layer="gov"] { --accent: var(--gov); --accent-bg: var(--gov-bg); --accent-border: var(--gov-border); }
.slide[data-layer="review"] { --accent: var(--red); --accent-bg: var(--red-bg); --accent-border: var(--red-border); }
.slide::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent); }
.eyebrow { font-size: 12.5px; font-weight: 600; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--accent); }
h1 { font-size: 64px; line-height: 1.04; font-weight: 650; letter-spacing: -0.035em; margin: 0; }
h2 { font-size: 32px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 6px; max-width: 1120px; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.005em; }
.sub { font-size: 16.5px; line-height: 1.5; color: var(--muted-foreground); margin: 4px 0 0; max-width: 1100px; }
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; margin-top: 18px; gap: 12px; }
.content.top { justify-content: flex-start; }
.row { display: grid; gap: 12px; }
.r2 { grid-template-columns: repeat(2, 1fr); } .r3 { grid-template-columns: repeat(3, 1fr); } .r4 { grid-template-columns: repeat(4, 1fr); } .r5 { grid-template-columns: repeat(5, 1fr); }
.r12 { grid-template-columns: 1fr 2fr; } .r21 { grid-template-columns: 2fr 1fr; } .r32 { grid-template-columns: 3fr 2fr; } .r23 { grid-template-columns: 2fr 3fr; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
.card .t { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.card .d { font-size: 13.5px; line-height: 1.45; color: var(--muted-foreground); margin: 0; }
.card.acc { background: var(--accent-bg); border-color: var(--accent-border); }
.card.intent { background: var(--intent-bg); border-color: var(--intent-border); }
.card.behavior { background: var(--behavior-bg); border-color: var(--behavior-border); }
.card.impl { background: var(--impl-bg); border-color: var(--impl-border); }
.card.proof { background: var(--proof-bg); border-color: var(--proof-border); }
.card.gov { background: var(--gov-bg); border-color: var(--gov-border); }
.card.red { background: var(--red-bg); border-color: var(--red-border); }
.card.amber { background: var(--amber-bg); border-color: var(--amber-border); }
.card.blue { background: var(--blue-bg); border-color: var(--blue-border); }
.card ul, .list { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; color: var(--muted-foreground); }
.card ul li b, .list li b { color: var(--foreground); font-weight: 600; }
.stat .n { font-size: 44px; font-weight: 650; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
.stat .l { font-size: 13.5px; color: var(--muted-foreground); margin-top: 8px; line-height: 1.4; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--muted); color: var(--foreground); white-space: nowrap; }
.badge.red { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
.badge.amber { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
.badge.green { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
.badge.blue { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-border); }
.badge.intent { background: var(--intent-bg); color: var(--intent); border-color: var(--intent-border); }
.badge.behavior { background: var(--behavior-bg); color: var(--behavior); border-color: var(--behavior-border); }
.badge.impl { background: var(--impl-bg); color: var(--impl); border-color: var(--impl-border); }
.badge.proof { background: var(--proof-bg); color: var(--proof); border-color: var(--proof-border); }
.badge.gov { background: var(--gov-bg); color: var(--gov); border-color: var(--gov-border); }
.badge.outline { background: transparent; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--card); }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted-foreground); background: var(--muted); padding: 8px 11px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 7px 11px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.38; }
tr:last-child td { border-bottom: 0; }
td.m { color: var(--muted-foreground); } td.c, th.c { text-align: center; } td.nw { white-space: nowrap; }
table.tight td { padding: 5px 10px; } table.tight { font-size: 12.8px; }
code, .mono { font-family: "Geist Mono", Consolas, monospace; font-size: .86em; }
code { background: var(--muted); border: 1px solid var(--border); padding: 0 5px; border-radius: 5px; white-space: nowrap; }
pre.fm { margin: 0; font-family: "Geist Mono", Consolas, monospace; font-size: 12px; line-height: 1.5; background: var(--muted-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; overflow: hidden; color: var(--foreground); white-space: pre; }
pre.fm .k { color: var(--k); } pre.fm .s { color: var(--s); } pre.fm .c { color: var(--muted-foreground); font-style: italic; } pre.fm .n { color: var(--n); }
pre.fm .hl { background: var(--accent-bg); outline: 1px solid var(--accent-border); border-radius: 3px; }
pre.book { margin: 0; font-family: "Geist", system-ui, sans-serif; font-size: 13px; line-height: 1.5; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; white-space: pre-wrap; color: var(--foreground); }
.small { font-size: 12.8px; color: var(--muted-foreground); line-height: 1.45; }
.foot { margin-top: auto; padding-top: 10px; font-size: 12.5px; color: var(--muted-foreground); }
.title { justify-content: center; padding-left: 88px; }
.title .meta { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.title .lede { font-size: 22px; color: var(--muted-foreground); margin-top: 14px; max-width: 900px; line-height: 1.45; }
.section-title { justify-content: center; padding-left: 88px; background: linear-gradient(135deg, var(--background) 55%, var(--accent-bg)); }
.section-title .num { font-family: "Geist Mono", monospace; font-size: 15px; color: var(--accent); font-weight: 600; margin-bottom: 14px; }
.section-title h1 { font-size: 56px; }
svg text { font-family: "Geist", "Inter", system-ui, sans-serif; }
svg .mono { font-family: "Geist Mono", Consolas, monospace; }
.pg { position: absolute; right: 56px; bottom: 16px; font-size: 11.5px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.secname { position: absolute; left: 56px; bottom: 16px; font-size: 11.5px; color: var(--muted-foreground); }
.notes { display: none; }
body.show-notes .slide.active .notes { display: block; position: absolute; left: 56px; right: 56px; bottom: 40px; background: var(--foreground); color: var(--background); border-radius: 10px; padding: 12px 16px; font-size: 14px; line-height: 1.5; z-index: 3; }
/* chips and flow */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; border: 1px solid var(--accent-border); background: var(--accent-bg); color: var(--accent); white-space: nowrap; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; line-height: 1.4; }
.kv dt { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--accent); padding-top: 1px; }
.kv dd { margin: 0; color: var(--muted-foreground); }
.rule { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.rule .q { font-size: 13.5px; color: var(--foreground); line-height: 1.45; }
.rule .id { font-family: "Geist Mono", monospace; font-size: 11px; color: var(--muted-foreground); margin-top: 3px; }
.how { display: inline-flex; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.how.chk { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.how.rev { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
/* explainer slides: what, why, when, when not, beside the example */
.ex { display: grid; grid-template-columns: 1fr 1.08fr; gap: 16px; min-height: 0; }
.explain { margin: 0; }
.explain dt { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-top: 10px; }
.explain dt:first-child { margin-top: 0; }
.explain dd { margin: 3px 0 0; font-size: 14px; line-height: 1.48; color: var(--foreground); }
.explain dd .m { color: var(--muted-foreground); }
.story { border-left: 3px solid var(--accent); background: var(--accent-bg); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; line-height: 1.5; }
.ran { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted-foreground); line-height: 1.45; }
.ran::before { content: "RAN"; font: 600 10.5px "Geist Mono", monospace; color: var(--green); border: 1px solid var(--green-border); background: var(--green-bg); border-radius: 4px; padding: 1px 5px; flex: none; margin-top: 1px; }
pre.out { margin: 0; font-family: "Geist Mono", Consolas, monospace; font-size: 11.2px; line-height: 1.5; background: #0b0d12; color: #d6dae2; border-radius: var(--radius); padding: 12px 14px; white-space: pre; overflow: hidden; }
pre.out .g { color: #4ade80; } pre.out .r { color: #f87171; } pre.out .y { color: #fbbf24; } pre.out .d { color: #8b93a3; }
/* provision grids */
.pgrid { columns: 4; column-gap: 10px; }
.pgrp { break-inside: avoid; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px 8px; margin-bottom: 10px; background: var(--card); }
.pgrp .t { font-size: 13px; font-weight: 600; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
.pgrp ul { list-style: none; margin: 0; padding: 0; }
.pgrp li { font-size: 11.3px; line-height: 1.28; padding: 1.5px 0 1.5px 13px; position: relative; color: var(--foreground); }
.pgrp li::before { content: ""; position: absolute; left: 0; top: 6px; width: 7px; height: 7px; border-radius: 99px; }
.pgrp li.ck::before { background: var(--green); } .pgrp li.rv::before { background: var(--amber); }
.pgrp .cd { display: block; font-family: "Geist Mono", monospace; font-size: 10px; color: var(--muted-foreground); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted-foreground); align-items: center; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 5px; }
/* findings */
.findings { display: flex; flex-direction: column; gap: 6px; }
.f { display: grid; grid-template-columns: 28px 1fr; gap: 0 10px; border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; background: var(--card); }
.f .no { font-family: "Geist Mono", monospace; font-size: 12px; font-weight: 600; color: var(--muted-foreground); padding-top: 2px; }
.f .hd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.f .hd .badge { height: 19px; font-size: 11px; padding: 0 6px; }
.f .ev { font-size: 11.8px; color: var(--muted-foreground); line-height: 1.38; margin-top: 2px; }
.f .fx { font-size: 11.8px; line-height: 1.38; margin-top: 2px; }
.f code { font-size: 10.5px; padding: 0 3px; }
.slide[data-layer="review"] h2 { font-size: 26px; }
.f .fx::before { content: "Fix: "; font-weight: 600; color: var(--green); }
.f.high { border-left: 4px solid var(--red); } .f.medium { border-left: 4px solid var(--amber); } .f.low { border-left: 4px solid var(--blue); }
/* hud */
#progress { position: fixed; left: 0; right: 0; top: 0; height: 4px; display: flex; gap: 2px; z-index: 6; }
#progress span { flex: 1; background: var(--border); cursor: pointer; }
#progress span.done { background: var(--foreground); opacity: .55; }
#progress span.cur { background: var(--foreground); }
#hud { position: fixed; right: 14px; bottom: 10px; display: flex; gap: 6px; z-index: 5; }
#hud button { font: 500 12.5px "Geist", system-ui, sans-serif; color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: 8px; height: 28px; padding: 0 10px; cursor: pointer; box-shadow: var(--shadow); }
#index { position: fixed; inset: 0; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(6px); z-index: 10; display: none; overflow: auto; padding: 40px 48px; }
#index.open { display: block; }
#index h4 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); }
#index .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
#index button { text-align: left; font: 500 13.5px "Geist", system-ui, sans-serif; color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; }
#index button b { font-family: "Geist Mono", monospace; font-weight: 500; color: var(--muted-foreground); font-size: 12px; min-width: 22px; }
#index button.cur { outline: 2px solid var(--foreground); }
#index .help { font-size: 13px; color: var(--muted-foreground); }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  html, body { background: #fff; height: auto; }
  #deck { position: static; display: block; }
  #hud, #progress, #index, .notes { display: none !important; }
  .slide { display: flex !important; position: relative; transform: none !important; box-shadow: none; border: 0; border-radius: 0; break-after: page; }
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="deck">
