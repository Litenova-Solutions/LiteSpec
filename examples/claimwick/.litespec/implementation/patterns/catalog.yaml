# yaml-language-server: $schema=https://litespec.dev/7.0.0/schemas/ui-pattern-catalog.schema.yaml
schemaVersion: 2
breakpoints:
  compact: 768
groups:
- id: page-frames
  title: Page frames
  kind: page-frame
- id: elements
  title: Elements
  kind: element
patterns:
- id: orders-list-page
  group: page-frames
  title: Orders list page
  question: 'How does a reader find one order among many?'
  options:
  - id: filter-table
    name: Filterable table
    rationale: Rows scan fast and filters narrow the set without leaving the page.
    cost: Needs a table composite with filter controls.
  - id: search-cards
    name: Searchable cards
    rationale: Cards show each order with room for status and totals.
    cost: Slow to scan past a few dozen orders.
  decision:
    option: filter-table
    source: recommended
  compact:
    breakpoint: compact
    behavior: Below 768 pixels the filters stack above the table and the table scrolls horizontally.
  extensions:
  - option: search-cards
    when: The list holds few orders and the reader compares them visually.
  implementations:
    svelte:
      status: adopted
      components:
      - packages/ui/src/floorplans/list-page.svelte
- id: table-sorting
  group: elements
  title: Table sorting
  question: 'How does a reader reorder the rows of a table?'
  options:
  - id: column-header-sort
    name: Sort control in each column header
    rationale: The control sits where the reader looks when choosing a column.
    cost: Each sortable header carries a button and a direction label.
  - id: toolbar-sort
    name: One sort control above the table
    rationale: One control keeps narrow tables readable.
    cost: The reader maps the control back to its column.
  decision:
    option: column-header-sort
    source: recommended
  compact:
    breakpoint: compact
    option: toolbar-sort
    behavior: Below 768 pixels headers lose their sort controls and one toolbar above the table sorts.
  implementations:
    svelte:
      status: adopted
      components:
      - packages/ui/src/components/data-table.svelte
- id: expense-list-page
  group: page-frames
  title: Expense List Page
  question: How does a reader find one expense among many?
  options:
  - id: search-and-a-state-filter-only
    name: Search and a State Filter Only
    rationale: Two controls answer who the expense belongs to and what state it holds.
    cost: A reader with hundreds of expenses from many spenders cannot narrow to one spender.
  - id: views-instead-of-filters
    name: Views Instead of Filters
    rationale: One segmented control replaces the state filter and keeps the choice visible.
    cost: Five segments plus a search box crowd one toolbar with no room for counts per state.
  decision:
    option: search-and-a-state-filter-only
    source: recommended
  compact:
    breakpoint: compact
    behavior: Below 768 pixels the search box and state filter stack above the table, and the table scrolls sideways inside its own region.
  library: litespec/frontend/patterns/page-frames#list-page
  implementations:
    svelte:
      status: adopted
      components:
      - packages/ui/src/floorplans/list-page.svelte
- id: expense-record-page
  group: page-frames
  title: Expense Record Page
  question: How does a reader read and decide one expense?
  options:
  - id: summary-sections-aside-for-history
    name: Summary, Sections, Aside for History
    rationale: What defines the expense runs down the main column while its history supports it from the side.
    cost: Below roughly 1000 pixels the history stacks under the sections, after the actions.
  - id: four-tabs-over-the-same-sections
    name: Four Tabs over the Same Sections
    rationale: Tabs divide the expense when it carries more facets than three sections allow.
    cost: The reader cannot see two facets at once, and the tab count grows with every addition.
  decision:
    option: summary-sections-aside-for-history
    source: recommended
  compact:
    breakpoint: compact
    behavior: Below 768 pixels the sections stack in one column and the history follows them, with the header actions under the title.
  library: litespec/frontend/patterns/page-frames#record-page
  implementations:
    svelte:
      status: pending
      gap: No record floorplan exists yet; the expense record screen is specified but its route is unbuilt.
- id: expense-form-page
  group: page-frames
  title: Expense Form Page
  question: How does a reader file one expense?
  options:
  - id: one-section-one-column-of-fields-cancel-beside-save
    name: One Section, One Column of Fields, Cancel Beside Save
    rationale: One command reads as a list of questions with one place to submit and one to leave.
    cost: Every field sits at the same weight, so a reader has no groups to skip.
  - id: stacked-blocks-with-the-title-above
    name: Stacked Blocks with the Title Above
    rationale: Labeled blocks keep the page scannable when one command carries groups that mean different things.
    cost: The page grows longer, and the block titles add weight above a short list of fields.
  decision:
    option: one-section-one-column-of-fields-cancel-beside-save
    source: recommended
  compact:
    breakpoint: compact
    behavior: Below 768 pixels the single column of fields keeps its order, and Cancel sits beside Save at the end.
  library: litespec/frontend/patterns/page-frames#form-page
  implementations:
    svelte:
      status: pending
      gap: No form floorplan exists yet; the new expense screen is specified but its route is unbuilt.
