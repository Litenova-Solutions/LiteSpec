# yaml-language-server: $schema=https://litespec.dev/7.0.0/schemas/litespec-project.schema.yaml
schemaVersion: 1
project:
  name: Claimwick
size: large
shape: server
stacks:
- dotnet
- svelte
layers:
  intent: litespec
  behavior: litespec
  implementation: litespec
  proof: litespec
problemTypeBase: https://claimwick.dev/problems/
reviewedLiteSpecVersion: 7.0.0
paths:
  docs: .litespec
  behaviorDocs: .litespec/behavior
  glossary: .litespec/glossary.yaml
  testRoots:
  - apps/api/tests
  apiClient: packages/api
  alerts:
  - deploy/alerts
  operations:
  - deploy/Caddyfile
  sbom:
  - .litespec/proof/sbom
stackConfig:
  dotnet:
    modules: apps/api/src/Modules/*
    kernel: apps/api/src/Claimwick.Kernel
    platform: apps/api/src/Claimwick.Platform
    webapi:
    - apps/api/src/Hosts/Claimwick.WebApi
    templateStore: apps/api/src/Modules/Claimwick.Spending/Application/Notifications/ApprovalReminder/MessageTemplates.cs
generate:
- kind: refusal-codes
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
- kind: permissions
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
- kind: event-decisions
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
- kind: closed-sets
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
- kind: knowledge-sets
  stack: dotnet
  path: apps/api/src/Knowledge/Claimwick.{Area}.{Variant}
  namespace: Claimwick.{Area}.{Variant}
- kind: exceptions
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}/Domain/{Aggregate}/Exceptions
  namespace: Claimwick.{Module}.Domain.{Aggregate}.Exceptions
  baseType: Claimwick.Kernel.Domain.DomainException
- kind: domain-events
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}/Domain/{Aggregate}/Events
  namespace: Claimwick.{Module}.Domain.{Aggregate}.Events
  markerType: Claimwick.Kernel.Domain.IDomainEvent
  usings:
  - Claimwick.Spending.Contracts.Expenses
  - Claimwick.Spending.Domain.Expenses.Parts
  - Claimwick.Spending.Domain.Receipts
- kind: module-events
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}.Contracts/{Aggregate}
  namespace: Claimwick.{Module}.Contracts.{Aggregate}
  usings:
  - Claimwick.Spending.Contracts.Expenses
- kind: declarations
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
- kind: validators
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
  usings:
  - Claimwick.Spending.Contracts.Expenses.ReadExpense
- kind: messages
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}/Application/{Aggregate}/{UseCase}
  namespace: Claimwick.{Module}.Application.{Aggregate}.{UseCase}
  commandInterface: LiteBus.Commands.Abstractions.ICommand
  queryInterface: LiteBus.Queries.Abstractions.IQuery
  usings:
  - Claimwick.Spending.Contracts.Expenses
  - Claimwick.Spending.Domain.Receipts
  - Claimwick.Kernel.Values
- kind: messages
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}.Contracts/{Aggregate}/{UseCase}
  namespace: Claimwick.{Module}.Contracts.{Aggregate}.{UseCase}
  commandInterface: LiteBus.Commands.Abstractions.ICommand
  queryInterface: LiteBus.Queries.Abstractions.IQuery
  visibility: public
  usings:
  - Claimwick.Spending.Contracts.Expenses
- kind: results
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}/Application/{Aggregate}/{UseCase}
  namespace: Claimwick.{Module}.Application.{Aggregate}.{UseCase}
  usings:
  - Claimwick.Spending.Contracts.Expenses
  - Claimwick.Spending.Domain.Receipts
  - Claimwick.Kernel.Values
- kind: results
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}.Contracts/{Aggregate}/{UseCase}
  namespace: Claimwick.{Module}.Contracts.{Aggregate}.{UseCase}
  visibility: public
  usings:
  - Claimwick.Spending.Contracts.Expenses
  - Claimwick.Kernel.Values
- kind: endpoints
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
  claimReader: Claimwick.Platform.Http.ActorClaims.ReadActorId
  claimValueReader: Claimwick.Platform.Http.ActorClaims.ReadClaimValue
  usings:
  - Claimwick.Spending.Contracts.Expenses
  - Claimwick.Spending.Domain.Receipts
  - Claimwick.Kernel.Values
frontends:
- name: web
  path: apps/web
  platform: svelte
  client:
    contract: packages/api/openapi.json
    generated: packages/api/src/generated
  entryPoint: entry-point/claimwick-app
  routeSuite: apps/web/tests/routes
  ui:
    profile: application-balanced
ui:
  package:
    name: '@claimwick/ui'
    path: packages/ui
    componentsJson: packages/ui/components.json
    primitives: packages/ui/src/components
    tokens: packages/ui/src/styles/tokens.css
    sourceLock: packages/ui/ui-source-lock.yaml
    designContract: packages/ui/DESIGN.md
    publicExports:
    - '@claimwick/ui/expenses'
selectedExtensions:
- id: audit
  criterion: Finance staff act inside employee expense data, so a later reviewer must establish who attempted what.
dependencies:
  licenses:
  - MIT
  - Apache-2.0
  - BSD-3-Clause
