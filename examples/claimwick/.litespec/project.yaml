# yaml-language-server: $schema=https://litespec.dev/7.0.0/schemas/litespec-project.schema.yaml
schemaVersion: 1
project:
  name: Claimwick
size: large
shape: server
stacks:
- dotnet
- svelte
layers:
  intent: litespec
  behavior: litespec
  implementation: litespec
  proof: litespec
problemTypeBase: https://claimwick.dev/problems/
reviewedLiteSpecVersion: 7.0.0
paths:
  docs: .litespec
  behaviorDocs: .litespec/behavior
  glossary: .litespec/glossary.yaml
  testRoots:
  - apps/api/tests
  apiClient: packages/api
  alerts:
  - deploy/alerts
  operations:
  - deploy/Caddyfile
  sbom:
  - .litespec/proof/sbom
stackConfig:
  dotnet:
    modules: apps/api/src/Modules/*
    kernel: apps/api/src/Claimwick.Kernel
    platform: apps/api/src/Claimwick.Platform
    webapi:
    - apps/api/src/Hosts/Claimwick.WebApi
    templateStore: apps/api/src/Modules/Claimwick.Spending/Application/Notifications/ApprovalReminder/MessageTemplates.cs
sync:
- kind: refusal-codes
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
- kind: permissions
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
- kind: event-decisions
  stack: dotnet
  path: apps/api/src/Modules/Claimwick.{Module}
  namespace: Claimwick.{Module}
frontends:
- name: web
  path: apps/web
  platform: svelte
  client:
    contract: packages/api/openapi.json
    generated: packages/api/src/generated
  entryPoint: entry-point/claimwick-app
  routeSuite: apps/web/tests/routes
  ui:
    profile: application-balanced
ui:
  package:
    name: '@claimwick/ui'
    path: packages/ui
    componentsJson: packages/ui/components.json
    primitives: packages/ui/src/components
    tokens: packages/ui/src/styles/tokens.css
    sourceLock: packages/ui/ui-source-lock.yaml
    designContract: packages/ui/DESIGN.md
    publicExports:
    - '@claimwick/ui/expenses'
verify:
  baseUrl: http://localhost:5000
  signIn:
  - method: GET
    path: /auth/development/{person}
  values:
    expense: 9f2c1a3e4b5d4e6f8a7b1c2d3e4f5a6b
selectedExtensions: []
dependencies:
  licenses:
  - MIT
  - Apache-2.0
  - BSD-3-Clause
