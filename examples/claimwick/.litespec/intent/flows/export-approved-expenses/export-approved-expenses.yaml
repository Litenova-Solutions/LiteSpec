type: flow
id: flow/export-approved-expenses
title: Export Approved Expenses
actor: actor/finance
summary: Finance exports the approved expenses of a period in one batch, so the payout can run. The flow starts when the period's approvals are in and ends when the batch is exported. A good export carries every approved expense of the period.
solves:
- problem/expenses-wait-weeks
startedWhen: Finance has the approvals of the period to pay out.
finishedWhen: Finance has exported the batch of approved expenses for the payout.
steps:
- id: step/export-approved-expenses.export-batch
  title: Export Batch
  statement: Finance exports the approved expenses in one batch.
  actor: actor/finance
  failure: No approved expense awaits the export, so finance sees the refusal and there is no batch to pay out.
  carries:
  - requirement/approval.expense-reimbursed-at-most-once
