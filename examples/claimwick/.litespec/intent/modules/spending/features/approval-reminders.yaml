type: feature
id: feature/approval-reminders
title: Approval Reminders
summary: Managers get a reminder for expenses waiting past three business days. The reminder names the expense and its waiting time. Expenses decided in time never trigger one.
offering: Managers get a reminder for expenses waiting past three business days. The reminder names the expense and its waiting time. Expenses decided in time never trigger one.
solves:
- problem/expenses-wait-weeks
advances:
- goal/decided-in-days
records:
- type: requirement
  id: requirement/approval-reminders.month-end-submissions
  title: Month-end Submissions
  kind: quality
  statement: Each month-end submission is acknowledged within two seconds.
  rationale: Month-end is the peak load the pilot must survive.
  stimulus: Five hundred employees submit expenses in the last hour of the month
  environment: Normal operation, one application instance down
  response: Each submission is stored and acknowledged
  measure: "Share of submissions acknowledged within two seconds: at least 99 percent"
  check: month-end-load
  cites:
  - feature/approval-reminders
