type: decision
id: decision/0006-expense-categories
title: Expense Categories
summary: Each expense carries one category from a fixed list, so finance sorts payouts by kind of cost.
context: Finance sorts payouts by kind of cost. Each expense carries the kind it pays for, and the list of kinds stays fixed so every report reads the same values.
options:
- name: Free text
  pros: A submitter names any kind.
  cons: Every report spells each kind its own way.
- name: Fixed categories
  pros: Every report reads the same values.
  cons: A new kind needs a record change.
- name: Categories per team
  pros: Each team names its own kinds.
  cons: Finance compares teams on different values.
choice: Fixed categories
consequences: Expenses carry one of travel, meals, lodging or other. A new kind arrives as a new choice with its rows, and the generated closed set carries it.
reopenedWhen: Finance needs a kind the list does not hold.
