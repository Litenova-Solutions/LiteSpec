type: screen
id: screen/claimwick-app.expense-list
title: Expense List
summary: An employee sees their own expenses, newest first, with the amount and the latest state of each.
route: /expenses
offers:
- use-case/spending.list-expenses
fieldSources:
- field: expenseId
  from: use-case/spending.list-expenses
- field: amount
  from: use-case/spending.list-expenses
- field: currency
  from: use-case/spending.list-expenses
- field: state
  from: use-case/spending.list-expenses
- field: submittedAt
  from: use-case/spending.list-expenses
serves:
- step/submit-and-reimburse.watch-expenses
fulfills:
- requirement/ui-chart-series
- requirement/ui-control-boundary
- requirement/ui-focus-indicator
- requirement/ui-reflow
- requirement/ui-target-size
- requirement/ui-text-contrast
leadsTo:
- screen/claimwick-app.expense-record
- screen/claimwick-app.new-expense
job: The employee scans the list for one expense, opens it to read or act on it, or starts a new one.
archetype: ListPage
states:
- name: Empty
  shows: The list says it is empty and points to the new expense form.
- name: Loading
  shows: The rows show as placeholders while the list loads.
- name: Failed
  shows: The page says the list is unavailable and offers to try again.
