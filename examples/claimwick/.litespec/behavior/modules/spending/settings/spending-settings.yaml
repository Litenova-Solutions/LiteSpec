type: setting-set
title: Settings
records:
- type: setting
  id: setting/spending.receipt-threshold
  title: Receipt Threshold
  valueType: money
  default: EUR 25
  range: EUR 0 to EUR 500
  unit: EUR
  setBy: product
  atBound: refuse
  fulfills:
  - requirement/approval.above-threshold-receipt
- type: setting
  id: setting/spending.approval-reminder-delay
  title: Approval Reminder Delay
  valueType: duration
  default: 48 hours
  range: 1-120 hours
  unit: hours
  setBy: operator
  key: Spending:ApprovalReminderDelay
  atBound: refuse
  fulfills:
  - requirement/approval.decided-within-five-days
