type: use-case
id: use-case/spending.attach-receipt
title: Attach Receipt
summary: An employee adds a receipt to a submitted expense so it can be decided.
kind: command
access:
  grant: permission/submit-expense
  tenant: own
serves:
- journey/submit-and-reimburse#s2
fulfills:
- requirement/approval.receipt-over-threshold
reachedThrough:
- entry-point/claimwick-app
raises:
- event/receipt.attached
changes:
- aggregate/spending.expense
idempotency:
  mode: none
  reason: a repeat attaches the same receipt to the same submitted expense, leaving the same receipt attached
audit:
  level: none
  target: no audit trail; the example stores no audit entry
records:
- type: result
  id: result/attach-receipt.attached
  title: Attached
  outcome: success
  meaning: The receipt is attached.
- type: result
  id: result/attach-receipt.expense-decided
  title: Expense Decided
  outcome: refusal
  code: spending.expense-decided
  meaning: The expense is already decided.
- type: scenario
  id: scenario/attach-receipt.attaching-a-receipt-succeeds
  title: Attaching a Receipt Succeeds
  given: An employee submitted an expense below the threshold with no receipt.
  when: The employee attaches the receipt.
  then: The receipt is attached.
  result: result/attach-receipt.attached
- type: scenario
  id: scenario/attach-receipt.attaching-to-decided-expense-refused
  title: Attaching to a Decided Expense Is Refused
  given: A manager approved an expense.
  when: The employee attaches the receipt.
  then: The receipt is refused because the expense is already decided.
  result: result/attach-receipt.expense-decided
