type: notification
id: notification/spending.approval-reminder
title: Approval Reminder
summary: The reminder names the expense and its waiting time. Each waiting expense earns one reminder.
template: approval-reminder-manager
audience:
- actor/manager
channel:
- email
deliveredThrough: external-system/mail-relay
requiresConsent: rule/spending.suppressed-manager-gets-no-reminder
frequency: once
dedupKey: approval-reminder-{expenseId}
params:
- submitterName
locale: English only; the template ships one language.
suppressedWhen: The approver is named in the suppression list.
fulfills:
- requirement/approval.decided-within-five-days
