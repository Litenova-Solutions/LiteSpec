type: integration-event
id: integration-event/expense-personal-data-erased
title: Expense Personal Data Erased
summary: The expense-personal-data-erased event announces that the personal data of a decided expense was erased.
direction: out
eventType: com.claimwick.expense.personal-data-erased
source: /spending/expenses
subject: aggregate/spending.expense
payload:
- name: expenseId
  meaning: The expense whose personal data was erased.
  type: id
  of: aggregate/spending.expense
  required: true
  classification: internal
delivery: The broker delivers each event at least once, in erasure order.
addresses: permission/remove-personal-data
trust: payload
translates: event/expense.personal-data-erased
dataschema: https://schemas.claimwick.dev/expense-personal-data-erased/v1
terms:
- term/expense
- term/personal-data
