type: permission-set
title: Permissions
excludes:
- The request-expense permission does not cover approving or refusing an expense.
- The post-reimbursement permission does not cover exporting approved expenses.
- The list-expenses permission reads expenses and changes none of them.
- The read-expense permission reads one expense and changes none of them.
- The manage-reminder-preference permission does not let a manager change another preference.
- The remove-personal-data permission does not remove the expense.
records:
- type: permission
  id: permission/request-expense
  title: Request Expense
  meaning: The right to submit an expense and attach its receipts.
- type: permission
  id: permission/approve-expense
  title: Approve Expense
  meaning: The right to approve or reject a submitted expense.
- type: permission
  id: permission/post-reimbursement
  title: Post Reimbursement
  meaning: The right to reimburse an approved expense.
  risk:
  - money
- type: permission
  id: permission/list-expenses
  title: List Expenses
  meaning: The right to read own expenses.
- type: permission
  id: permission/manage-policy
  title: Manage Policy
  meaning: The right to set the receipt threshold.
- type: permission
  id: permission/manage-reminder-preference
  title: Manage Reminder Preference
  meaning: The right to change a manager's approval reminder preference.
- type: permission
  id: permission/export-expenses
  title: Export Expenses
  meaning: The right to export approved expenses for finance.
- type: permission
  id: permission/remove-personal-data
  title: Remove Personal Data
  meaning: The right to erase the personal data of a decided expense.
  risk:
  - personal-data
- type: permission
  id: permission/read-expense
  title: Read Expense
  meaning: The right to read one expense with its current state.
