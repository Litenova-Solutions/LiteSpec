type: use-case
id: use-case/spending.change-receipt-threshold
title: Change Receipt Threshold
summary: A manager sets the receipt threshold so small expenses stay light to submit.
kind: command
access:
  grant: permission/manage-policy
  tenant: own
serves:
  - journey/submit-and-reimburse#s6
fulfills:
  - requirement/approval.receipt-over-threshold
reachedThrough:
  - entry-point/claimwick-app
raises: []
changes:
  - aggregate/spending.policy
idempotency:
  mode: none
  reason: a repeat sets the same threshold on the policy, leaving the same value in place
audit:
  level: none
  target: no audit trail; the example stores no audit entry
records:
  - type: result
    id: result/change-receipt-threshold.threshold-set
    title: Threshold Set
    outcome: success
    meaning: The receipt threshold is set.
  - type: result
    id: result/change-receipt-threshold.negative-threshold
    title: Negative Threshold
    outcome: refusal
    code: spending.negative-threshold
    meaning: The threshold is negative.
  - type: scenario
    id: scenario/change-receipt-threshold.setting-the-threshold-succeeds
    title: Setting the Threshold Succeeds
    given: Finance agreed a new receipt threshold with the managers.
    when: The manager sets the receipt threshold.
    then: The receipt threshold is set.
    result: result/change-receipt-threshold.threshold-set
  - type: scenario
    id: scenario/change-receipt-threshold.setting-a-negative-threshold-is-refused
    title: Setting a Negative Threshold Is Refused
    given: Finance agreed a new receipt threshold with the managers.
    when: The manager sets a negative receipt threshold.
    then: The change is refused because the threshold is negative.
    result: result/change-receipt-threshold.negative-threshold
