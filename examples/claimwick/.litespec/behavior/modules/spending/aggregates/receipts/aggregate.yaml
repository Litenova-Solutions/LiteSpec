type: aggregate
id: aggregate/spending.receipt
title: Receipt
summary: A receipt is proof of payment attached to an expense.
states:
- name: Attached
  meaning: The receipt sits on the expense.
transitions:
- from: "-"
  to: Attached
  movedBy: use-case/spending.attach-receipt
records:
- type: domain-event
  id: domain-event/receipt.attached
  title: Receipt Attached
  meaning: A receipt was attached.
  carries:
  - name: receiptId
    type: id
    identifies: aggregate/spending.receipt
  - name: expenseId
    type: id
    identifies: aggregate/spending.expense
