type: domain-event
id: domain-event/expense.submitted
title: Expense Submitted
meaning: An expense was submitted.
carries:
- name: expenseId
  type: id
  identifies: aggregate/spending.expense
- name: amount
  type: decimal
  scale: 2
- name: currency
  type: text
  maxLength: 3
- name: employeeId
  type: id
  identifies: actor/employee
- name: note
  type: text
  maxLength: 280
  required: false
- name: importId
  type: id
- name: lines
  type: list
  rowShape:
    fields:
    - name: category
      meaning: The kind of cost the line carries.
      type: text
      required: true
    - name: amount
      meaning: The line amount.
      type: money
      currencyHome: aggregate/spending.expense
      required: true
  rowType: aggregate/spending.expense#line-item
