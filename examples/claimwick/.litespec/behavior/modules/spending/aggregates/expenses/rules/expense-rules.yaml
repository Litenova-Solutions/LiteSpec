type: rule-set
title: Expense Rules
summary: Each expense carries a receipt above the threshold, is decided once from Submitted by an approver who is not the submitter, is reimbursed once after approval, has its personal data erased only after its retention, and only approved expenses export.
records:
- type: rule
  id: rule/expense.receipt-required-above-threshold
  title: Receipt Required Above Threshold
  kind: precondition
  statement: An expense above the policy threshold needs a receipt.
  governs:
  - use-case/spending.submit-expense
  - aggregate/spending.expense
  refusal: spending.receipt-missing
  basedOn: []
  fulfills:
  - requirement/approval.above-threshold-receipt
- type: rule
  id: rule/expense.approver-is-not-submitter
  title: Approver Is Not Submitter
  kind: precondition
  statement: An approver is not the submitter.
  governs:
  - use-case/spending.approve-expense
  - aggregate/spending.expense
  refusal: spending.own-expense
  basedOn: []
  fulfills:
  - requirement/approval.nobody-approves-own-expense
- type: rule
  id: rule/expense.reimbursed-once
  title: Reimbursed Once
  kind: invariant
  statement: An expense is reimbursed at most once.
  governs:
  - use-case/spending.reimburse-expense
  - aggregate/spending.expense
  refusal: spending.already-reimbursed
  basedOn: []
  fulfills:
  - requirement/approval.expense-reimbursed-at-most-once
- type: rule
  id: rule/expense.approved-before-reimbursement
  title: Approved Before Reimbursement
  kind: precondition
  statement: An expense is reimbursed only after approval.
  governs:
  - use-case/spending.reimburse-expense
  - aggregate/spending.expense
  refusal: spending.not-approved
  basedOn: []
  fulfills:
  - requirement/approval.expense-reimbursed-at-most-once
- type: rule
  id: rule/expense.decided-from-submitted
  title: Decided from Submitted
  kind: precondition
  statement: An expense is decided only from Submitted.
  governs:
  - use-case/spending.approve-expense
  - use-case/spending.refuse-expense
  - aggregate/spending.expense
  refusal: spending.not-submitted
  basedOn: []
  fulfills:
  - requirement/approval.decided-within-five-days
- type: rule
  id: rule/expense.erased-after-retention
  title: Erased After Retention
  kind: precondition
  statement: The personal data of an expense is erased only after its retention ends.
  governs:
  - use-case/spending.erase-personal-data
  - aggregate/spending.expense
  refusal: spending.retention-not-ended
  basedOn: []
  fulfills:
  - requirement/approval.erased-after-retention
- type: rule
  id: rule/expense.export-carries-approved
  title: Export Carries Approved
  kind: precondition
  statement: An export carries an approved expense.
  governs:
  - use-case/spending.export-expenses
  refusal: spending.nothing-approved
  basedOn: []
  fulfills:
  - requirement/approval.decided-within-five-days
