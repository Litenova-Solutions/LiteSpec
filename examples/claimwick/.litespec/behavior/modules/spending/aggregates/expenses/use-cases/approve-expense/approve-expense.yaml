type: use-case
id: use-case/spending.approve-expense
title: Approve Expense
summary: A manager decides a submitted expense so the employee learns the outcome.
exposure: A signed-in manager reaches this command through the expenses app under the approve-expense permission. A wrong approval sends an out-of-policy expense toward payment, so the decision needs a manager who is not the submitter.
kind: command
access:
  grant: permission/approve-expense
  tenant: own
  preconditions:
  - rule/expense.approver-is-not-submitter
serves:
- step/submit-and-reimburse.decide-expense
fulfills:
- requirement/approval.nobody-approves-own-expense
reachedThrough:
- entry-point/claimwick-app
raises:
- domain-event/expense.approved
http:
  method: POST
  route: /api/expenses/{expenseId}:approve
input:
- name: expenseId
  meaning: The submitted expense to approve.
  type: id
  identifies: aggregate/spending.expense
  required: true
  origin: caller
  binding: route
  classification: internal
- name: approverId
  meaning: The signed-in manager deciding the expense, read from verified claims.
  type: id
  identifies: actor/manager
  required: false
  origin: verified-claim
  verifiedBy: entry-point/claimwick-app
  binding: claim
  classification: personal
- name: handledAt
  meaning: The time the decision runs, read from the clock.
  type: instant
  required: false
  origin: derived
  classification: internal
output:
- name: expenseId
  meaning: The approved expense.
  type: id
  identifies: aggregate/spending.expense
writes:
- aggregate/spending.expense
idempotency:
  mode: state
  reason: the first approval moves the expense out of the submitted state, so the aggregate refuses a second approval
  replay: refuses
  recognizedBy: the aggregate state already holds the outcome this command sets
audit:
  exemptBecause: Approvals leave their trail in the expense states and events.
steps:
- statement: The manager opens a submitted expense.
  cites:
  - aggregate/spending.expense
- statement: Spending refuses the approval with `spending.own-expense` when the approver submitted it.
  cites:
  - result/approve-expense.own-expense
  - rule/expense.approver-is-not-submitter
- statement: Spending refuses the approval with `spending.not-submitted` when the expense is decided.
  cites:
  - result/approve-expense.not-submitted
  - rule/expense.decided-from-submitted
- statement: Spending moves the expense to Approved and raises the approved event.
  cites:
  - result/approve-expense.approved
  - domain-event/expense.approved
  - aggregate/spending.expense
edgeCases:
- Spending refuses approval of the manager's own expense with `spending.own-expense`.
records:
- type: result
  id: result/approve-expense.approved
  title: Approved
  outcome: success
  meaning: The expense is approved.
- type: result
  id: result/approve-expense.own-expense
  title: Own Expense
  outcome: refusal
  refusal: refusal/spending.own-expense
  sentence: You submitted this expense, so another manager must decide it.
  sentences:
    nl: Je hebt deze uitgave zelf ingediend, dus een andere manager moet erover beslissen.
- type: result
  id: result/approve-expense.not-submitted
  title: Not Submitted
  outcome: refusal
  refusal: refusal/spending.not-submitted
  sentence: This expense is already decided, so there is nothing to approve.
  sentences:
    nl: Over deze uitgave is al beslist, dus er valt niets meer goed te keuren.
- type: scenario
  id: scenario/approve-expense.approving-a-submitted-expense-succeeds
  title: Approving a Submitted Expense Succeeds
  given: An employee submitted an expense with its receipt.
  when: The manager approves the expense.
  then: The expense is approved.
  result: result/approve-expense.approved
  exercises:
  - rule/expense.approver-is-not-submitter
  - rule/expense.decided-from-submitted
- type: scenario
  id: scenario/approve-expense.approving-an-own-expense-is-refused
  title: Approving an Own Expense Is Refused
  given: A manager submitted an expense with its receipt.
  when: The manager approves the expense.
  then: The approval is refused because the approver submitted the expense.
  result: result/approve-expense.own-expense
  exercises:
  - rule/expense.approver-is-not-submitter
- type: scenario
  id: scenario/approve-expense.approving-a-decided-expense-is-refused
  title: Approving a Decided Expense Is Refused
  given: A manager approved an expense.
  when: The manager approves the expense again.
  then: The approval is refused because the expense is already decided.
  result: result/approve-expense.not-submitted
  exercises:
  - rule/expense.decided-from-submitted
