type: use-case
id: use-case/spending.read-expense
title: Read Expense
summary: Spending returns one expense with its current state so a calling module can confirm the expense before it uses its own copy.
exposure: The reporting module reaches this query in process when finance lists the reimbursed expenses. The caller holds the read-expense permission, so only finance staff listing payouts read another employee's expense.
kind: query
access:
  grant: permission/read-expense
  tenant: own
fulfills:
- requirement/approval.reimbursed-expenses-listed
reachedThrough:
- module/reporting
raises: []
input:
- name: payout
  meaning: The payout reporting holds, to confirm against the stored expense.
  type: object
  rowType: ClaimedPayout
  rowShape:
    fields:
    - name: expenseId
      meaning: The expense to read.
      type: id
      identifies: aggregate/spending.expense
      required: true
    - name: amount
      meaning: The payout amount reporting holds.
      type: decimal
      scale: 2
      required: true
    - name: currency
      meaning: The ISO 4217 currency code of the payout amount.
      type: text
      maxLength: 3
      required: true
  required: true
  origin: caller
  classification: internal
output:
  include:
    expense:
      fields:
      - name: expenseId
        meaning: The read expense.
        type: id
        identifies: aggregate/spending.expense
      - name: state
        meaning: The latest lifecycle state of the expense.
        type: text
      - name: total
        meaning: The stored total of the expense.
        type: object
        rowType: ExpenseTotal
        rowShape:
          fields:
          - name: amount
            meaning: The exact amount of the expense.
            type: decimal
            scale: 2
            required: true
          - name: currency
            meaning: The ISO 4217 currency code of the amount.
            type: text
            maxLength: 3
            required: true
      classification: internal
      reads:
      - aggregate/spending.expense
      freshness:
        mode: immediate
paging:
  mode: none
  reason: one expense answers the query
reads:
- aggregate/spending.expense
audit:
  exemptBecause: Reads trail nothing.
steps:
- statement: Reporting names one expense and the payout it holds.
  cites:
  - aggregate/spending.expense
- statement: Spending returns the expense with its current state.
  cites:
  - result/read-expense.read
  - aggregate/spending.expense
- statement: Spending answers that no expense matches when the identity is unknown or the payout differs.
  cites:
  - result/read-expense.unknown
records:
- type: result
  id: result/read-expense.read
  title: Read
  outcome: success
  meaning: The expense is read.
- type: result
  id: result/read-expense.unknown
  title: Unknown
  outcome: success
  meaning: No expense answers the identity.
- type: scenario
  id: scenario/read-expense.reading-a-reimbursed-expense-succeeds
  title: Reading a Reimbursed Expense Succeeds
  given: Finance reimbursed an expense.
  when: Reporting reads the expense.
  then: The expense is read with its reimbursed state.
  result: result/read-expense.read
  exercises: []
- type: scenario
  id: scenario/read-expense.reading-an-unknown-expense-finds-nothing
  title: Reading an Unknown Expense Finds Nothing
  given: No expense carries the named identity.
  when: Reporting reads the expense.
  then: The read answers that no expense matches.
  result: result/read-expense.unknown
  exercises: []
