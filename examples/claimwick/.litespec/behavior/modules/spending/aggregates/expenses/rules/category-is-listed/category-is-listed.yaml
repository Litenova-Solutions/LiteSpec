type: rule
id: rule/expense.category-is-listed
title: Category Is Listed
kind: precondition
statement: A submission carries only a category the expense-category table lists in reference-data/spending.expense-category.
governs:
- use-case/spending.submit-expense
- aggregate/spending.expense
basedOn:
- decision/0006-expense-categories
rationale: Every report reads the same values only when each submission carries a listed category, so the boundary refuses an unlisted label instead of storing a spelling no report reads.
