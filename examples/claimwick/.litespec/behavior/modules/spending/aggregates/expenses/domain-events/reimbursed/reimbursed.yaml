type: domain-event
id: domain-event/expense.reimbursed
title: Expense Reimbursed
meaning: An expense was reimbursed.
carries:
- name: expenseId
  type: id
  identifies: aggregate/spending.expense
- name: employeeId
  type: id
  identifies: actor/employee
- name: amount
  type: decimal
  scale: 2
- name: currency
  type: text
  maxLength: 3
- name: reimbursedAt
  type: instant
