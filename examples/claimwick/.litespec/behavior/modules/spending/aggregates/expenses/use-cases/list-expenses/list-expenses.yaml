type: use-case
id: use-case/spending.list-expenses
title: List Expenses
summary: An employee sees their own expenses with the latest state of each.
exposure: A signed-in employee reaches this query through the expenses app under the list-expenses permission. The list shows only that employee's own expenses, so a wrong filter would show another person's costs.
kind: query
access:
  grant: permission/list-expenses
  tenant: own
  scope: self
  identityInput: employee
serves:
- step/submit-and-reimburse.watch-expenses
fulfills:
- requirement/approval.decided-within-five-days
reachedThrough:
- entry-point/claimwick-app
raises: []
http:
  method: GET
  route: /api/expenses
input:
- name: employee
  meaning: The signed-in employee listing their expenses, read from verified claims.
  type: id
  identifies: actor/employee
  required: false
  origin: verified-claim
  verifiedBy: entry-point/claimwick-app
  binding: claim
  classification: personal
output:
  include:
    rows:
      fields:
      - name: expenses
        meaning: The set of rows with one row per expense, newest first.
        type: list
        rowShape:
          fields:
          - name: expenseId
            meaning: The listed expense.
            type: id
            identifies: aggregate/spending.expense
            required: true
          - name: employeeId
            meaning: The employee the listed expense belongs to.
            type: id
            identifies: actor/employee
            required: true
          - name: amount
            meaning: The exact amount of the expense.
            type: decimal
            scale: 2
            required: true
          - name: currency
            meaning: The ISO 4217 currency code of the amount.
            type: text
            maxLength: 3
            required: true
          - name: state
            meaning: The latest lifecycle state of the expense.
            type: text
            required: true
          - name: submittedAt
            meaning: The time the expense was submitted.
            type: instant
            required: true
          unique:
          - expenseId
        rowType: ExpenseSummary
      classification: internal
      reads:
      - aggregate/spending.expense
      freshness:
        mode: immediate
paging:
  mode: pages
  order: Submission time, newest first.
  cursor: The submission time and identity of the last row.
  defaultLimit: 25
  maxLimit: 100
reads:
- aggregate/spending.expense
audit:
  exemptBecause: Reads trail nothing.
steps:
- statement: The employee lists their own expenses.
  cites:
  - aggregate/spending.expense
- statement: Spending returns the expenses newest first.
  cites:
  - result/list-expenses.listed
  - aggregate/spending.expense
records:
- type: result
  id: result/list-expenses.listed
  title: Listed
  outcome: success
  meaning: The expenses are listed.
- type: scenario
  id: scenario/list-expenses.listing-own-expenses-succeeds
  title: Listing Own Expenses Succeeds
  given: An employee submitted two expenses.
  when: The employee lists their expenses.
  then: Both expenses are listed.
  result: result/list-expenses.listed
  exercises: []
