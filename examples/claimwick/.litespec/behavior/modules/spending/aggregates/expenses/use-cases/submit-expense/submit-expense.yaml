type: use-case
id: use-case/spending.submit-expense
title: Submit Expense
summary: An employee files a work expense so it can be decided and reimbursed.
kind: command
access:
  grant: permission/request-expense
  tenant: own
serves:
- step/submit-and-reimburse.submit-expense
fulfills:
- requirement/approval.above-threshold-receipt
via:
- entry-point/claimwick-app
raises:
- domain-event/expense.submitted
http:
  method: POST
  route: /api/expenses
  created: /api/expenses/{expenseId}
inputs:
- name: expenseId
  meaning: The identifier the app mints for one submission attempt, so a retried request finds the same expense.
  type: id
  identifies: aggregate/spending.expense
  required: true
  origin: caller
  classification: internal
- name: amount
  meaning: The exact amount of the expense.
  type: decimal
  required: true
  origin: caller
  classification: internal
- name: currency
  meaning: The ISO 4217 currency code of the amount.
  type: text
  required: true
  origin: caller
  classification: internal
- name: receipt
  meaning: The proof of payment, required above the threshold.
  type: id
  identifies: aggregate/spending.receipt
  required: false
  rules:
  - rule/expense.receipt-required-above-threshold
  origin: caller
  classification: internal
- name: employee
  meaning: The signed-in employee filing the expense, read from verified claims.
  type: id
  identifies: actor/employee
  required: false
  origin: verified-claim
  verifiedBy: entry-point/claimwick-app
  classification: personal
outputs:
- name: expenseId
  meaning: The submitted expense.
  type: id
  identifies: aggregate/spending.expense
writes:
- aggregate/spending.expense
reads:
- aggregate/spending.policy
consistency:
  mode: atomic
  boundBy:
  - rule/expense.receipt-required-above-threshold
  guards:
  - aggregate/spending.policy
idempotency:
  mode: key
  key: "{expenseId}"
  scope: account
  replay: returns-first-result
audit:
  level: required
  category: monetary-action
  target:
    from: outputs
    field: expenseId
  targetKind: aggregate/spending.expense
steps:
- statement: The employee sends the amount, currency and receipt.
  cites:
  - aggregate/spending.policy
- statement: Spending checks the receipt rule against the threshold.
  cites:
  - rule/expense.receipt-required-above-threshold
- statement: Spending reads the travel allowance from the per-diem row in force for the travel date and country.
  cites:
  - rule/expense.travel-allowance-from-per-diem
- statement: Spending refuses the submission with `spending.receipt-missing` when the receipt is missing.
  cites:
  - result/submit-expense.receipt-missing
  - rule/expense.receipt-required-above-threshold
- statement: Spending stores the expense as Submitted and raises the submitted event.
  cites:
  - result/submit-expense.submitted
  - domain-event/expense.submitted
  - aggregate/spending.expense
edgeCases:
- Spending refuses a threshold expense with no receipt with `spending.receipt-missing`.
results:
- id: result/submit-expense.submitted
  title: Submitted
  outcome: success
  meaning: The expense is submitted.
- id: result/submit-expense.receipt-missing
  title: Receipt Missing
  outcome: refusal
  refusal: refusal/spending.receipt-missing
  message: Attach the receipt for this expense, then submit again.
  translations:
    nl: Voeg het bonnetje voor deze uitgave toe en dien de uitgave daarna opnieuw in.
scenarios:
- id: scenario/submit-expense.submitting-with-a-receipt-succeeds
  title: Submitting with a Receipt Succeeds
  given: An employee paid for a train ticket and kept the receipt.
  when: The employee submits the expense with the receipt.
  then: The expense is submitted.
  result: result/submit-expense.submitted
  exercises:
  - rule/expense.receipt-required-above-threshold
  - rule/expense.travel-allowance-from-per-diem
  probe:
    as: person/ava
    request:
      method: POST
      path: /api/expenses
      body:
        expenseId: "{expense}"
        amount: 48.9
        currency: EUR
    expect:
      status: 201
      fields:
      - path: /state
        equals: submitted
      - path: /expenseId
        present: true
- id: scenario/submit-expense.submitting-without-a-receipt-is-refused
  title: Submitting Without a Receipt Is Refused
  given: An employee paid for a train ticket and lost the receipt.
  when: The employee submits the expense with no receipt.
  then: The submission is refused because the expense is above the receipt threshold and carries no receipt.
  result: result/submit-expense.receipt-missing
  exercises:
  - rule/expense.receipt-required-above-threshold
- id: scenario/submit-expense.lowered-threshold-refuses-waiting-expense
  title: Lowered Threshold Refuses Waiting Expense
  given: A manager lowers the receipt threshold from 50 EUR to 10 EUR, and the change is committing.
  when: An employee submits a 30 EUR expense with no receipt while the change commits.
  then: The submission reads the lowered threshold once the change commits and is refused, because the expense is above the receipt threshold and carries no receipt.
  result: result/submit-expense.receipt-missing
  exercises:
  - rule/expense.receipt-required-above-threshold
  competesWith: use-case/spending.change-receipt-threshold
- id: scenario/submit-expense.unstated-travel-rule-refused
  title: Unstated Travel Rule Refused
  given: An employee travels to a country the travel rates state no per-diem row for.
  when: The employee submits the expense.
  then: The submission is refused because the travel rates state no rule for the travel date and country.
  result: result/submit-expense.rule-not-stated
  exercises:
  - rule/expense.travel-allowance-from-per-diem
