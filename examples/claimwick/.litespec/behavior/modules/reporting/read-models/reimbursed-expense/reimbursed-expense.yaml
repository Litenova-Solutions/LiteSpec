type: read-model
id: read-model/reporting.reimbursed-expense
title: Reimbursed Expense
summary: What Reporting keeps about each reimbursed expense to list the payouts per employee.
keyedBy: aggregate/spending.expense
fields:
- name: employeeId
  meaning: The employee the expense was reimbursed to.
  type: id
  identifies: actor/employee
  from: module-event/spending.expense-reimbursed#employeeId
  classification: personal
  erasedBy: module-event/spending.expense-personal-data-erased
- name: amount
  meaning: The exact amount paid.
  type: decimal
  scale: 2
  from: module-event/spending.expense-reimbursed#amount
  classification: internal
- name: currency
  meaning: The ISO 4217 currency code of the amount.
  type: text
  maxLength: 3
  from: module-event/spending.expense-reimbursed#currency
  classification: internal
- name: reimbursedAt
  meaning: The time the payment was posted.
  type: instant
  from: module-event/spending.expense-reimbursed#reimbursedAt
  classification: internal
freshness:
  mode: snapshot
  within: PT5S
  decidedBy: use-case/spending.reimburse-expense
terms:
- term/expense
