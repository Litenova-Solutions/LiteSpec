name: Standards

on:
  pull_request:
  push:
    branches:
      - main
  # A pinned action, a pinned Node release, and a validator that reads the clock
  # all change behaviour without a commit. A nightly run reports that on the day
  # it happens rather than on the next pull request.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    # The default step timeout is six hours. A hung validator would hold a runner
    # for that long and report nothing useful at the end of it.
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The Node release the manifest pins under `stack`.
          node-version: '24.22.0'
          package-manager-cache: false

      - name: Run standards validator cases
        run: node tools/validate-standards.cases.mjs

      - name: Check the generated provision index
        run: node tools/generate-provisions.mjs --check

      - name: Validate standards
        run: node tools/validate-standards.mjs

      - name: Run UI validator cases
        run: node tools/validate-ui.cases.mjs

      - name: Run consumer validator cases
        run: node tools/validate-consumer.cases.mjs

      - name: Check whitespace errors
        run: git diff --check

  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false

      - name: Build the model builder
        run: dotnet build tools/model/Litenova.Model

      - name: Run model builder cases
        run: node tools/model.cases.mjs

  skipped-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The pull request template asks for 'None.' or a named command with its
      # reason. A section left empty reads as 'nothing was skipped' and as 'the
      # author did not fill it in', which are different facts.
      - name: Check the Skipped Checks section
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          section=$(printf '%s' "$BODY" | sed -n '/^## Skipped Checks/,$p' | tail -n +2 | sed '/^## /,$d')
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "The 'Skipped Checks' section is empty. Write 'None.' or name each skipped command and its exact reason."
            exit 1
          fi
          if printf '%s' "$section" | grep -qi 'name each skipped command'; then
            echo "The 'Skipped Checks' section still holds the template instruction. Replace it with 'None.' or the skipped commands."
            exit 1
          fi
