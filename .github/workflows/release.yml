name: Release

# A release is a v<version> tag on main. The tag publishes the two NuGet packages and the
# GitHub release for that version, after the same checks a pull request runs.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same four gates a pull request runs, in the Release configuration.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      configuration: Release

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag, the manifest and both packages name one release. The version test in
      # the suite holds the manifest, the packages, the changelog and the templates
      # together; this step adds the tag.
      - name: Match the tag to the manifest version
        id: version
        run: |
          version="$(jq -r .version litespec.manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not name the manifest version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  nuget:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Trusted publishing: nuget.org exchanges this run's OIDC token for a short-lived key,
    # so no long-lived API key is stored. The policy on nuget.org names this repository,
    # this workflow file and the release environment.
    environment: release
    permissions:
      id-token: write
    steps:
      # The checkout cleans the workspace, so it runs before the packages land in it.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish LiteSpec.Cli and LiteSpec.Analyzers
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    needs: [version, nuget]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # The release notes are the changelog section for this version, unchanged.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v heading="## v$VERSION" '$0 == heading {found = 1; next} found && /^## v/ {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section headed '## v$VERSION'."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" packages/*.nupkg --title "LiteSpec $VERSION" --notes-file notes.md --verify-tag
