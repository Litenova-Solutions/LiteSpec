name: LiteSpec

on:
  pull_request:
  push:
    branches:
      - main
      # A release is prepared on its own branch before it merges, so the branch is checked from its first push.
      - "v[0-9]*"
  # A pinned action, a pinned Node release, and a validator that reads the clock
  # all change behavior without a commit. A nightly run reports that on the day
  # it happens rather than on the next pull request.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-24.04
    # The default step timeout is six hours. A hung check would hold a runner
    # for that long and report nothing useful at the end of it.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The CLI runs the frontend reader as a Node bundle, so the bundle exists before
      # the tests that call it and before the pack that ships it beside the tool.
      - name: Configure Node.js for the frontend reader
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"
          package-manager-cache: false

      - name: Install pnpm for the frontend reader
        run: npm install --global pnpm@11.28.5

      - name: Build the frontend reader bundle
        run: |
          pnpm --dir apps/cli/fe-reader install --frozen-lockfile
          pnpm --dir apps/cli/fe-reader build

      - name: Build the CLI and the analyzers
        run: dotnet build LiteSpec.slnx

      - name: Run the CLI and analyzer test suites
        run: dotnet test --solution LiteSpec.slnx --no-build

      - name: Pack the tool and the analyzers
        run: |
          dotnet pack apps/cli/src/LiteSpec.Cli --output artifacts
          dotnet pack apps/analyzers/src/LiteSpec.Analyzers --output artifacts

      # A consumer installs the tool from a package and runs it outside this repository,
      # where nothing but the release inside the package can answer.
      - name: Run the packed tool the way a consumer installs it
        run: .github/scripts/smoke-tool.sh artifacts

      - name: Check the generated provision index
        run: dotnet run --project apps/maintain/src/LiteSpec.Maintain --no-build -- provisions --check

      - name: Validate the LiteSpec repository
        run: dotnet run --project apps/maintain/src/LiteSpec.Maintain --no-build -- validate

      # On a fresh checkout `git diff --check` has no change to examine, so
      # compare the change itself: the pull request against its base, or the
      # pushed commit against its parent when it has one.
      - name: Check whitespace errors in the change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git diff --check "origin/$BASE_REF...HEAD"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          fi

  cli-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The CLI runs the frontend reader as a Node bundle, so the bundle exists before
      # the tests that call it and before the pack that ships it beside the tool.
      - name: Configure Node.js for the frontend reader
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"
          package-manager-cache: false

      - name: Install pnpm for the frontend reader
        run: npm install --global pnpm@11.28.5

      - name: Build the frontend reader bundle
        run: |
          pnpm --dir apps/cli/fe-reader install --frozen-lockfile
          pnpm --dir apps/cli/fe-reader build

      - name: Build the CLI and the analyzers
        run: dotnet build LiteSpec.slnx

      - name: Run the CLI and analyzer test suites
        run: dotnet test --solution LiteSpec.slnx

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The Node release the manifest pins under stack.
          node-version: "24.22.0"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.28.5

      - name: Install the site dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the site, including the wireframe renderer against the CLI goldens
        run: pnpm test

      # The same build the release deploys: Astro, then the Pagefind search index.
      - name: Build the site
        run: pnpm build

  skipped-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The pull request template asks for 'None.' or a named command with its
      # reason. A section left empty reads as 'nothing was skipped' and as 'the
      # author did not fill it in', which are different facts.
      - name: Check the Skipped Checks section
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          section=$(printf '%s' "$BODY" | sed -n '/^## Skipped Checks/,$p' | tail -n +2 | sed '/^## /,$d')
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "The 'Skipped Checks' section is empty. Write 'None.' or name each skipped command and its exact reason."
            exit 1
          fi
          if printf '%s' "$section" | grep -qi 'name each skipped command'; then
            echo "The 'Skipped Checks' section still holds the template instruction. Replace it with 'None.' or the skipped commands."
            exit 1
          fi
