name: Dev feed

# Every push to a release branch publishes the CLI and analyzers at
# <manifest version>-dev.<run number> to GitHub Packages, so a consumer's CI
# restores the exact build its developers use. The run calls the same CI the
# release workflow calls, at the dev version, then pushes the same artifacts
# the release publishes: the top-level tool package, the framework-dependent
# package, every native platform package, and the analyzers. A maintainer pins
# a consumer to one of these builds with
# 'litespec-maintain publish-local --consumer <path> --from-ci <run number>'.
on:
  push:
    branches:
      - "release/*"

permissions:
  contents: read

concurrency:
  group: dev-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Names the dev version from the manifest version and the run number, so the
  # version states the release the branch prepares and the build that made it.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the dev version from the manifest version and the run number
        id: version
        run: |
          . .github/scripts/lib.sh
          version="$(manifest_version litespec.manifest.yaml)"
          echo "package_version=$version-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  # The same gates a pull request runs, in the Release configuration. They pack
  # every package this workflow publishes, at the dev version the run names.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      configuration: Release
      package_version: ${{ needs.version.outputs.package_version }}

  publish:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # The checkout cleans the workspace, so it runs before the packages land in it.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the platform-neutral packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Fetch the platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native
          merge-multiple: true

      - name: Set up the .NET SDK
        uses: ./.github/actions/setup-sdk

      # LiteSpec.Cli names one package per platform, and an install that finds it before them
      # fails, so every platform package and the analyzers publish first and LiteSpec.Cli last.
      # The file names carry the dev version, which the run number suffixes.
      - name: Publish the platform packages, the framework-dependent package and LiteSpec.Analyzers
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in native/packages/*.nupkg packages/*.nupkg; do
            if [ "$(basename "$package")" != "LiteSpec.Cli.$PACKAGE_VERSION.nupkg" ]; then
              dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
            fi
          done

      - name: Publish LiteSpec.Cli
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "packages/LiteSpec.Cli.$PACKAGE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
