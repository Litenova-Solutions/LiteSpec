name: Set up Node.js and pnpm
description: Installs the Node.js release that .node-version names and enables the pnpm that the root package.json names. The caller checks out the repository first.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - name: Enable pnpm through corepack
      shell: bash
      run: corepack enable
