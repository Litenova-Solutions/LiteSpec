<svg xmlns="http://www.w3.org/2000/svg" width="390" height="640" viewBox="0 0 390 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img"><rect x="0.5" y="0.5" width="389" height="639" rx="10" fill="#ffffff" stroke="#d0d5dd"/><text x="16" y="29" font-size="13" fill="#667085" text-decoration="underline">Home</text><text x="57.3" y="29" font-size="13" fill="#98a2b3">/</text><text x="73.3" y="29" font-size="13" fill="#667085" text-decoration="underline">Products</text><text x="133.7" y="29" font-size="13" fill="#98a2b3">/</text><text x="149.7" y="29" font-size="13" fill="#344054" font-weight="600">Spring lighting launch</text><text x="16" y="72" font-size="20" fill="#344054" font-weight="600">Spring lighting launch</text><text x="16" y="100" font-size="14" fill="#344054">Sat 14 Mar 2026 at the Amsterdam warehouse. 1,204</text><text x="16" y="120.3" font-size="14" fill="#344054">pre-orders.</text><rect x="16.5" y="138.4" width="135.5" height="33" rx="7" fill="#ffffff" stroke="#d0d5dd"/><text x="30" y="160.9" font-size="14" fill="#344054" font-weight="600">Move the launch</text><rect x="0" y="0" width="390" height="640" rx="10" fill="#101828" fill-opacity="0.38"/><rect x="16" y="101.2" width="358" height="387" rx="12" fill="#ffffff"/><text x="40" y="142.2" font-size="17" fill="#344054" font-weight="600">Cancel the spring lighting launch?</text><text x="338" y="147" font-size="18" fill="#667085">&#215;</text><text x="40" y="175" font-size="14" fill="#344054">1,204 customers pre-ordered and will be told the</text><text x="40" y="195.3" font-size="14" fill="#344054">launch is off.</text><text x="40" y="226.9" font-size="13" fill="#667085">Refunds</text><text x="157.8" y="226.9" font-size="14" fill="#344054">EUR 54,180.00 on the</text><text x="157.8" y="247.2" font-size="14" fill="#344054">payment each customer used</text><text x="40" y="278.8" font-size="14" fill="#344054">Two people on the warehouse plan will be told to</text><text x="40" y="299.1" font-size="14" fill="#344054">stand down.</text><rect x="40" y="316.7" width="310" height="63.9" rx="8" fill="#fee4e2"/><circle cx="58" cy="338.7" r="6" fill="none" stroke="#b42318" stroke-width="1.5"/><text x="74" y="342.7" font-size="14" fill="#b42318">This cannot be undone. A canceled launch</text><text x="74" y="363" font-size="14" fill="#b42318">cannot be scheduled again.</text><text x="40" y="406.6" font-size="14" fill="#175cd3" text-decoration="underline">Move the launch instead of canceling it</text><rect x="59" y="430.7" width="132.8" height="33" rx="7" fill="#ffffff" stroke="#d0d5dd"/><text x="72.5" y="453.2" font-size="14" fill="#344054" font-weight="600">Keep the launch</text><rect x="204.8" y="430.7" width="144.7" height="33" rx="7" fill="#ffffff" stroke="#b42318"/><text x="218.3" y="453.2" font-size="14" fill="#b42318" font-weight="600">Cancel the launch</text></svg>