<svg xmlns="http://www.w3.org/2000/svg" width="390" height="902.3" viewBox="0 0 390 902.3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img"><rect x="0.5" y="0.5" width="389" height="901.3" rx="10" fill="#ffffff" stroke="#d0d5dd"/><text x="16" y="36" font-size="20" fill="#344054" font-weight="600">Good afternoon, Alex</text><text x="16" y="64" font-size="14" fill="#344054">Two things need you today. Dispatch for the Garcia</text><text x="16" y="84.3" font-size="14" fill="#344054">restock starts Saturday.</text><rect x="16.5" y="102.4" width="113.8" height="33" rx="7" fill="#344054" stroke="#344054"/><text x="30" y="124.9" font-size="14" fill="#ffffff" font-weight="600">New delivery</text><text x="16" y="169.9" font-size="16" fill="#344054" font-weight="600">Needs attention</text><rect x="16" y="188.3" width="56.8" height="22" rx="11" fill="#fef0c7"/><text x="25" y="204.3" font-size="12" fill="#93370d" font-weight="600">2 to do</text><text x="16" y="258.5" font-size="14" fill="#344054">Close out the</text><text x="16" y="278.8" font-size="14" fill="#344054">Becker restock</text><text x="149.8" y="248.3" font-size="14" fill="#667085">The delivery is</text><text x="149.8" y="268.6" font-size="14" fill="#667085">complete. Nothing</text><text x="149.8" y="288.9" font-size="14" fill="#667085">left to settle.</text><rect x="284" y="247.9" width="89.5" height="33" rx="7" fill="#ffffff" stroke="#d0d5dd"/><text x="297.5" y="270.4" font-size="14" fill="#344054" font-weight="600">Close out</text><rect x="16" y="312" width="358" height="1" fill="#eaecf0"/><text x="16" y="342.6" font-size="14" fill="#344054" opacity="0.6">Close out the</text><text x="16" y="363" font-size="14" fill="#344054" opacity="0.6">Becker restock</text><text x="149.8" y="332.5" font-size="14" fill="#667085" opacity="0.6">The delivery is</text><text x="149.8" y="352.8" font-size="14" fill="#667085" opacity="0.6">complete. Nothing</text><text x="149.8" y="373.1" font-size="14" fill="#667085" opacity="0.6">left to settle.</text><rect x="284" y="332.1" width="89.5" height="33" rx="7" fill="#ffffff" stroke="#d0d5dd" opacity="0.6"/><text x="297.5" y="354.6" font-size="14" fill="#344054" font-weight="600" opacity="0.6">Close out</text><text x="16" y="412.7" font-size="16" fill="#344054" font-weight="600">Coming up</text><text x="16" y="457.1" font-size="14" fill="#344054">Garcia</text><text x="16" y="477.4" font-size="14" fill="#344054">Interiors</text><text x="16" y="497.7" font-size="14" fill="#344054">restock</text><text x="102.6" y="457.1" font-size="14" fill="#667085">Sat 14 Mar</text><text x="102.6" y="477.4" font-size="14" fill="#667085">2026, 08:00</text><text x="102.6" y="497.7" font-size="14" fill="#667085">to 12:00</text><rect x="189.3" y="462.2" width="54.6" height="22" rx="11" fill="#dcfae6"/><text x="198.3" y="478.2" font-size="12" fill="#067647" font-weight="600">Active</text><rect x="256.4" y="456.7" width="117.1" height="33" rx="7" fill="#ffffff" stroke="#d0d5dd"/><text x="269.9" y="479.2" font-size="14" fill="#344054" font-weight="600">Open delivery</text><rect x="16" y="520.8" width="358" height="1" fill="#eaecf0"/><text x="16" y="541.3" font-size="14" fill="#344054" opacity="0.6">Garcia</text><text x="16" y="561.6" font-size="14" fill="#344054" opacity="0.6">Interiors</text><text x="16" y="581.9" font-size="14" fill="#344054" opacity="0.6">restock</text><text x="102.6" y="541.3" font-size="14" fill="#667085" opacity="0.6">Sat 14 Mar</text><text x="102.6" y="561.6" font-size="14" fill="#667085" opacity="0.6">2026, 08:00</text><text x="102.6" y="581.9" font-size="14" fill="#667085" opacity="0.6">to 12:00</text><rect x="189.3" y="546.4" width="54.6" height="22" rx="11" fill="#dcfae6" opacity="0.6"/><text x="198.3" y="562.4" font-size="12" fill="#067647" font-weight="600" opacity="0.6">Active</text><rect x="256.4" y="540.9" width="117.1" height="33" rx="7" fill="#ffffff" stroke="#d0d5dd" opacity="0.6"/><text x="269.9" y="563.4