<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img"><rect x="0.5" y="0.5" width="1199" height="559" rx="10" fill="#ffffff" stroke="#d0d5dd"/><text x="28" y="41" font-size="13" fill="#667085" text-decoration="underline">Home</text><text x="69.3" y="41" font-size="13" fill="#98a2b3">/</text><text x="85.3" y="41" font-size="13" fill="#667085" text-decoration="underline">Products</text><text x="145.7" y="41" font-size="13" fill="#98a2b3">/</text><text x="161.7" y="41" font-size="13" fill="#344054" font-weight="600">Spring lighting launch</text><rect x="1036" y="64.5" width="135.5" height="33" rx="7" fill="#ffffff" stroke="#d0d5dd"/><text x="1049.5" y="87" font-size="14" fill="#344054" font-weight="600">Move the launch</text><text x="28" y="86" font-size="22" fill="#344054" font-weight="600">Spring lighting launch</text><text x="28" y="114.8" font-size="14" fill="#344054">Sat 14 Mar 2026 at the Amsterdam warehouse. 1,204 pre-orders.</text><rect x="0" y="0" width="1200" height="560" rx="10" fill="#101828" fill-opacity="0.38"/><rect x="340" y="85.4" width="520" height="346.4" rx="12" fill="#ffffff"/><text x="364" y="126.4" font-size="17" fill="#344054" font-weight="600">Cancel the spring lighting launch?</text><text x="824" y="131.2" font-size="18" fill="#667085">&#215;</text><text x="364" y="159.2" font-size="14" fill="#344054">1,204 customers pre-ordered and will be told the launch is off.</text><text x="364" y="190.8" font-size="13" fill="#667085">Refunds</text><text x="543.4" y="190.8" font-size="14" fill="#344054">EUR 54,180.00 on the payment each customer</text><text x="543.4" y="211.1" font-size="14" fill="#344054">used</text><text x="364" y="242.7" font-size="14" fill="#344054">Two people on the warehouse plan will be told to stand down.</text><rect x="364" y="260.3" width="472" height="63.9" rx="8" fill="#fee4e2"/><circle cx="382" cy="282.3" r="6" fill="none" stroke="#b42318" stroke-width="1.5"/><text x="398" y="286.3" font-size="14" fill="#b42318">This cannot be undone. A canceled launch cannot be scheduled</text><text x="398" y="306.6" font-size="14" fill="#b42318">again.</text><text x="364" y="350.2" font-size="14" fill="#175cd3" text-decoration="underline">Move the launch instead of canceling it</text><rect x="545" y="374.3" width="132.8" height="33" rx="7" fill="#ffffff" stroke="#d0d5dd"/><text x="558.5" y="396.8" font-size="14" fill="#344054" font-weight="600">Keep the launch</text><rect x="690.8" y="374.3" width="144.7" height="33" rx="7" fill="#ffffff" stroke="#b42318"/><text x="704.3" y="396.8" font-size="14" fill="#b42318" font-weight="600">Cancel the launch</text></svg>