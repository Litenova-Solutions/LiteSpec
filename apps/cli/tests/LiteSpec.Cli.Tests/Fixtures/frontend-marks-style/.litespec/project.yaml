# yaml-language-server: $schema=https://litespec.dev/5.3.0/schemas/litespec-project.schema.yaml
schemaVersion: 1
project:
  name: Frontend Marks Fixture
size: small
shape: server
stacks:
- dotnet
- svelte
marks: attribute
layers:
  intent: litespec
  behavior: litespec
  implementation: litespec
  proof: litespec
reviewedLiteSpecVersion: 5.3.0
paths:
  docs: .litespec
  behaviorDocs: .litespec/behavior
  glossary: .litespec/glossary.yaml
  testRoots:
  - apps/api/tests
stackConfig:
  dotnet:
    modules: apps/api/src/Library.Application
    domain: apps/api/src/Library.Domain
    webapi:
    - apps/api/src/Library.WebApi
    infrastructure: apps/api/src/Library.Infrastructure
frontends:
- name: web
  path: apps/web
  platform: svelte
