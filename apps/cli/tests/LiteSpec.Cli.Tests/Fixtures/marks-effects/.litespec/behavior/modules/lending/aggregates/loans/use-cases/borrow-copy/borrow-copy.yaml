type: use-case
id: use-case/lending.borrow-copy
title: Borrow copy
kind: command
steps:
  - statement: The reader sends the copy to borrow.
  - statement: Lending lends the copy and raises the borrowed event.
effects:
  - sends: notification/lending.loan-due
    timing: async
records:
  - type: result
    id: result/borrow-copy.borrowed
    title: Borrowed
    outcome: success
    meaning: The copy is lent.
