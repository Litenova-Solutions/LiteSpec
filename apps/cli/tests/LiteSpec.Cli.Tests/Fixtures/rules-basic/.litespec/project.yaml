# yaml-language-server: $schema=https://litespec.dev/5.1.0/schemas/litespec-project.schema.yaml
schemaVersion: 1
project:
  name: Demo
size: large
shape: server
stacks:
- dotnet
- svelte
layers:
  intent: litespec
  behavior: litespec
  implementation: litespec
  proof: litespec
reviewedLiteSpecVersion: 5.1.0
paths:
  docs: .litespec
  behaviorDocs: .litespec/behavior
  glossary: .litespec/glossary.yaml
  testRoots:
  - apps/api/tests
stackConfig:
  dotnet:
    modules: apps/api/src/Demo
frontends:
- name: web
  path: apps/web
  platform: svelte
  entryPoint: entry-point/billing-app
selectedExtensions: []
