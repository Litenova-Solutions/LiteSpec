type: use-case
id: use-case/lending.retire-copy
title: Retire copy
kind: command
access:
  grant: permission/manage-copies
  tenant: own
fulfills:
- requirement/borrowing.copy-shelf-home
via:
- entry-point/library-app
raises:
- domain-event/copy.copy-retired
idempotency:
  mode: none
  reason: Each call retires its own copy, and retiring a copy on loan is refused.
audit:
  exemptBecause: Internal state transition covered by its aggregate lifecycle.
steps:
- statement: The librarian retires the copy from lending.
results:
- id: result/retire-copy.retired
  title: Retired
  outcome: success
  meaning: The copy is retired.
- id: result/retire-copy.copy-on-loan
  title: Copy on loan
  outcome: refusal
  refusal: refusal/lending.copy-on-loan
