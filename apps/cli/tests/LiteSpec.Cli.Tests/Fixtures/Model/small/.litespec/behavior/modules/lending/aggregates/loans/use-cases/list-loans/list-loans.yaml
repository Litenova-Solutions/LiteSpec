type: use-case
id: use-case/lending.list-loans
title: List loans
kind: query
access:
  grant: permission/read-loans
  tenant: own
fulfills:
- requirement/borrowing.max-active-loans
reachedThrough:
- entry-point/library-app
raises: []
output:
  include:
    rows:
      fields:
      - name: loans
        type: list
        meaning: "One row per loan: its identity, copy, reader, and due date."
        of:
          fields:
          - name: loan
            type: id
            of: aggregate/lending.loan
            required: true
            meaning: The loan identity.
          - name: copy
            type: id
            of: aggregate/lending.copy
            required: true
            meaning: The copy on loan.
          - name: reader
            type: text
            required: true
            meaning: The reader holding the copy.
          - name: dueDate
            type: date
            required: true
            meaning: The day the loan is due.
      classification: internal
      reads:
      - aggregate/lending.loan
      freshness:
        mode: immediate
paging:
  mode: pages
  order: Due date, earliest first.
  cursor: The due date and loan identity of the last row.
  defaultLimit: 25
  maxLimit: 100
records:
- type: result
  id: result/list-loans.listed
  title: Listed
  outcome: success
  meaning: The loans are listed.
