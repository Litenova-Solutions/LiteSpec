type: aggregate
id: aggregate/lending.loan
title: Loan
states:
  - name: Active
    meaning: The loan is open.
  - name: Returned
    meaning: The copy came back.
  - name: Overdue
    meaning: The loan passed its due date.
transitions:
  - from: "-"
    to: Active
    by: use-case/lending.borrow-copy
  - from: Active
    to: Overdue
  - from: Active
    to: Returned
    by: use-case/lending.return-copy
  - from: Overdue
    to: Returned
    by: use-case/lending.return-copy
records:
  - type: rule
    id: rule/loan.has-one-borrower
    title: Has one borrower
    kind: invariant
    statement: A loan has one borrower.
    governs:
      - use-case/lending.borrow-copy
    refusal: result/borrow-copy.copy-unavailable
    basedOn: []
    fulfills:
      - requirement/borrowing.max-active-loans
  - type: rule
    id: rule/loan.borrowed-copy-never-leaves-unscanned
    title: Borrowed copy never leaves unscanned
    kind: precondition
    statement: A borrowed copy never leaves unscanned.
    governs:
      - use-case/lending.borrow-copy
    basedOn: []
    fulfills:
      - requirement/borrowing.loan-period-days
  - type: rule
    id: rule/loan.extended-before-due
    title: Extended before due
    kind: precondition
    statement: A loan extends only before its due date.
    governs:
      - use-case/lending.extend-loan
    refusal: result/extend-loan.extension-refused
    basedOn: []
    fulfills:
      - requirement/borrowing.loan-period-days
  - type: rule
    id: rule/loan.returned-while-active
    title: Returned while active
    kind: precondition
    statement: A loan returns only while active.
    governs:
      - use-case/lending.return-copy
    refusal: result/return-copy.loan-inactive
    basedOn: []
    fulfills:
      - requirement/borrowing.loan-period-days
  - type: event
    id: event/loan.loan-borrowed
    title: Loan borrowed
    meaning: A copy was lent.
    carries:
      - loanId
      - copyId
      - readerId
      - dueDate
  - type: event
    id: event/loan.loan-returned
    title: Loan returned
    meaning: A copy was returned.
    carries:
      - loanId
      - returnedAt
  - type: event
    id: event/loan.loan-extended
    title: Loan extended
    meaning: A loan was extended.
    carries:
      - loanId
      - newDueDate
