type: use-case
id: use-case/lending.register-copy
title: Register copy
kind: command
access:
  grant: permission/manage-copies
  tenant: own
fulfills:
- requirement/borrowing.copy-shelf-home
reachedThrough:
- entry-point/library-app
raises:
- event/copy.copy-registered
idempotency:
  mode: none
  reason: Each call registers its own copy, and registering the same barcode twice is refused.
audit:
  level: none
  target: No audit trail; the copy record shows each registration.
records:
- type: result
  id: result/register-copy.registered
  title: Registered
  outcome: success
  meaning: The copy is registered.
- type: result
  id: result/register-copy.copy-already-registered
  title: Copy already registered
  outcome: refusal
  code: lending.copy-already-registered
  meaning: The copy is already registered.
