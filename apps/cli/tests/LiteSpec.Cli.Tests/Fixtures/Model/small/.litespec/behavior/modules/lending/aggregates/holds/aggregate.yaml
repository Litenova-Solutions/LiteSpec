type: aggregate
id: aggregate/lending.hold
title: Hold
kind: entity
states:
- name: Waiting
  meaning: The hold waits for its copy.
- name: Ready
  meaning: The copy waits on the pickup shelf.
- name: Canceled
  meaning: The reader gave up the hold.
transitions:
- from: "-"
  to: Waiting
  by: use-case/lending.place-hold
- from: Waiting
  to: Ready
- from: Waiting
  to: Canceled
  by: use-case/lending.cancel-hold
- from: Ready
  to: Canceled
  by: use-case/lending.cancel-hold
records:
- type: event
  id: event/hold.hold-placed
  title: Hold placed
  meaning: A hold was placed.
  carries:
  - holdId
  - copyId
  - readerId
- type: event
  id: event/hold.hold-canceled
  title: Hold canceled
  meaning: A hold was canceled.
  carries:
  - holdId
