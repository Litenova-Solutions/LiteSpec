type: aggregate
id: aggregate/lending.hold
title: Hold
states:
- name: Waiting
  meaning: The hold waits for its copy.
- name: Ready
  meaning: The copy waits on the pickup shelf.
- name: Canceled
  meaning: The reader gave up the hold.
transitions:
- from: "-"
  to: Waiting
  movedBy: use-case/lending.place-hold
- from: Waiting
  to: Ready
- from: Waiting
  to: Canceled
  movedBy: use-case/lending.cancel-hold
- from: Ready
  to: Canceled
  movedBy: use-case/lending.cancel-hold
records:
- type: domain-event
  id: domain-event/hold.hold-placed
  title: Hold placed
  meaning: A hold was placed.
  carries:
  - name: holdId
    type: text
  - name: copyId
    type: text
  - name: readerId
    type: text
- type: domain-event
  id: domain-event/hold.hold-canceled
  title: Hold canceled
  meaning: A hold was canceled.
  carries:
  - name: holdId
    type: text
