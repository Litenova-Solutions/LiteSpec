type: use-case
id: use-case/lending.borrow-copy
title: Borrow copy
exposure: A signed-in reader reaches this command through the library app under the borrow-copy permission. A wrong lending hands a copy to a reader already past the loan limit.
kind: command
access:
  grant: permission/borrow-copy
  tenant: own
fulfills:
- requirement/borrowing.max-active-loans
reachedThrough:
- entry-point/library-app
raises:
- domain-event/loan.loan-borrowed
idempotency:
  mode: none
  reason: Each call lends its own copy, and lending an unavailable copy is refused.
records:
- type: result
  id: result/borrow-copy.borrowed
  title: Borrowed
  outcome: success
  meaning: The copy is lent.
- type: result
  id: result/borrow-copy.copy-unavailable
  title: Copy unavailable
  outcome: refusal
  code: lending.copy-not-available
