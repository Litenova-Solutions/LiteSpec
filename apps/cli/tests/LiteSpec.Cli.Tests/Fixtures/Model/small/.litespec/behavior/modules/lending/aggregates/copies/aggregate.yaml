type: aggregate
id: aggregate/lending.copy
title: Copy
states:
- name: Available
  meaning: The copy sits on its shelf.
- name: OnLoan
  meaning: A reader holds the copy.
- name: Retired
  meaning: The copy left lending.
transitions:
- from: "-"
  to: Available
  movedBy: use-case/lending.register-copy
- from: Available
  to: OnLoan
- from: OnLoan
  to: Available
- from: Available
  to: Retired
  movedBy: use-case/lending.retire-copy
records:
- type: domain-event
  id: domain-event/copy.copy-registered
  title: Copy registered
  meaning: A copy was registered.
  carries:
  - name: copyId
    type: text
  - name: shelf
    type: text
- type: domain-event
  id: domain-event/copy.copy-retired
  title: Copy retired
  meaning: A copy was retired.
  carries:
  - name: copyId
    type: text
