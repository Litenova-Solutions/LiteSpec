type: aggregate
id: aggregate/lending.copy
title: Copy
kind: entity
states:
- name: Available
  meaning: The copy sits on its shelf.
- name: OnLoan
  meaning: A reader holds the copy.
- name: Retired
  meaning: The copy left lending.
transitions:
- from: "-"
  to: Available
  by: use-case/lending.register-copy
- from: Available
  to: OnLoan
- from: OnLoan
  to: Available
- from: Available
  to: Retired
  by: use-case/lending.retire-copy
records:
- type: event
  id: event/copy.copy-registered
  title: Copy registered
  meaning: A copy was registered.
  carries:
  - copyId
  - shelf
- type: event
  id: event/copy.copy-retired
  title: Copy retired
  meaning: A copy was retired.
  carries:
  - copyId
