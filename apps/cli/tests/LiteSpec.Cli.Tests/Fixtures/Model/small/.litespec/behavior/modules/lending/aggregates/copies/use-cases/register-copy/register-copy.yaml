type: use-case
id: use-case/lending.register-copy
title: Register copy
kind: command
access:
  grant: permission/manage-copies
  tenant: own
fulfills:
- requirement/borrowing.copy-shelf-home
via:
- entry-point/library-app
raises:
- domain-event/copy.copy-registered
inputs:
- name: copyId
  meaning: The identity of the copy the librarian registers.
  type: id
  identifies: aggregate/lending.copy
  required: true
  origin: caller
  classification: internal
- name: shelf
  meaning: The home shelf where the copy belongs.
  type: text
  required: true
  origin: caller
  classification: internal
idempotency:
  mode: none
  reason: Each call registers its own copy, and registering the same barcode twice is refused.
audit:
  exemptBecause: Internal state transition covered by its aggregate lifecycle.
steps:
- statement: The librarian registers the copy on its home shelf.
results:
- id: result/register-copy.registered
  title: Registered
  outcome: success
  meaning: The copy is registered.
- id: result/register-copy.copy-already-registered
  title: Copy already registered
  outcome: refusal
  refusal: refusal/lending.copy-already-registered
