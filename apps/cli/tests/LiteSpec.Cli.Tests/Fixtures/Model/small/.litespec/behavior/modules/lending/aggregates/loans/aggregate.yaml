type: aggregate
id: aggregate/lending.loan
title: Loan
states:
- name: Active
  meaning: The loan is open.
- name: Returned
  meaning: The copy came back.
- name: Overdue
  meaning: The loan passed its due date.
transitions:
- from: "-"
  to: Active
  movedBy: use-case/lending.borrow-copy
- from: Active
  to: Overdue
- from: Active
  to: Returned
  movedBy: use-case/lending.return-copy
- from: Overdue
  to: Returned
  movedBy: use-case/lending.return-copy
records:
- type: domain-event
  id: domain-event/loan.loan-borrowed
  title: Loan borrowed
  meaning: A copy was lent.
  carries:
  - name: loanId
    type: text
  - name: copyId
    type: text
  - name: readerId
    type: text
  - name: dueDate
    type: text
- type: domain-event
  id: domain-event/loan.loan-returned
  title: Loan returned
  meaning: A copy was returned.
  carries:
  - name: loanId
    type: text
  - name: returnedAt
    type: text
- type: domain-event
  id: domain-event/loan.loan-extended
  title: Loan extended
  meaning: A loan was extended.
  carries:
  - name: loanId
    type: text
  - name: newDueDate
    type: text
