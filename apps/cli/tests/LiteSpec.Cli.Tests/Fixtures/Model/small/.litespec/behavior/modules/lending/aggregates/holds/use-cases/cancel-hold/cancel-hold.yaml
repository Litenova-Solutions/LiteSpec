type: use-case
id: use-case/lending.cancel-hold
title: Cancel hold
kind: command
access:
  grant: permission/place-hold
  tenant: own
fulfills:
- requirement/borrowing.hold-pickup-window
via:
- entry-point/library-app
raises:
- domain-event/hold.hold-canceled
inputs:
- name: holdId
  meaning: The waiting hold the reader cancels.
  type: id
  identifies: aggregate/lending.hold
  required: true
  origin: caller
  classification: internal
idempotency:
  mode: none
  reason: Each call cancels its own hold, and canceling an ended hold is refused.
audit:
  exemptBecause: Internal state transition covered by its aggregate lifecycle.
steps:
- statement: The reader cancels the waiting hold.
results:
- id: result/cancel-hold.canceled
  title: Canceled
  outcome: success
  meaning: The hold is canceled.
- id: result/cancel-hold.hold-ended
  title: Hold ended
  outcome: refusal
  refusal: refusal/lending.hold-not-waiting
