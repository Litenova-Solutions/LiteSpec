type: use-case
id: use-case/lending.borrow-copy
title: Borrow Copy
kind: command
access:
  grant: permission/borrow-copy
  tenant: own
input:
- name: copyId
  meaning: The copy the reader borrows.
  type: id
  identifies: aggregate/lending.copy
  required: true
  origin: caller
  binding: body
  classification: internal
- name: readerId
  meaning: The reader borrowing the copy.
  type: id
  identifies: actor/reader
  required: true
  origin: caller
  binding: body
  classification: personal
idempotency:
  mode: key
  key: "{copyId}-for-{readerId}"
  keyScope: tenant
  replay: returns-first-result
audit:
  level: required
  category: personal-data-read
  target: copyId
  targetKind: aggregate/lending.copy
steps:
- statement: The reader borrows the copy from the shelf.
