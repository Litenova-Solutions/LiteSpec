type: use-case
id: use-case/lending.renew-loan
title: Renew Loan
kind: command
access:
  grant: permission/borrow-copy
  tenant: own
  scope: self
  identityInput: readerId
  recentSignIn: PT30M
  runsAs: system
  preconditions:
  - rule/loan.within-limit
input:
- name: loanId
  meaning: The loan the reader renews.
  type: id
  identifies: aggregate/lending.loan
  required: true
  origin: caller
  binding: body
  classification: internal
- name: readerId
  meaning: The signed-in reader renewing the loan, read from verified claims.
  type: id
  identifies: actor/reader
  required: false
  origin: verified-claim
  verifiedBy: entry-point/library-app
  binding: claim
  classification: personal
idempotency:
  mode: none
  reason: Each call renews its own loan, and renewing past the loan limit is refused.
audit:
  exemptBecause: Renewals trail in the loan states.
steps:
- statement: The reader renews the loan.
