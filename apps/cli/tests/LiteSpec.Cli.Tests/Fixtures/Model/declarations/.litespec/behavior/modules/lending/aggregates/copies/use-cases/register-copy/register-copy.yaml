type: use-case
id: use-case/lending.register-copy
title: Register Copy
kind: command
access:
  grant: anonymous
  tenant: own
input:
- name: copyId
  meaning: The copy the desk registers.
  type: id
  identifies: aggregate/lending.copy
  required: true
  origin: caller
  binding: body
  classification: internal
- name: shelf
  meaning: The home shelf the copy is filed under.
  type: text
  required: true
  origin: caller
  binding: body
  classification: internal
idempotency:
  mode: none
  reason: Each call registers its own copy, and registering the same barcode twice is refused.
audit:
  exemptBecause: Copies trail in the catalog states.
steps:
- statement: The desk registers the copy.
