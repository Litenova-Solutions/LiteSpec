type: use-case
id: use-case/lending.renew-loan
title: Renew loan
kind: command
access:
  grant: permission/borrow-copy
  tenant: own
serves:
  - journey/borrow-and-return#s2
fulfills:
  - requirement/borrowing.max-active-loans
reachedThrough:
  - entry-point/library-app
raises: []
records:
  - type: result
    id: result/renew-loan.renewed
    title: Renewed
    outcome: success
    meaning: The loan is renewed.
  - type: scenario
    id: scenario/renew-loan.renewing-an-active-loan-succeeds
    title: Renewing an active loan succeeds
    given: A reader holds an active loan.
    when: The reader renews the loan.
    then: The loan is renewed.
    result: result/renew-loan.renewed
