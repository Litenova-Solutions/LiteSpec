type: permission-list
title: Permissions
records:
  - type: permission
    id: permission/borrow-copy
    title: Borrow copy
    meaning: Borrow an available copy.
    scope: self
  - type: permission
    id: permission/read-loans
    title: Read loans
    meaning: Read own loans.
    scope: self
  - type: permission
    id: permission/manage-copies
    title: Manage copies
    meaning: Register and retire copies.
    scope: platform
  - type: permission
    id: permission/place-hold
    title: Place hold
    meaning: Place and cancel holds.
    scope: self
  - type: permission
    id: permission/ghost-read
    title: Ghost read
    meaning: Read ghost copies in ghost queues.
    scope: self
