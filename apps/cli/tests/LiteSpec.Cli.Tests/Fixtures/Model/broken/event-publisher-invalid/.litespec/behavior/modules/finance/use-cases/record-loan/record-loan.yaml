type: use-case
id: use-case/finance.record-loan
title: Record loan
kind: command
steps:
  - statement: Finance sends the loan to record.
  - statement: Finance records the loan for the ledger.
access:
  grant: permission/borrow-copy
  tenant: own
via:
  - entry-point/library-app
raises:
  - domain-event/loan.loan-borrowed
idempotency:
  mode: none
  reason: Each call records its own loan.
results:
  - id: result/record-loan.recorded
    title: Recorded
    outcome: success
    meaning: The loan is recorded.
