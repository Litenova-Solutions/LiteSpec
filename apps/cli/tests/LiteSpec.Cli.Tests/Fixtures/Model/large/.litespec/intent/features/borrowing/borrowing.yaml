type: feature
id: feature/borrowing
title: Borrowing
offering: Readers borrow and return copies and place holds, and every copy keeps one home shelf.
solves:
- problem/overdue-loans-pile-up
successCriteria:
- Every copy keeps one home shelf.
- A reader holds at most five active loans.
- A loan lasts 21 days.
- A ready hold waits seven days.
excludes:
- Borrowing buys no books and catalogs no titles.
