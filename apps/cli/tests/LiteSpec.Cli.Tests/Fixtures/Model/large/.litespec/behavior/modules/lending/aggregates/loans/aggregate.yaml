type: aggregate
id: aggregate/lending.loan
title: Loan
states:
- name: Active
  meaning: The loan is open.
- name: Returned
  meaning: The copy came back.
- name: Overdue
  meaning: The loan passed its due date.
transitions:
- from: "-"
  to: Active
  movedBy: use-case/lending.borrow-copy
- from: Active
  to: Overdue
- from: Active
  to: Returned
  movedBy: use-case/lending.return-copy
- from: Overdue
  to: Returned
  movedBy: use-case/lending.return-copy
data:
- name: borrower-email
  meaning: The address overdue notices go to.
  classification: personal
  dataClass: Borrower identity
dataClasses:
- name: Borrower identity
  classification: personal
  fields:
  - borrower-email
  onErasure: erase
  basis:
  - requirement/borrowing.loan-period-days
  purpose: Send overdue notices to readers.
  period: P30D
  periodStartsAt: domain-event/loan.loan-returned
  enforcedBy:
  - job/lending.nightly-due-scan
