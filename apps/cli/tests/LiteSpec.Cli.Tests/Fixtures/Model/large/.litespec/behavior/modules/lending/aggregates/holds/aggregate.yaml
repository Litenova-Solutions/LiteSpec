type: aggregate
id: aggregate/lending.hold
title: Hold
states:
- name: Waiting
  meaning: The hold waits for its copy.
- name: Ready
  meaning: The copy waits on the pickup shelf.
- name: Canceled
  meaning: The reader gave up the hold.
transitions:
- from: "-"
  to: Waiting
  movedBy: use-case/lending.place-hold
- from: Waiting
  to: Ready
- from: Waiting
  to: Canceled
  movedBy: use-case/lending.cancel-hold
- from: Ready
  to: Canceled
  movedBy: use-case/lending.cancel-hold
