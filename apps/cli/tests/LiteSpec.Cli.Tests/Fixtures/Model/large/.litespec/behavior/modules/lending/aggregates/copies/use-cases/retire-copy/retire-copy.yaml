type: use-case
id: use-case/lending.retire-copy
title: Retire copy
kind: command
access:
  grant: permission/manage-copies
  tenant: own
serves:
- step/borrow-and-return.retire-copy
fulfills:
- requirement/borrowing.copy-shelf-home
via:
- entry-point/library-app
raises:
- domain-event/copy.copy-retired
idempotency:
  mode: none
  reason: Each call retires its own copy, and retiring a copy on loan is refused.
audit:
  exemptBecause: Internal state transition covered by its aggregate lifecycle.
steps:
- statement: The librarian retires the copy from lending.
results:
- id: result/retire-copy.retired
  title: Retired
  outcome: success
  meaning: The copy is retired.
- id: result/retire-copy.copy-on-loan
  title: Copy on loan
  outcome: refusal
  refusal: refusal/lending.copy-on-loan
  message: This copy is on loan, so it cannot be retired until it is returned.
scenarios:
- id: scenario/retire-copy.retiring-an-available-copy-succeeds
  title: Retiring an available copy succeeds
  given: A copy sits available past weeding.
  when: The librarian retires the copy.
  then: The copy is retired.
  result: result/retire-copy.retired
- id: scenario/retire-copy.retiring-copy-on-loan-refused
  title: Retiring a copy on loan is refused
  given: A reader holds a copy on loan.
  when: The librarian retires the copy.
  then: The retirement is refused because the copy is on loan.
  result: result/retire-copy.copy-on-loan
