type: screen
id: screen/library-app.loans
title: Loans
summary: A reader can register, borrow, extend, list, return and hold copies, and a librarian can retire a copy.
route: /
task: The reader borrows, extends, lists and returns copies and places holds, and the librarian registers and retires copies.
states:
- name: Empty
  shows: The screen says no loan is active and points to borrowing.
- name: Loading
  shows: The rows show as placeholders while the loans load.
- name: Failed
  shows: The screen says the loans are unavailable and offers to try again.
offers:
- use-case/lending.register-copy
- use-case/lending.borrow-copy
- use-case/lending.extend-loan
- use-case/lending.list-loans
- use-case/lending.return-copy
- use-case/lending.place-hold
- use-case/lending.cancel-hold
- use-case/lending.retire-copy
serves:
- flow/borrow-and-return#s1
- flow/borrow-and-return#s2
- flow/borrow-and-return#s3
- flow/borrow-and-return#s4
- flow/borrow-and-return#s5
- flow/borrow-and-return#s6
- flow/borrow-and-return#s7
- flow/borrow-and-return#s8
