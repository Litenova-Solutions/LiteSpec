type: use-case
id: use-case/lending.extend-loan
title: Extend loan
exposure: A signed-in reader reaches this command through the library app under the borrow-copy permission. A wrong extension keeps a copy past its due date.
kind: command
access:
  grant: permission/borrow-copy
  tenant: own
serves:
- flow/borrow-and-return#s3
fulfills:
- requirement/borrowing.loan-period-days
reachedThrough:
- entry-point/library-app
raises:
- domain-event/loan.loan-extended
steps:
- statement: The reader extends the loan before its due date.
idempotency:
  mode: none
  reason: Each call extends its own loan, and extending past the due date is refused.
records:
- type: result
  id: result/extend-loan.extended
  title: Extended
  outcome: success
  meaning: The loan is extended.
- type: result
  id: result/extend-loan.extension-refused
  title: Extension refused
  outcome: refusal
  code: lending.extension-refused
- type: scenario
  id: scenario/extend-loan.extending-an-active-loan-succeeds
  title: Extending an active loan succeeds
  given: A reader holds an active loan.
  when: The reader extends the loan.
  then: The loan is extended.
  result: result/extend-loan.extended
- type: scenario
  id: scenario/extend-loan.extending-loan-past-due-refused
  title: Extending a loan past its due date is refused
  given: A loan passed its due date.
  when: The reader extends the loan.
  then: The extension is refused.
  result: result/extend-loan.extension-refused
  exercises:
  - rule/loan.extended-before-due
