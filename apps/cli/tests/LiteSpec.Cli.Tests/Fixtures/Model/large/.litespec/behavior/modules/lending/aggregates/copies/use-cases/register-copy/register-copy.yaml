type: use-case
id: use-case/lending.register-copy
title: Register copy
kind: command
access:
  grant: permission/manage-copies
  tenant: own
serves:
- step/borrow-and-return.register-copy
fulfills:
- requirement/borrowing.copy-shelf-home
via:
- entry-point/library-app
raises:
- domain-event/copy.copy-registered
inputs:
- name: copyId
  meaning: The identity of the copy the librarian registers.
  type: id
  identifies: aggregate/lending.copy
  required: true
  origin: caller
  classification: internal
- name: shelf
  meaning: The home shelf where the copy belongs.
  type: text
  required: true
  origin: caller
  classification: internal
idempotency:
  mode: none
  reason: Each call registers its own copy, and registering the same barcode twice is refused.
audit:
  exemptBecause: Internal state transition covered by its aggregate lifecycle.
steps:
- statement: The librarian registers the copy on its home shelf.
results:
- id: result/register-copy.registered
  title: Registered
  outcome: success
  meaning: The copy is registered.
- id: result/register-copy.copy-already-registered
  title: Copy already registered
  outcome: refusal
  refusal: refusal/lending.copy-already-registered
  message: This copy is already registered, so it cannot be registered again.
scenarios:
- id: scenario/register-copy.registering-a-new-copy-succeeds
  title: Registering a new copy succeeds
  given: A new copy arrives at the desk.
  when: The librarian registers the copy.
  then: The copy is registered.
  result: result/register-copy.registered
- id: scenario/register-copy.registering-an-existing-copy-is-refused
  title: Registering an existing copy is refused
  given: A copy stands registered on its shelf.
  when: The librarian registers the copy again.
  then: The registration is refused because the copy is already registered.
  result: result/register-copy.copy-already-registered
