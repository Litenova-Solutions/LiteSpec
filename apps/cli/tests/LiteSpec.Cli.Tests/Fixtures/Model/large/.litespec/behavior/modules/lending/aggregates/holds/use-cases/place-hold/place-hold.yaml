type: use-case
id: use-case/lending.place-hold
title: Place hold
exposure: A signed-in reader reaches this command through the library app under the place-hold permission. A wrong hold blocks the copy for other readers.
kind: command
access:
  grant: permission/place-hold
  tenant: own
serves:
- step/borrow-and-return.place-hold
fulfills:
- requirement/borrowing.hold-pickup-window
reachedThrough:
- entry-point/library-app
raises:
- domain-event/hold.hold-placed
steps:
- statement: The reader places a hold on the copy.
idempotency:
  mode: none
  reason: Each call places its own hold, and placing a duplicate hold is refused.
records:
- type: result
  id: result/place-hold.placed
  title: Placed
  outcome: success
  meaning: The hold is placed.
- type: result
  id: result/place-hold.hold-already-waiting
  title: Hold already waiting
  outcome: refusal
  refusal: refusal/lending.hold-already-waiting
- type: scenario
  id: scenario/place-hold.placing-a-hold-succeeds
  title: Placing a hold succeeds
  given: A copy is on loan to another reader.
  when: The reader places a hold.
  then: The hold is placed.
  result: result/place-hold.placed
- type: scenario
  id: scenario/place-hold.placing-a-duplicate-hold-is-refused
  title: Placing a duplicate hold is refused
  given: A hold already waits for the reader's copy.
  when: The reader places another hold.
  then: The placement is refused because a hold is already waiting.
  result: result/place-hold.hold-already-waiting
  exercises:
  - rule/hold.names-one-copy
