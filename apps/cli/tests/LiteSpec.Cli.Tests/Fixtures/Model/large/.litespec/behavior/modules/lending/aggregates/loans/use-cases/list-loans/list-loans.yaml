type: use-case
id: use-case/lending.list-loans
title: List loans
exposure: A signed-in reader reaches this query through the library app under the read-loans permission. The list shows only that reader's own loans, so a wrong filter would show another reader's loans.
kind: query
access:
  grant: permission/read-loans
  tenant: own
serves:
- step/borrow-and-return.review-loans
fulfills:
- requirement/borrowing.max-active-loans
reachedThrough:
- entry-point/library-app
raises: []
output:
  include:
    rows:
      fields:
      - name: loans
        type: list
        meaning: "One row per loan: its identity, copy, reader, and due date."
        identifies:
          fields:
          - name: loan
            type: id
            identifies: aggregate/lending.loan
            required: true
            meaning: The loan identity.
          - name: copy
            type: id
            identifies: aggregate/lending.copy
            required: true
            meaning: The copy on loan.
          - name: reader
            type: text
            required: true
            meaning: The reader holding the copy.
          - name: dueDate
            type: date
            required: true
            meaning: The day the loan is due.
      classification: internal
      reads:
      - aggregate/lending.loan
      freshness:
        mode: immediate
paging:
  mode: pages
  order: Due date, earliest first.
  cursor: The due date and loan identity of the last row.
  defaultLimit: 25
  maxLimit: 100
steps:
- statement: The reader lists their own loans.
records:
- type: result
  id: result/list-loans.listed
  title: Listed
  outcome: success
  meaning: The loans are listed.
- type: scenario
  id: scenario/list-loans.listing-own-loans-succeeds
  title: Listing own loans succeeds
  given: A reader holds two active loans.
  when: The reader lists their loans.
  then: Both loans are listed.
  result: result/list-loans.listed
