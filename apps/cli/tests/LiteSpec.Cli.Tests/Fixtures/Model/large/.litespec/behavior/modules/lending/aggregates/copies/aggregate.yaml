type: aggregate
id: aggregate/lending.copy
title: Copy
states:
- name: Available
  meaning: The copy sits on its shelf.
- name: OnLoan
  meaning: A reader holds the copy.
- name: Retired
  meaning: The copy left lending.
transitions:
- from: "-"
  to: Available
  movedBy: use-case/lending.register-copy
- from: Available
  to: OnLoan
- from: OnLoan
  to: Available
- from: Available
  to: Retired
  movedBy: use-case/lending.retire-copy
