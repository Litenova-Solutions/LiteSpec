type: problem
id: problem/overdue-loans-pile-up
title: Overdue loans pile up
affects:
  - actor/reader
affectsSegment: Readers with active loans at one lending library.
summary: When a reader holds several loans, each due date lives on its own slip, and the reader finds the dates only at the desk.
statement: Readers lose track of due dates.
costToday: The reader pays a late fee for each overdue copy.
workaroundToday: The reader keeps the paper slips in the copy, and the slips fail when the copy travels without them.
evidence:
  - claim: Readers lose track of due dates across several loans.
    source: https://example.org/library/desk-log
    readOn: 2026-10-01
    kind: reported
