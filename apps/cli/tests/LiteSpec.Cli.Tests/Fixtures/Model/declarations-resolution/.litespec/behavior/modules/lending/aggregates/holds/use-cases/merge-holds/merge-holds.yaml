type: use-case
id: use-case/lending.merge-holds
title: Merge Holds
kind: command
access:
  grant: permission/place-hold
  tenant: own
input:
- name: holdId
  meaning: The hold the librarian merges.
  type: id
  identifies: aggregate/lending.hold
  required: true
  origin: caller
  binding: body
  classification: internal
idempotency:
  mode: key
  key: "{holdId}-{branchId}"
  keyScope: tenant
  replay: refuses
audit:
  exemptBecause: Merges trail in the hold states.
steps:
- statement: The librarian merges the duplicate holds.
