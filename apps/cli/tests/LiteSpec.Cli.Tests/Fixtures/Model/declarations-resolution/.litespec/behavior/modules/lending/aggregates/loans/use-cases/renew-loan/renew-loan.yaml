type: use-case
id: use-case/lending.renew-loan
title: Renew Loan
kind: command
access:
  grant: permission/borrow-copy
  tenant: own
input:
- name: loanId
  meaning: The loan the reader renews.
  type: id
  identifies: aggregate/lending.loan
