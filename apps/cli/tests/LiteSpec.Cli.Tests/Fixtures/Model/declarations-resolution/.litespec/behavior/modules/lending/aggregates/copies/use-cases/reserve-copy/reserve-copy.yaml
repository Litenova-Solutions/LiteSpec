type: use-case
id: use-case/lending.reserve-copy
title: Reserve Copy
kind: command
access:
  grant: permission/borrow-copy
  tenant: own
input:
- name: copy
  meaning: The copy the reader reserves.
  type: id
  identifies: aggregate/lending.copy
  required: true
  origin: caller
  binding: body
  classification: internal
- name: readerId
  meaning: The reader reserving the copy.
  type: id
  identifies: actor/reader
  required: true
  origin: caller
  binding: body
  classification: personal
idempotency:
  mode: key
  key: "{copy}-for-{readerId}"
  keyScope: tenant
  replay: returns-first-result
audit:
  level: required
  category: personal-data-read
  target: copy
  targetKind: aggregate/lending.copy
steps:
- statement: The reader reserves the copy from the shelf.
