type: use-case
id: use-case/lending.return-copy
title: Return copy
kind: command
access:
  grant: permission/borrow-copy
  tenant: own
fulfills:
- requirement/borrowing.loan-period-days
via:
- entry-point/library-app
raises:
- domain-event/loan.loan-returned
inputs:
- name: loanId
  meaning: The loan whose copy the reader returns.
  type: id
  identifies: aggregate/lending.loan
  required: true
  origin: caller
  classification: internal
idempotency:
  mode: none
  reason: Each call returns its own copy, and returning an inactive loan is refused.
audit:
  exemptBecause: Internal state transition covered by its aggregate lifecycle.
steps:
- statement: The reader sends the copy to return.
- statement: Lending returns the copy and raises the returned event.
results:
- id: result/return-copy.returned
  title: Returned
  outcome: success
  meaning: The copy is returned.
- id: result/return-copy.loan-inactive
  title: Loan inactive
  outcome: refusal
  refusal: refusal/lending.loan-not-active
scenarios:
- id: scenario/return-copy.returning-a-borrowed-copy-succeeds
  title: Returning a borrowed copy succeeds
  given: A loan stands active on a copy.
  when: The reader returns the copy.
  then: The loan is returned.
  result: result/return-copy.returned
