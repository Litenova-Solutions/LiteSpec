# yaml-language-server: $schema=https://litespec.dev/4.1.0/schemas/litespec-project.schema.yaml
schemaVersion: 1
project:
  name: Marks Proof Targets Fixture
size: small
shape: server
stacks:
- dotnet
layers:
  intent: litespec
  behavior: litespec
  implementation: litespec
  proof: litespec
reviewedLiteSpecVersion: 4.1.0
paths:
  docs: .litespec
  behaviorDocs: .litespec/behavior
  glossary: .litespec/glossary.yaml
  testResults: results
  testRoots:
  - apps/api/tests
stackConfig:
  dotnet:
    modules: apps/api/src/Library.Application
    domain: apps/api/src/Library.Domain
    webapi:
    - apps/api/src/Library.WebApi
    infrastructure: apps/api/src/Library.Infrastructure
frontends: []
