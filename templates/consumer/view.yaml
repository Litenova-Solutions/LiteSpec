type: view
id: view/reporting.reimbursed-expense
title: Reimbursed Expense
summary: What Reporting keeps about each reimbursed expense to list the payouts per employee.
keyedBy: aggregate/spending.expense
fields:
- name: employeeId
  meaning: The employee the expense was reimbursed to.
  type: id
  of: actor/employee
  from: integration-event/expense-reimbursed#employeeId
  classification: personal
  erasedBy: integration-event/expense-personal-data-erased
- name: amount
  meaning: The exact amount paid.
  type: decimal
  from: integration-event/expense-reimbursed#amount
  classification: internal
- name: currency
  meaning: The ISO 4217 currency code of the amount.
  type: text
  from: integration-event/expense-reimbursed#currency
  classification: internal
- name: reimbursedAt
  meaning: The time the payment was posted.
  type: date-time
  from: integration-event/expense-reimbursed#reimbursedAt
  classification: internal
freshness: PT5S
terms:
- term/expense
