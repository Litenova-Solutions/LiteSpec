  base: base-ui
  cssVariables: true
  baseColor: neutral
  theme: neutral
  chartColor: neutral
  font: geist
  fontHeading: inherit
  icons: lucide
  radius: default
  menuAccent: subtle
  menuColor: default
  componentsStyle: base-nova
registry:
