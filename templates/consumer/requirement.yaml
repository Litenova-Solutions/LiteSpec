# A requirement under a feature carries id requirement/<feature>.<name> in its feature's requirements folder.
# A product requirement carries id requirement/<name> at intent/requirements/<name>/ and cites at least one constraint, goal or problem.
type: requirement
id: requirement/<feature>.<name>
title: <Title in Title Case>
terms:
- <term id, or remove this line>
kind: <functional|quality|policy>
statement: <what the product does or guarantees, in one sentence>
rationale: <why the product promises it, in one sentence>
values:
- value: <the policy value>
  effectiveFrom: <date the value takes effect, such as 2026-02-10>
stimulus: <what happens, for a quality requirement, or remove this line>
environment: <what surrounds it, for a quality requirement, or remove this line>
response: <what the product does, for a quality requirement, or remove this line>
measure: <how the response is read, for a quality requirement, or remove this line>
target: <the value the response must reach, or remove this line>
conditions: <when the requirement holds, or remove this line>
check: <the check that confirms it, or remove this line>
runsOn: <pull-request|nightly|pre-release|production, or remove this line>
evidence: <where the confirmation is read, or remove this line>
cites:
- <goal, vision, problem, feature, constraint, research or decision id, or remove this line>
except:
- condition: <when the rule does not hold>
  fallback: requirement/<feature>.<name>
setBy: <product|operator|tenant, or remove this line>
