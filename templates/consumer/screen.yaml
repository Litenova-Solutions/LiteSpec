type: screen
id: screen/<home>.<name>
title: <Title in Title Case>
terms:
- <term id, or remove this line>
summary: <what a person does on this screen, or remove this line>
# A screen carries route or host, never both.
route: <route address, such as /expenses>
offers:
- use-case/<module>.<name, or remove this line>
serves:
- step/<flow>.<act>
fulfills:
- requirement/<feature>.<name, or remove this line>
pageFrame:
  pattern: <page frame pattern, such as list-page>
  option: <chosen option>
primaryAction: <use-case id shown as the primary action, or remove this line>
fieldSources:
- field: <a field the screen shows, spelled as the use case spells it>
  from: <use-case id the screen offers that outputs or accepts the field>
task: <the job the person does here, in one to three sentences>
displayStates:
- name: <State, such as Empty or Loading>
  shows: <what the screen shows in this state, in one sentence>
leadsTo:
- screen/<home>.<name, or remove this line>
