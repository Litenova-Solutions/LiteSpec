type: runbook
id: runbook/clear-stuck-reimbursements
title: Clear Stuck Reimbursements
trigger: The stuck-payout alert fires.
severity: Stuck reimbursements block payouts.
impact: Stuck reimbursements block employee payouts and breach the two-day promise.
prerequisites: The on-call engineer holds production database access and the team channel is open.
procedure: Record the stuck batch, rerun its payout, then verify every reimbursement.
verification: The payout ledger shows every stuck reimbursement as paid.
recovery: Rerun the payout from the last recorded checkpoint, and queued payouts resume on their own.
escalation: Page the on-call engineer with the stuck batch id when the rerun fails twice.
terms:
  - term/expense
