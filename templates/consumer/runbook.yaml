type: runbook
id: runbook/slow-submissions
title: Slow Submissions
summary: How an operator finds why expense submissions answer slowly and restores the response time.
trigger: The submission-acknowledgement-slow alert fires.
severity: high
impact: Submissions queue past the promised two seconds, and month-end filers wait on acknowledgements.
prerequisites: Access to the submission dashboard and the acknowledgement queue.
procedure: List the unacknowledged submissions. Restart the stuck acknowledgement worker. Notify finance of the batch that still stands.
verification: New submissions acknowledge within two seconds again.
recovery: "A submission acknowledged twice stays single: the submission id deduplicates the retry."
escalation: When the queue still stands after one retry round, the on-call engineer pages the backend owner and freezes new deploys.
