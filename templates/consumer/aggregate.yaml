type: aggregate
id: aggregate/<module>.<name>
title: <Title in Title Case>
terms:
- <term id, or remove this line>
summary: <what this aggregate keeps true, or remove this line>
parts:
- <child entity or value object name, or remove this line>
states:
- name: <State>
  meaning: <what makes it true>
transitions:
- from: <state, or - for creation>
  to: <state>
  movedBy: <use-case/<module>.<name>, or remove this line>
  after: <delay before a timed move, such as P7Y, or remove this line>
data:
- name: <field name>
  meaning: <what the field holds>
  classification: <public|internal|personal|sensitive>
  dataClass: <data class name>
dataClasses:
- name: <data class name>
  classification: <public|internal|personal|sensitive>
  fields:
  - <field name>
  onErasure: <erase|pseudonymize|anonymize|retain|exempt>
  basis:
  - <constraint, requirement or decision id>
  period: <how long the class is kept, such as P7Y>
  periodStartsAt: <domain event starting the period, or a range such as creation to erasure>
  enforcedBy:
  - <job/<module>.<name> or use-case/<module>.<name>>
  purpose: <why the data is kept>
  reason: <why this class is exempt, or remove this line>
  reach: <own-tenant|subject-wide|platform-wide, or remove this line>
  exceptions:
  - field: <field name>
    onErasure: <erase|pseudonymize|anonymize|retain|exempt>
records:
- type: domain-event
  id: domain-event/<aggregate>.<name>
  title: <Title in Title Case>
  terms:
  - <term id, or remove this line>
  meaning: <the completed fact, in one sentence>
  carries:
  - name: <field name>
    type: id
    of: <identified record id>
  - name: <field name>
    type: <text|integer|decimal|money|boolean|date|date-time|duration|email|choice|id|list|file>
  # A choice field carries choices, and a file field carries contentTypes and maxSize.
