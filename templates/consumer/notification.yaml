type: notification
id: notification/<module>.<name>
title: <Title in Title Case>
terms:
- <term id, or remove this line>
summary: <what the message says and who gets it, or remove this line>
template: <template key>
audience:
- actor/<name>
channel:
- <email|sms|push>
deliveredThrough: external-system/<name>
requiresConsent: rule/<home>.<name, or remove this line>
frequency: <once|per-attempt>
dedupKey: <dedup template, such as reminder-{expenseId}>
params:
- <parameter name>
locale: <the languages the template ships, such as English only>
suppressedWhen: <when no message goes out, or remove this line>
claims:
- claim: <what the message promises>
  requirement: requirement/<feature>.<name>
fulfills:
- requirement/<feature>.<name, or remove this line>
