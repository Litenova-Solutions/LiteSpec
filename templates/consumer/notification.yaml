type: notification
id: notification/spending.approval-reminder
title: Approval Reminder
summary: The approver opens the reminder and decides the expense.
template: approval-reminder
addresses:
  - actor/employee
channel:
  - email
consent: SMS only with consent.
frequency: once
dedupKey: reminder-{expenseId}
params:
  - expenseId
  - dueDate
locale: The approver profile language.
suppressedWhen: The expense is decided before the run.
claims:
  - claim: The reminder names the true amount due.
    requirement: requirement/approval-reminders.decided-within-five-days
fulfills:
  - requirement/approval-reminders.decided-within-five-days
terms:
  - term/expense
