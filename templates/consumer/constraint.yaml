type: constraint
id: constraint/<name>
title: <Title in Title Case>
terms:
- <term id, or remove this line>
summary: <the outside rule, in one sentence>
authority: <who states the rule>
# A source carries url or path, never both.
sources:
- name: <source name>
  url: <source page>
  readOn: <date read, such as 2026-02-10>
  publishedOn: <date published, such as 2026-01-15, or remove this line>
effectiveFrom: <date the rule takes effect, such as 2026-02-10, or remove this line>
basedOn:
- research/<name, or remove this line>
kind: <technical|organizational|convention|legal>
applies: <true|false>
appliesBecause: <why the rule binds the product, or why it binds nothing>
coverage: <which subjects, transactions and periods the rule covers, in one to three sentences>
obligations:
- statement: <one outside rule, in one sentence>
  sources:
  - <source name>
productEffect: <what the rule does to the product, in one to three sentences>
openPoints:
- <one unsettled point, in one sentence, or remove this line>
