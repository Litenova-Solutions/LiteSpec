type: product
id: product/claimwick
title: Claimwick
summary: |-
  The company submits work expenses with receipts.

  Employees submit and attach. Managers approve and reject. Finance reimburses.
boundary: Claimwick submits, approves, and reimburses work expenses with receipts.
addresses:
- actor/employee
- actor/manager
- actor/finance
brand:
  reader: An employee submits expenses from a phone, and a manager decides them between meetings.
  accountableFor: Every screen shows what each expense waits for.
  is:
  - calm
  - plain
  - exact
  isNot:
  - playful
  - dense
  - showy
  do:
  - Every screen shows each amount with its currency code.
  - Lead with the action the reader can take now.
  - Put the deadline beside the work, never in a tooltip.
  - Say what a disabled control is waiting for.
  doNot:
  - Do not decorate. A border earns its place, a color earns its place, and nothing else does.
  - Do not nest a card inside a card.
  - Do not ship a button whose success is a paragraph. Success is a role=status announcement, and failure is role=alert.
