# yaml-language-server: $schema=https://litespec.dev/7.0.0/schemas/litespec-project.schema.yaml
schemaVersion: 1
project:
  name: __PROJECT__
size: small
shape: server
stacks:
- dotnet
- svelte
layers:
  intent: litespec
  behavior: litespec
  implementation: litespec
  proof: litespec
reviewedLiteSpecVersion: 7.0.0
# problemTypeBase names the URI prefix of every problem type, with a trailing slash. Without it, a code's problem type is the code's part after its module.
# problemTypeBase: https://example.com/problems/
screenshots:
  galleries:
  - apps/web/test-results/gallery
  pattern: '{route}--{theme}--{width}.png'
paths:
  docs: .litespec
  behaviorDocs: .litespec/behavior
  testRoots:
  - apps/api/tests
stackConfig:
  dotnet:
    modules: apps/api/src/Modules/*
    kernel: apps/api/src/__PROJECT__.Kernel
    platform: apps/api/src/__PROJECT__.Platform
frontends:
- name: web
  path: apps/web
  platform: svelte
  ui:
    profile: application-balanced
    globalCss: apps/web/src/styles.css
ui:
  # limits tunes the screen-composition checks: sections caps stacked sections per page, formFields caps fields before a form groups, offers caps use cases before a screen takes a hub frame. Defaults are 3, 6 and 4.
  # limits:
  #   sections: 3
  #   formFields: 6
  #   offers: 4
  package:
    name: '@__PROJECT__/ui'
    path: packages/ui
    componentsJson: packages/ui/components.json
    primitives: packages/ui/src/components
    tokens: packages/ui/src/styles/tokens.css
    sourceLock: packages/ui/ui-source-lock.yaml
    designContract: packages/ui/DESIGN.md
    publicExports:
    - '@__PROJECT__/ui/floorplans'
selectedExtensions: []
