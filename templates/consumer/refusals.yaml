- code: spending.receipt-missing
  meaning: The expense is above the receipt threshold and carries no receipt.
  problemType: https://claimwick.dev/problems/receipt-missing
- code: spending.nothing-approved
  meaning: No approved expense awaits the export.
  problemType: https://claimwick.dev/problems/nothing-approved
- code: spending.negative-threshold
  meaning: The threshold is negative.
  problemType: https://claimwick.dev/problems/negative-threshold
- code: spending.expense-decided
  meaning: The expense is already decided.
  problemType: https://claimwick.dev/problems/expense-decided
- code: spending.retention-not-ended
  meaning: The retention of the expense has not ended.
