type: use-case
id: use-case/spending.submit-expense
title: Submit Expense
owner: claimwick-team
status: draft
decider: claimwick-team
decideBy: 2026-12-15
purpose: The employee submits an expense for approval.
whatHappens: Claimwick validates the expense, stores it, and notifies the approver.
exposure: The claimwick-app entry point reaches it, guarded by permission/submit-expense.
kind: command
access:
  grant: permission/submit-expense
  tenant: own
serves:
  - journey/submit-and-reimburse#s2
fulfills:
  - requirement/approval.decided-within-five-days
reachedThrough:
  - entry-point/claimwick-app
raises:
  - event/expense.submitted
input:
  - name: amount
    meaning: The claimed amount in euros.
    type: money
    required: true
    rules:
      - The amount is above zero.
    origin: caller
    classification: internal
output:
  - name: expenseId
    meaning: The submitted expense.
paging:
  mode: pages
  order: submittedAt descending
  cursor: submittedAt
  defaultLimit: 20
  maxLimit: 100
changes:
  - aggregate/spending.expense
reads:
  - setting/spending.receipt-threshold
consistency:
  mode: atomic
effects:
  - runs: use-case/spending.approve-expense
    timing: inline
    sharesTransaction: true
    onFailure:
      mode: retry
      retry:
        maxAttempts: 3
        initialDelay: PT10S
        maxDelay: PT5M
        backoff: exponential
      then: dead-letter
      deadLetter:
        after: P30D
        action: The on-call engineer replays the dead letter.
      surfacesIn: entry-point/claimwick-app
      runbook: runbook/clear-stuck-reimbursements
    before: The approval reminder goes first.
    forEach: Each approver.
  - sends: notification/spending.approval-reminder
    timing: after-commit
    onFailure:
      mode: skip-and-log
      surfacesIn: entry-point/claimwick-app
      runbook: runbook/clear-stuck-reimbursements
    before: The payout runs after it.
    forEach: Each submitted expense.
idempotency:
  mode: key
  key: submit-{amount}
  scope: tenant
audit:
  level: required
  target: The expense ledger.
background: The employee holds an undecided expense.
risk:
  - money
terms:
  - term/expense
questions:
  - question: Which approver covers expenses above the receipt threshold?
    decider: claimwick-team
    decideBy: 2026-11-30
    ballot: approval
    recommendation: The finance lead approves expenses above the threshold.
records:
  - type: result
    id: result/submit-expense.submitted
    title: Submitted
    outcome: success
    meaning: The expense is submitted for approval.
    codes:
      - spending.submitted
  - type: result
    id: result/submit-expense.receipt-missing
    title: Receipt Missing
    outcome: refusal
    code: spending.receipt-missing
    meaning: The expense has no receipt attached.
    recorded: true
  - type: scenario
    id: scenario/submit-expense.submitting-with-a-receipt-succeeds
    title: Submitting With a Receipt Succeeds
    given: The employee holds a receipt for the expense.
    when: The employee submits the expense.
    then: The expense is submitted for approval.
    result: result/submit-expense.submitted
    exercises:
      - rule/expense.receipt-required-above-threshold
    examples:
      - amount: "120.00"
        receiptAttached: "true"
