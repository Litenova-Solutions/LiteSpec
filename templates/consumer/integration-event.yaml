type: integration-event
summary: <what this event carries across the product boundary, or remove this line>
id: integration-event/<name>
title: <Title in Title Case>
terms:
- <term id, or remove this line>
# An outbound event carries translates; an inbound one carries arrivesThrough and correlation instead.
action: <send|receive>
eventType: <CloudEvents type>
source: <CloudEvents source>
subject: <what the event is about>
payload:
- name: <field name>
  meaning: <what the field holds>
  classification: <public|internal|personal|sensitive>
  type: id
  identifies: <identified record id>
- name: <field name>
  meaning: <what the field holds>
  classification: <public|internal|personal|sensitive>
  type: <text|integer|decimal|money|boolean|date|date-time|duration|email|choice|id|list|file>
  many: <true|false, or remove this line>
  required: <true|false, or remove this line>
# A choice field carries choices, and a file field carries contentTypes and maxSize.
through: external-system/<name>
arrivesThrough: <entry-point/<name> or external-system/<name>, or remove this line>
delivery: <what delivery the event needs, or remove this line>
requires: permission/<name, or remove this line>
trust: <trigger-only|payload, or remove this line>
correlation: <how the receiver matches the event, or remove this line>
translates: domain-event/<aggregate>.<name>
dataschema: <schema URL, or remove this line>
compatibility: <how the contract stays stable when the event changes, in one to three sentences>
