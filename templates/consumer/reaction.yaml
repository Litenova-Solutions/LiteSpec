type: reaction
id: reaction/<module>.<name>
title: <Title in Title Case>
terms:
- <term id, or remove this line>
summary: <what answers what, and what it does in response, or remove this line>
triggeredBy:
- domain-event/<aggregate>.<name>
skippedWhen: <when the reaction stands down, or remove this line>
compensates: use-case/<module>.<name, or remove this line>
effects:
- sends: notification/<module>.<name>
  timing: <inline|after-commit|async, or remove this line>
  onFailure:
    mode: <retry|skip-and-log|discard>
    retry:
      maxAttempts: <how many tries>
      initialDelay: <first wait, such as PT1M>
      maxDelay: <longest wait, such as PT1H>
      backoff: <exponential|fixed>
    ifExhausted: dead-letter
    deadLetter:
      after: <how long the failure is kept, such as P1D>
      action: <what happens to the exhausted effect>
  onExhausted: <what happens after every retry, or remove this line>
  before: <what runs before the effect, or remove this line>
  forEach: <what the effect repeats over, or remove this line>
# An effect runs a use case with runs, or calls an outside operation with calls, instead of sends.
outcomes:
- name: completed
  meaning: <what completed means>
- name: skipped
  meaning: <what skipped means>
- name: failed
  meaning: <what failed means>
fulfills:
- requirement/<feature>.<name, or remove this line>
serves:
- flow/<name>#s1
onFailure:
  mode: <retry|skip-and-log|discard>
  retry:
    maxAttempts: <how many tries>
    initialDelay: <first wait, such as PT1M>
    maxDelay: <longest wait, such as PT1H>
    backoff: <exponential|fixed>
  ifExhausted: dead-letter
  deadLetter:
    after: <how long the failure is kept, such as P1D>
    action: <what happens to the exhausted reaction>
  surfacesIn: entry-point/<name, or remove this line>
  runbook: runbook/<name, or remove this line>
idempotency:
  mode: <key|state|none>
  key: <key template, such as reminder-{expenseId}, or remove this line>
  scope: <tenant|account|login|global, or remove this line>
  replay: <returns-first-result|refuses|acts-again, or remove this line>
  recognizedBy: <the state that shows a repeat, or remove this line>
  reason: <why this reaction needs no idempotency, or remove this line>
reads:
- <aggregate/<module>.<name>, setting/<module>.<name>, read-model/<module>.<name> or reference-data/<module>.<name>, or remove this line>
records:
- type: scenario
  id: scenario/<reaction>.<name>
  title: <Title in Title Case>
  terms:
  - <term id, or remove this line>
  given: <the situation>
  when: <the trigger fires>
  then: <the expected effect>
  outcome: completed
  exercises:
  - rule/<home>.<name, or remove this line>
