type: setting-set
title: Spending Settings
owner: claimwick-team
status: draft
decider: claimwick-team
decideBy: 2026-12-15
purpose: Each spending run reads its limits from one place.
whatHappens: Operators change limits without a deploy.
records:
  - type: setting
    id: setting/spending.receipt-threshold
    title: Receipt Threshold
    valueType: money
    default: 25.00 EUR
    range: 0.00 EUR..1000.00 EUR
    unit: EUR
    setBy: decider
    atBound: refuse
    secret: false
    fulfills:
      - requirement/approval.decided-within-five-days
