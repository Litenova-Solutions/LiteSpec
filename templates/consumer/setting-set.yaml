type: setting-set
title: Spending Settings
summary: Each spending run reads its limits from one place.
records:
  - type: setting
    id: setting/spending.receipt-threshold
    title: Receipt Threshold
    valueType: money
    default: 25.00 EUR
    range: 0.00 EUR..1000.00 EUR
    unit: EUR
    setBy: product
    atBound: refuse
    secret: false
    fulfills:
      - requirement/approval-reminders.decided-within-five-days
