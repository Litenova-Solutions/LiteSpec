uiBaseline:
  platform: react
  system: shadcn/ui
  styling: tailwindcss-v4
  base: base-ui
  style: nova
  cssVariables: true
  baseColor: neutral
  theme: neutral
  chartColor: neutral
  font: geist
  fontHeading: inherit
  icons: lucide
  radius: default
  menuAccent: subtle
  menuColor: default
  componentsStyle: base-nova
  sourceModel: shared-ui-package
  registry:
    name: shadcn
    url: 'https://ui.shadcn.com'
    allowAdditional: true
  nativeBoundary: separate-platform-profile
uiBaselineSvelte:
  platform: svelte
  system: shadcn-svelte
  styling: tailwindcss-v4
  base: bits-ui
  style: nova
  cssVariables: true
  baseColor: neutral
  theme: neutral
  chartColor: neutral
  font: geist
  fontHeading: inherit
  icons: lucide
  radius: default
  menuAccent: subtle
  menuColor: default
  componentsStyle: base-nova
  sourceModel: shared-ui-package
  registry:
    name: shadcn-svelte
    url: 'https://shadcn-svelte.com/registry'
    allowAdditional: true
  nativeBoundary: separate-platform-profile
