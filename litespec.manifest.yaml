# yaml-language-server: $schema=./schemas/litespec-manifest.schema.yaml
schemaVersion: 6
version: 7.0.0
name: litespec
agentsEntry: AGENTS.md
stacks:
  dotnet:
    folder: docs/packs/dotnet
    kind: backend
  svelte:
    folder: docs/packs/svelte
    kind: frontend
  android:
    folder: docs/packs/android
    kind: frontend
shapes:
  server:
    backendStacks: 1
  client-only:
    backendStacks: 0
    backendPages:
    - docs/core/backend-architecture.md
    - docs/core/backend-domain.md
    - docs/core/backend-application.md
extensions:
  delivery:
    path: docs/ext/delivery.md
    activationScope: project
    replaces: []
    switchesOn:
    - setting
    - runbook
  ai-mcp:
    path: docs/ext/ai-mcp.md
    activationScope: project
    replaces: []
    switchesOn: []
  compat:
    path: docs/ext/compat.md
    activationScope: project
    replaces: []
    switchesOn: []
  realtime:
    path: docs/ext/realtime.md
    activationScope: local
    applicableKinds:
    - use-case
    - flow
    replaces: []
    switchesOn: []
  plans:
    path: docs/ext/plans.md
    activationScope: project
    replaces: []
    switchesOn: []
stack:
  dotnet: '10'
  android: '36'
  postgresql: '18'
  node: 24.22.0
  pnpm: 11.28.5
packages:
  nuget:
    Aspire.Hosting.AppHost: 13.x
    Aspire.Hosting.JavaScript: 13.x
    Aspire.Hosting.PostgreSQL: 13.x
    AwesomeAssertions: 9.x
    dotnet-stryker: 5.x
    EFCore.NamingConventions: 10.x
    FsCheck: 3.x
    LightBDD.XUnit3: 3.x
    LiteBus.Analyzers: 8.0.0-preview.8
    LiteBus.Auditing: 8.0.0-preview.8
    LiteBus.Auditing.Abstractions: 8.0.0-preview.8
    LiteBus.Auditing.Storage.Marten: 8.0.0-preview.8
    LiteBus.Commands: 8.0.0-preview.8
    LiteBus.Commands.Abstractions: 8.0.0-preview.8
    LiteBus.Commands.Recurring: 8.0.0-preview.8
    LiteBus.Events: 8.0.0-preview.8
    LiteBus.Events.Abstractions: 8.0.0-preview.8
    LiteBus.Extensions.AspNetCore: 8.0.0-preview.8
    LiteBus.Extensions.Microsoft.DependencyInjection: 8.0.0-preview.8
    LiteBus.Messaging: 8.0.0-preview.8
    LiteBus.Messaging.Abstractions: 8.0.0-preview.8
    # The pinned pipeline binding needs the LiteBus 8.0.0-preview.8 APIs, including the auditing, dispatch, storage, extensions, ASP.NET Core problem details, and durable-messaging test pins.
    LiteBus.Outbox: 8.0.0-preview.8
    LiteBus.Outbox.Abstractions: 8.0.0-preview.8
    LiteBus.Outbox.Dispatch.Amqp: 8.0.0-preview.8
    LiteBus.Outbox.Dispatch.InProcess: 8.0.0-preview.8
    LiteBus.Outbox.Dispatch.Kafka: 8.0.0-preview.8
    LiteBus.Outbox.Extensions.OpenTelemetry: 8.0.0-preview.8
    LiteBus.Outbox.Storage.EntityFrameworkCore: 8.0.0-preview.8
    LiteBus.Outbox.Storage.Marten: 8.0.0-preview.8
    LiteBus.Outbox.Storage.PostgreSql: 8.0.0-preview.8
    LiteBus.Queries: 8.0.0-preview.8
    LiteBus.Queries.Abstractions: 8.0.0-preview.8
    LiteBus.Storage.PostgreSql: 8.0.0-preview.8
    LiteBus.Testing.DurableMessaging: 8.0.0-preview.8
    LiteBus.Testing.Mediation: 8.0.0-preview.8
    LiteSpec.Analyzers: 7.0.0
    Marten: 9.x
    Microsoft.AspNetCore.Authentication.JwtBearer: 10.x
    Microsoft.AspNetCore.DataProtection: 10.x
    Microsoft.AspNetCore.Mvc.Testing: 10.x
    Microsoft.AspNetCore.OpenApi: 10.x
    Microsoft.EntityFrameworkCore: 10.x
    Microsoft.Extensions.ApiDescription.Server: 10.x
    Microsoft.Extensions.Configuration.Abstractions: 10.x
    Microsoft.Extensions.DependencyInjection.Abstractions: 10.x
    Microsoft.Extensions.Diagnostics.HealthChecks: 10.x
    Microsoft.Extensions.Diagnostics.HealthChecks.Abstractions: 10.x
    Microsoft.Extensions.Hosting.Abstractions: 10.x
    Microsoft.Extensions.Http: 10.x
    Microsoft.Extensions.Http.Resilience: 10.x
    Microsoft.Extensions.Logging.Abstractions: 10.x
    Microsoft.Extensions.ServiceDiscovery: 10.x
    Microsoft.NET.Test.Sdk: 18.x
    Microsoft.OpenApi: 2.x
    Microsoft.Testing.Extensions.CodeCoverage: 18.x
    Microsoft.Testing.Extensions.TrxReport: 2.x
    NSubstitute: 6.x
    Npgsql: 10.x
    Npgsql.EntityFrameworkCore.PostgreSQL: 10.x
    OpenTelemetry.Exporter.OpenTelemetryProtocol: 1.x
    OpenTelemetry.Extensions.Hosting: 1.x
    OpenTelemetry.Instrumentation.AspNetCore: 1.x
    OpenTelemetry.Instrumentation.Http: 1.x
    OpenTelemetry.Instrumentation.Runtime: 1.x
    Scalar.AspNetCore: 2.x
    Testcontainers.PostgreSql: 4.x
    WireMock.Net: 2.x
    YamlDotNet: 18.x
    xunit.runner.visualstudio: 4.x
    xunit.v3: 4.x
    xunit.v3.mtp-v2: 3.x
  npm:
    "@astrojs/svelte": 9.x
    "@axe-core/playwright": 4.x
    "@eslint/js": 10.x
    "@fontsource-variable/geist": 5.x
    "@fontsource-variable/inter": 5.x
    "@fontsource-variable/source-serif-4": 5.x
    "@hey-api/openapi-ts": 0.x
    "@lucide/svelte": 1.x
    "@modelcontextprotocol/server": 2.x
    "@playwright/test": 1.x
    "@stryker-mutator/core": 10.x
    "@stryker-mutator/vitest-runner": 10.x
    "@sveltejs/adapter-node": 6.x
    "@sveltejs/adapter-static": 4.x
    "@sveltejs/kit": 3.x
    "@sveltejs/vite-plugin-svelte": 7.x
    "@tailwindcss/cli": 4.x
    "@tailwindcss/vite": 4.x
    "@tanstack/eslint-plugin-query": 5.x
    "@tanstack/eslint-plugin-router": 1.x
    "@tanstack/router-cli": 1.x
    "@tanstack/router-plugin": 1.x
    "@tanstack/svelte-form": 1.x
    "@tanstack/svelte-query": 6.x
    "@tanstack/svelte-query-devtools": 6.x
    "@tanstack/svelte-table": 9.x
    "@testing-library/svelte": 5.x
    "@types/node": 26.x
    bits-ui: 2.x
    class-variance-authority: 0.x
    clsx: 2.x
    date-fns: 4.x
    eslint: 10.x
    eslint-plugin-svelte: 3.x
    globals: 17.x
    jsdom: 30.x
    jsqr: 1.x
    msw: 3.x
    shadcn-svelte: 1.7.0
    svelte: 5.x
    svelte-check: 4.x
    svelte-i18n: 4.x
    tailwind-merge: 3.x
    tailwindcss: 4.x
    tw-animate-css: 1.x
    typescript: 6.x
    typescript-eslint: 8.x
    vite: 8.x
    vitest: 5.x
    yaml: 2.x
    zod: 4.x
# The baseline values are defaults that pass every token limit on docs/packs/svelte/ui-primitives.md. A project keeps them or sets its own values; values that meet the limits need no waiver.
uiBaseline:
  platform: svelte
  system: shadcn-svelte
  styling: tailwindcss-v4
  base: bits-ui
  style: nova
  cssVariables: true
  baseColor: neutral
  theme: neutral
  chartColor: neutral
  font: geist
  fontHeading: inherit
  icons: lucide
  radius: default
  menuAccent: subtle
  menuColor: default
  componentsStyle: base-nova
  sourceModel: shared-ui-package
  registry:
    name: shadcn-svelte
    url: 'https://shadcn-svelte.com/registry'
    allowAdditional: true
  nativeBoundary: separate-platform-profile
