# yaml-language-server: $schema=./schemas/litespec-manifest.schema.yaml
schemaVersion: 6
version: 5.1.0
name: litespec
agentsEntry: AGENTS.md
stacks:
  dotnet:
    folder: docs/backend/dotnet
  react:
    folder: docs/frontend/web/react
  svelte:
    folder: docs/frontend/web/svelte
  blazor:
    folder: docs/frontend/blazor
  android:
    folder: docs/frontend/mobile/android
shapes:
  server:
    backendStacks: 1
  client-only:
    backendStacks: 0
    backendPages:
    - docs/backend/architecture.md
    - docs/backend/domain.md
    - docs/backend/application.md
extensions:
  bdd:
    path: docs/backend/dotnet/ext/bdd.md
    activationScope: local
    applicableKinds:
    - use-case
    - journey
    replaces: []
    switchesOn:
    - scenario
  compat:
    path: docs/ext/compat.md
    activationScope: project
    replaces: []
    switchesOn: []
  cache:
    path: docs/ext/cache.md
    activationScope: local
    applicableKinds:
    - use-case
    replaces: []
    switchesOn:
    - setting
  concurrency:
    path: docs/ext/concurrency.md
    activationScope: local
    applicableKinds:
    - module
    - aggregate
    - use-case
    replaces: []
    switchesOn:
    - setting
  lifecycle:
    path: docs/ext/lifecycle.md
    activationScope: local
    applicableKinds:
    - use-case
    - rule
    replaces: []
    switchesOn:
    - setting
  integrations:
    path: docs/ext/integrations.md
    activationScope: local
    applicableKinds:
    - use-case
    - rule
    - journey
    replaces: []
    switchesOn: []
  audit:
    path: docs/ext/audit.md
    activationScope: project
    replaces:
    - 'litespec/quality/security#record-security-audit-events'
    switchesOn: []
  locale:
    path: docs/ext/locale.md
    activationScope: project
    replaces: []
    switchesOn: []
  mcp:
    path: docs/ext/mcp.md
    activationScope: project
    replaces: []
    switchesOn: []
  tenancy:
    path: docs/ext/tenancy.md
    activationScope: project
    replaces: []
    switchesOn: []
  plans:
    path: docs/ext/plans.md
    activationScope: project
    replaces: []
    switchesOn: []
  outbox:
    path: docs/ext/outbox.md
    activationScope: local
    applicableKinds:
    - use-case
    replaces:
    - 'litespec/backend/persistence#collect-events-without-a-public-unit-of-work'
    switchesOn:
    - event
    - setting
    - runbook
  realtime:
    path: docs/ext/realtime.md
    activationScope: local
    applicableKinds:
    - use-case
    - journey
    replaces: []
    switchesOn: []
  layer-projects:
    path: docs/backend/dotnet/ext/layer-projects.md
    activationScope: project
    replaces:
    - 'litespec/backend/architecture#organize-code-by-module-aggregate-and-use-case'
    - 'litespec/backend/dotnet/architecture#separate-the-shared-kernel-from-the-modules'
    - 'litespec/backend/dotnet/architecture#keep-host-endpoints-in-hosts'
    - 'litespec/backend/dotnet/architecture#mirror-modules-aggregates-and-use-cases-in-one-namespace-tree'
    - 'litespec/workspace/dependencies#follow-the-declared-dependency-graph'
    - 'litespec/workspace/dependencies#keep-domain-dependency-free'
    - 'litespec/workspace/dependencies#keep-application-free-of-provider-packages'
    - 'litespec/workspace/dependencies#assign-each-baseline-package-to-its-owning-layer'
    - 'litespec/backend/dotnet/packages#run-litespec-analyzers-in-the-business-projects-and-hosts'
    - 'litespec/backend/dotnet/domain#use-the-domain-layer-folder-layout'
    - 'litespec/backend/dotnet/application#use-the-use-case-folder-layout'
    - 'litespec/backend/dotnet/api#place-endpoints-in-their-use-case-folders'
    - 'litespec/backend/dotnet/persistence#use-the-persistence-layer-folder-layout'
    - 'litespec/backend/testing#keep-the-test-suites-the-size-requires'
    - 'litespec/workspace/structure#keep-production-and-test-code-separate'
    switchesOn: []
  jobs:
    path: docs/ext/jobs.md
    activationScope: local
    applicableKinds:
    - job
    - use-case
    - journey
    replaces:
    - 'litespec/backend/architecture#declare-the-execution-host-for-work-that-outlives-a-request'
    switchesOn:
    - setting
    - runbook
  stage:
    path: docs/ext/stage.md
    activationScope: project
    replaces: []
    switchesOn: []
  delivery:
    path: docs/ext/delivery.md
    activationScope: project
    replaces: []
    switchesOn:
    - setting
    - runbook
  devices:
    path: docs/ext/devices.md
    activationScope: local
    applicableKinds:
    - entry-point
    replaces: []
    switchesOn: []
  customer-rules:
    path: docs/ext/customer-rules.md
    activationScope: project
    replaces: []
    switchesOn: []
  ai:
    path: docs/ext/ai.md
    activationScope: local
    applicableKinds:
    - use-case
    replaces: []
    switchesOn: []
