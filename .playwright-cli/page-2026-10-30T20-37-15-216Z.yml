          - heading "What NightHall Is" [level=2] [ref=e11674]
          - paragraph [ref=e11676]:
            - text: "NightHall is software for event organizers. It runs the whole event cycle in one product: plan, promote, presale, sell, audience, fan club, pre-event, event day, post-event, and money. Every stage reads and writes one record. A follower who pre-registers becomes the buyer, the guest at the door, and the member who hears about the next presale first. Ticketing is the entry point: organizers search for ticketing, and the first sale is the first thing a new organizer does. What each stage offers is indexed on the"
            - link "capabilities" [ref=e11677] [cursor=pointer]:
              - /url: capabilities.md
            - text: page.
        - generic [ref=e11678]:
          - heading "Who It Is For" [level=2] [ref=e11679]
          - generic [ref=e11680]:
            - paragraph [ref=e11681]: The paying customer is the recurring independent organizer in Germany, Belgium and the Netherlands. Club nights, small festivals, and small venues sell general admission with a team of one to five. Each moves 2,000 to 50,000 tickets a year.
            - paragraph [ref=e11682]:
              - text: "The buyer pays nothing to NightHall: a consumer who buys as a guest, finds the order again, and gets through the door. Door staff admit buyers at the gate, correct names, and resolve conflicts while the doors are open. Buyer and organizer surfaces ship in English, Dutch, German and French. Who exactly, and who is refused, is stated on the"
              - link "organizers" [ref=e11683] [cursor=pointer]:
